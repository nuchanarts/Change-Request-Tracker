<script>
  /* Views: pure render functions (state → HTML). Business rules come only from Domain (constitution XII). */
  var Views = (function () {
    'use strict';
    var D = Domain;
    var esc = UI.esc;

    // ------------------------------------------------------------------ shared bits

    function filterBar(state) {
      var f = state.filters;
      var o = state.options;
      var devs = [D.UNASSIGNED].concat(o.developer || []);
      var active = ['platform', 'pm', 'developer', 'urgency', 'from', 'to'].filter(function (k) { return f[k]; }).length;
      return (
        '<form class="filters' + (active ? ' is-active' : '') + '" id="filters" aria-label="ตัวกรอง">' +
        '<div class="filters-head"><span class="filters-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg></span>' +
        '<strong>ตัวกรอง</strong><span class="filters-count">' + (active ? 'ใช้อยู่ ' + active + ' ตัว' : 'แสดงทุกรายการ') + '</span>' +
        (active ? '<button type="button" class="btn small filters-clear" data-action="clear-filters">' + UI.withIcon('clear', 'ล้างตัวกรอง') + '</button>' : '') + '</div>' +
        UI.select({ name: 'platform', label: 'แพลตฟอร์ม', icon: 'platform', options: o.platform, value: f.platform, emptyLabel: 'ทั้งหมด' }) +
        pmFilterSelect(o.pm || [], f.pm) +
        UI.select({ name: 'developer', label: 'นักพัฒนา', icon: 'dev', options: devs, value: f.developer, emptyLabel: 'ทั้งหมด' }) +
        UI.select({ name: 'urgency', label: 'ความเร่งด่วน', icon: 'urgency', options: o.urgency, value: f.urgency, emptyLabel: 'ทั้งหมด' }) +
        UI.dateField({ name: 'from', label: 'กำหนดส่งตั้งแต่', icon: 'calendar', value: f.from }) +
        UI.dateField({ name: 'to', label: 'ถึง', icon: 'calendar', value: f.to }) +
        '</form>'
      );
    }

    /** PM filter: the two PM teams first (user request 2026-11-16), then each PM. */
    function pmFilterSelect(pms, value, name) {
      var teams = D.pmTeams(pms).map(function (t) { return { value: t.label, label: t.label }; });
      var people = pms.map(function (p) { return { value: p, label: p }; });
      return UI.select({
        name: name || 'pm', label: 'PM', icon: 'pm', value: value, emptyLabel: 'ทั้งหมด',
        options: teams.map(function (t) { return t.value; }).concat(pms),
        groups: (teams.length ? [{ label: 'ทีม PM', options: teams }] : []).concat([{ label: 'รายคน', options: people }]),
      });
    }

    function filterSummary(state) {
      var f = state.filters;
      var parts = [];
      ['platform', 'pm', 'developer', 'urgency'].forEach(function (k) {
        if (f[k]) parts.push(f[k]);
      });
      var from = D.parseDate(f.from).date;
      var to = D.parseDate(f.to).date;
      if (from || to) parts.push('กำหนดส่ง ' + (from ? D.formatThai(from) : '…') + ' ถึง ' + (to ? D.formatThai(to) : '…'));
      return parts.length ? 'กรองอยู่: ' + parts.join(', ') : 'ทุกรายการในชีต';
    }

    function drillButton(state, title, ids, inner, extraClass) {
      var key = state.registerDrill(title, ids);
      return '<button type="button" class="' + (extraClass || 'linklike') + '" data-action="drill" data-drill="' + key + '" aria-label="' + esc(title + ' ' + ids.length + ' รายการ') + '">' + inner + '</button>';
    }

    function readOnlyBanner(state) {
      if (state.user.canEdit) return '';
      var who = 'บัญชี ' + esc(state.user.email || '');
      if (state.user.editReason === 'PENDING') {
        return '<div class="banner info">' + who + ' ส่งคำขอสิทธิ์แก้ไขแล้ว กำลังรอผู้ดูแลอนุมัติ เมื่ออนุมัติแล้วกด "โหลดข้อมูลใหม่"</div>';
      }
      if (state.user.editReason === 'NOT_ALLOWED') {
        return '<div class="banner warn banner-row"><span>' + who + ' ยังไม่อยู่ในรายชื่อทีมที่แก้ไขได้ จึงดูข้อมูลได้อย่างเดียว</span>' +
          '<button class="btn small primary" data-action="request-access">ขอสิทธิ์แก้ไข</button></div>';
      }
      return '<div class="banner warn">' + who + ' มีสิทธิ์ดูอย่างเดียวในชีต จึงดูข้อมูลได้แต่เพิ่มหรือแก้ไขไม่ได้</div>';
    }

    function schemaBanner(state) {
      if (state.schema.ok) return '';
      return '<div class="banner danger" role="alert">ไม่พบคอลัมน์ในชีต: ' + esc(state.schema.missing.join(', ')) + ' ระบบจึงปิดการเพิ่มและแก้ไขไว้ กรุณาตรวจสอบหัวคอลัมน์ในชีตหลัก</div>';
    }

    // ------------------------------------------------------------------ Monitor (US1)

    function monitor(state) {
      var rows = state.filteredRows();
      var m = D.computeMetrics(rows, state.today);
      var html = schemaBanner(state) + readOnlyBanner(state);

      // Hero: the welcome moment. Q1 + Q5 live here as the four headline numbers.
      html += hero(state, m, rows.length);
      html += filterBar(state);

      if (!rows.length) {
        return html + UI.emptyState('ไม่มีรายการตามตัวกรองนี้', 'ลองล้างตัวกรอง หรือเลือกช่วงวันที่ให้กว้างขึ้น', '<button class="btn" data-action="clear-filters">ล้างตัวกรอง</button>');
      }

      // Q2: pipeline (the signature element)
      html += pipeline(state, m);

      // charts (user request 2026-11-20): finished work per month + open work per platform
      html += '<div class="grid-2 charts">' + closedChart(state, rows) + platformChart(state, rows) + '</div>';

      // Q6 (left) + Q3/Q4 (right)
      html += '<div class="grid-2"><div>' + overduePanel(state, m) + '</div><div>' + developerPanel(state, m) + pmPanel(state, m) + qualityPanel(state) + '</div></div>';
      return html;
    }

    // ------------------------------------------------------------------ Monitor charts (2026-11-20)
    // Plain HTML bars (each mark is a button: hover/focus shows a tooltip, click opens the items).

    function closedChart(state, rows) {
      var months = D.closedByMonth(rows, state.today, 6);
      var max = months.reduce(function (a, b) { return Math.max(a, b.count); }, 0);
      var best = max ? months.map(function (b) { return b.count; }).lastIndexOf(max) : -1;
      var total = months.reduce(function (a, b) { return a + b.count; }, 0);
      var cols = months.map(function (b, i) {
        var h = max ? Math.max(b.count ? 4 : 0, Math.round((b.count / max) * 100)) : 0;
        var name = D.THAI_MONTHS_LONG[b.m - 1] + ' ' + (b.y + 543);
        var tip = name + ': ปิดงาน ' + b.count + ' งาน';
        // direct labels only where they matter: this month and the best month
        var showValue = b.count && (i === months.length - 1 || i === best);
        var key = state.registerDrill('ปิดงานเดือน' + name, b.ids);
        return '<div class="col' + (i === months.length - 1 ? ' now' : '') + '" data-count="' + b.count + '">' +
          '<button type="button" class="col-hit" data-action="drill" data-drill="' + key + '" aria-label="' + esc(tip) + '"' + (b.count ? '' : ' disabled') + '>' +
          '<span class="col-val num">' + (showValue ? b.count : '') + '</span>' +
          '<span class="col-bar" style="height:' + h + '%;--i:' + i + '"></span>' +
          '<span class="ctip" aria-hidden="true">' + esc(tip) + '</span></button>' +
          '<span class="col-lab">' + esc(b.label) + '</span></div>';
      }).join('');
      return '<section class="panel chart" id="chart-closed" aria-labelledby="cc-h"><div class="panel-head"><h2 id="cc-h">ปิดงานรายเดือน</h2>' +
        '<span class="muted">6 เดือนล่าสุด รวม <b class="num">' + total + '</b> งาน ' + UI.helpTip('นับงานที่ แก้ไขเรียบร้อย และ ใช้งานได้อยู่แล้ว ตามวันที่เสร็จ ไม่นับงานที่ยกเลิก กดแท่งเพื่อดูรายการ') + '</span></div>' +
        (total ? '<div class="cols">' + cols + '</div>' : '<p class="muted">ยังไม่มีงานที่ปิดใน 6 เดือนนี้</p>') + '</section>';
    }

    function platformChart(state, rows) {
      var plats = D.openByPlatform(rows);
      var max = plats.reduce(function (a, b) { return Math.max(a, b.open); }, 0) || 1;
      var seg = function (title, ids, n, cls) {
        if (!n) return '';
        var key = state.registerDrill(title, ids);
        return '<button type="button" class="pseg ' + cls + '" style="flex-grow:' + n + '" data-action="drill" data-drill="' + key + '" aria-label="' + esc(title + ' ' + n + ' งาน') + '">' +
          '<span class="ctip" aria-hidden="true">' + esc(title + ': ' + n + ' งาน') + '</span></button>';
      };
      var bars = plats.map(function (p) {
        var ok = p.open - p.overdue;
        var okIds = p.ids.filter(function (id) { return p.overdueIds.indexOf(id) === -1; });
        return '<div class="pbar"><span class="pname">' + esc(p.platform) + '</span>' +
          '<span class="ptrack"><span class="pfill" style="width:' + Math.round((p.open / max) * 100) + '%">' +
          seg(p.platform + ' ยังไม่เกินกำหนด', okIds, ok, 'ok') + seg(p.platform + ' เกินกำหนด', p.overdueIds, p.overdue, 'over') +
          '</span></span><span class="ptotal num">' + p.open + '</span></div>';
      }).join('');
      return '<section class="panel chart" id="chart-platform" aria-labelledby="cp-h"><div class="panel-head"><h2 id="cp-h">งานค้างแต่ละแพลตฟอร์ม</h2>' +
        '<span class="legend"><span class="lg"><i class="sw ok" aria-hidden="true"></i>ยังไม่เกินกำหนด</span><span class="lg"><i class="sw over" aria-hidden="true"></i>เกินกำหนด</span></span></div>' +
        (plats.length ? '<div class="pbars">' + bars + '</div>' : '<p class="muted">ไม่มีงานค้าง</p>') + '</section>';
    }

    function greetingName(state) {
      var name = state.myName();
      if (name) return name;
      var email = (state.user && state.user.email) || '';
      return email ? email.split('@')[0] : '';
    }

    /** One plain sentence that says what matters today. */
    function todaySentence(m) {
      if (!m.openCount) return 'ไม่มีงานค้างเลย เยี่ยมมาก';
      var top = m.byStatus.filter(function (s) { return D.WORKFLOW.indexOf(s.value) !== -1; })
        .sort(function (a, b) { return b.count - a.count; })[0];
      var parts = [];
      parts.push(m.overdueCount ? 'มีงานเกินกำหนด ' + m.overdueCount.toLocaleString('th-TH') + ' งานที่ควรตามก่อน' : 'ยังไม่มีงานเกินกำหนด');
      if (top) parts.push('งานกองอยู่ที่ "' + D.statusLabel(top.value) + '" มากที่สุด');
      return parts.join(' และ');
    }

    function myWorkChip(state) {
      var name = state.myName();
      if (!name) return '<a class="hero-chip" href="#/my-work">ดูงานของนักพัฒนาแต่ละคน</a>';
      var dev = D.groupMyWork(state.rows, name, 'developer', state.today);
      var pm = D.groupMyWork(state.rows, name, 'pm', state.today);
      var g = dev.total || !pm.total ? dev : pm;
      if (!g.total) return '<a class="hero-chip" href="#/my-work">ยังไม่มีงานค้างของคุณ</a>';
      return '<a class="hero-chip" href="#/my-work">งานของคุณ <strong>' + g.total + '</strong> งาน' +
        (g.overdue.length ? ', เกินกำหนด <strong class="hot">' + g.overdue.length + '</strong>' : '') +
        (g.today.length ? ', ครบกำหนดวันนี้ <strong>' + g.today.length + '</strong>' : '') + '</a>';
    }

    function hero(state, m, count) {
      var name = greetingName(state);
      return '<section class="hero" aria-labelledby="hero-h">' +
        '<div class="hero-text"><p class="hero-hello">' + (name ? 'สวัสดี คุณ<strong>' + esc(name) + '</strong>' : 'สวัสดี') + '<span class="hero-date">' + esc(D.formatThaiLong(state.today)) + '</span></p>' +
        '<h1 id="hero-h" lang="en">Change Request Tracker Systems</h1>' +
        (count ? '<p class="hero-sub">' + esc(todaySentence(m)) + '</p>' : '') +
        '<div class="hero-actions">' +
        (state.user.canEdit && state.schema.ok
          ? '<a class="hero-add" href="#/new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>เพิ่มรายการขอแก้ไข</a>'
          : '') +
        myWorkChip(state) +
        '<button class="btn small export-btn" data-action="export-open">' + UI.withIcon('report', 'สรุปรายงาน (Export)') + '</button>' +
        '<button class="btn small" data-action="reload">' + UI.withIcon('reload', 'โหลดข้อมูลใหม่') + '</button>' +
        '<span class="hero-meta">' + esc(filterSummary(state)) + ', ข้อมูล ณ ' + esc(state.loadedAt) + '</span></div></div>' +
        '<div class="hero-art">' + UI.mascots() + '</div>' +
        (count ? '<div class="hero-stats">' +
          stat(state, 'lead', 'open', m.openCount, 'งานค้าง', m.openIds, 'งานที่สถานะยังไม่ใช่ แก้ไขเรียบร้อย / ใช้งานได้อยู่แล้ว / ยกเลิก (รวมสถานะว่าง)', 'open') +
          stat(state, 'danger', 'overdue', m.overdueCount, 'เกินกำหนด', m.overdueIds, 'งานค้างที่วันกำหนดผ่านไปแล้ว โดยใช้วันที่เลื่อนก่อน ถ้าไม่มีจึงใช้วันที่ต้องได้', 'overdue') +
          stat(state, 'ok', 'closed-week', m.closedThisWeek.count, 'ปิดสัปดาห์นี้', m.closedThisWeek.ids, 'นับจากวันที่เสร็จ วันจันทร์ถึงวันอาทิตย์นี้', 'week') +
          stat(state, 'month', 'closed-month', m.closedThisMonth.count, 'ปิดเดือนนี้', m.closedThisMonth.ids, 'นับจากวันที่เสร็จ ภายในเดือนนี้', 'month') +
          '</div>' : '') +
        '</section>';
    }

    function stat(state, cls, metric, value, label, ids, tip, iconName) {
      return '<div class="stat ' + cls + '" data-metric="' + metric + '">' +
        (iconName ? '<span class="ico">' + UI.icon(iconName) + '</span>' : '') +
        drillButton(state, label, ids, '<span class="value num">' + value.toLocaleString('th-TH') + '</span>', 'stat-btn') +
        '<span class="label">' + esc(label) + ' ' + UI.helpTip(tip) + '</span></div>';
    }

    function pipeline(state, m) {
      var counts = {};
      m.byStatus.forEach(function (s) { counts[s.value] = s; });
      var open = D.WORKFLOW.filter(function (s) { return D.isOpen(s); });
      var max = 0;
      var maxStatus = null;
      open.forEach(function (s) {
        var c = counts[s] ? counts[s].count : 0;
        if (c > max) { max = c; maxStatus = s; }
      });
      var stages = open.map(function (s, idx) {
        var c = counts[s] ? counts[s].count : 0;
        var h = max ? Math.round((c / max) * 100) : 0;
        var cls = 'stage' + (s === maxStatus && c > 0 ? ' bottleneck' : '') + (c === 0 ? ' zero' : '');
        var key = state.registerDrill('สถานะ ' + D.statusLabel(s), counts[s] ? counts[s].ids : []);
        return '<button type="button" class="' + cls + '" data-action="drill" data-drill="' + key + '" aria-label="' + esc(D.statusLabel(s) + ' ' + c + ' รายการ') + '">' +
          '<span class="fill" style="height:' + h + '%;--i:' + idx + '"></span><span class="count num">' + c + '</span><span class="name" title="' + esc(D.statusLabel(s)) + '">' + UI.statusLines(s).map(function (l) { return '<span class="line">' + esc(l) + '</span>'; }).join(' ') + '</span></button>';
      }).join('');
      var others = m.byStatus.filter(function (s) { return open.indexOf(s.value) === -1; });
      var extra = others.length
        ? '<div class="pipeline-extra">สถานะอื่นที่ยังเปิดอยู่: ' + others.map(function (s) {
            return drillButton(state, 'สถานะ ' + D.statusLabel(s.status), s.ids, esc(D.statusLabel(s.status)) + ' ' + s.count);
          }).join(', ') + '</div>'
        : '';
      var head = maxStatus
        ? 'งานกองอยู่ที่ "' + esc(D.statusLabel(maxStatus)) + '" มากที่สุด (' + max + ' งาน)'
        : 'ไม่มีงานค้าง';
      return '<section class="pipeline" aria-labelledby="pl-h"><div class="pipeline-head"><h2 id="pl-h">งานค้างแต่ละขั้นตอน ' +
        UI.helpTip('เรียงตามลำดับขั้นตอนจริง ขั้นที่ไฮไลต์คือขั้นที่มีงานรอมากที่สุด (คอขวด) กดที่ขั้นเพื่อดูรายการ') +
        '</h2><span class="muted">' + head + '</span></div><div class="stages">' + stages + '</div>' + extra + '</section>';
    }

    /** Ring showing the share of open work that is still on time. */
    function onTimeRing(open, overdue) {
      var pct = open ? Math.round(((open - overdue) / open) * 100) : 100;
      var r = 34;
      var c = 2 * Math.PI * r;
      return '<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="งานค้างที่ยังไม่เกินกำหนด ' + pct + '%">' +
        '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="#fde8e6" stroke-width="10"/>' +
        '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + ((c * pct) / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 42 42)"/>' +
        '<text x="42" y="40" text-anchor="middle" class="ring-num">' + pct + '%</text><text x="42" y="55" text-anchor="middle" class="ring-sub">ทันกำหนด</text></svg>';
    }

    function severity(days) {
      return days > 30 ? 'sev-4' : days > 14 ? 'sev-3' : days > 7 ? 'sev-2' : 'sev-1';
    }

    function overduePanel(state, m) {
      var list = m.overdueList;
      var head = '<div class="panel-head"><h2 id="od-h">งานเกินกำหนด</h2><span class="muted">เรียงจากเกินนานที่สุด</span></div>';
      if (!list.length) {
        return '<section class="panel od-panel" aria-labelledby="od-h">' + head +
          '<div class="od-clear"><span aria-hidden="true">🎉</span><div><strong>ไม่มีงานเกินกำหนด</strong><p class="muted">ทีมทำได้ยอดเยี่ยม รักษามาตรฐานนี้ไว้</p></div></div></section>';
      }
      var buckets = D.overdueBuckets(list);
      var maxB = buckets.reduce(function (a, b) { return Math.max(a, b.ids.length); }, 0) || 1;
      var chart = '<div class="od-buckets">' + buckets.map(function (b, i) {
        var pct = Math.round((b.ids.length / maxB) * 100);
        return '<div class="od-bucket"><span class="od-blabel">' + esc(b.label) + '</span>' +
          '<span class="od-btrack"><span class="od-bfill sev-' + (i + 1) + '" style="width:' + pct + '%"></span></span>' +
          (b.ids.length ? drillButton(state, 'เกินกำหนด ' + b.label, b.ids, '<strong class="num">' + b.ids.length + '</strong>') : '<span class="muted num">0</span>') + '</div>';
      }).join('') + '</div>';
      var week = m.closedThisWeek.count;
      var cheer = '<div class="od-cheer">' + onTimeRing(m.openCount, m.overdueCount) +
        '<div><p>เกินกำหนด <b class="hot num">' + list.length + '</b> งาน' +
        (week ? ' · สัปดาห์นี้ปิดไปแล้ว <b class="good num">' + week + '</b> งาน 💪' : ' · เริ่มปิดงานแรกของสัปดาห์กันเลย') + '</p>' + chart + '</div></div>';
      var body = '<ol class="od-list">' + list.slice(0, 12).map(function (r) {
        return '<li class="' + severity(r.overdueDays) + '"><div class="od-days num">' + r.overdueDays + '<small>วัน</small></div><div>' +
          '<a href="#/items/' + encodeURIComponent(r.id) + '">' + esc(r.detail) + '</a>' +
          '<div class="meta"><span>#' + esc(r.seq === null ? '-' : r.seq) + '</span><span>' + esc(r.platform) + '</span><span>' + esc(r.system) + '</span><span>' + esc(r.developer || D.UNASSIGNED) + '</span>' +
          UI.statusBadge(r.status) + (r.ticketUrl ? UI.ticketLink(r) : '') + '</div></div></li>';
      }).join('') + '</ol>';
      if (list.length > 12) body += '<p style="margin-top:8px">' + drillButton(state, 'งานเกินกำหนดทั้งหมด', m.overdueIds, 'ดูงานเกินกำหนดทั้งหมด ' + list.length + ' งาน') + '</p>';
      return '<section class="panel od-panel" aria-labelledby="od-h">' + head + cheer + body + '</section>';
    }

    function peopleTable(state, rows, label, withOverdue) {
      if (!rows.length) return '<p class="muted">ไม่มีงานค้าง</p>';
      var max = rows.reduce(function (a, r) { return Math.max(a, r.open); }, 0);

        rows.map(function (p) {

    function developerPanel(state, m) {

    function qualityPanel(state) {

          ' มีข้อมูลที่ต้องแก้ เช่น ค่าอยู่ผิดช่อง วันที่อ่านไม่ได้ หรือไม่มีวันกำหนด</p>' +
          '<ul style="margin:8px 0 0;padding-left:1.2em">' + bad.slice(0, 5).map(function (r) {
            return '<li><a href="#/items/' + encodeURIComponent(r.id) + '">#' + esc(r.seq === null ? 'แถว ' + r.rowNumber : r.seq) + '</a> ' + esc(r.issues[0].message) + (r.issues.length > 1 ? ' <span class="muted">(+' + (r.issues.length - 1) + ')</span>' : '') + '</li>';
          }).join('') + '</ul>';

    // ------------------------------------------------------------------ Items (US5 + drill-down)

    /** Column definitions for "รายการทั้งหมด" (order is configurable; default per user request 2026-11-11). */
    var ITEM_COLS = {
      seq: { label: 'ลำดับ', sort: 'seq', cell: function (r) { return '<td class="num" data-hide-mobile>' + esc(r.seq === null ? '–' : r.seq) + '</td>'; } },
      platform: { label: 'แพลตฟอร์ม', sort: 'platform', cell: function (r) { return '<td class="platform-cell" data-hide-mobile><span class="kplat">' + esc(r.platform || '–') + '</span></td>'; } },
      system: { label: 'ระบบงาน', sort: 'system', cell: function (r) { return '<td class="system-cell" data-hide-mobile>' + esc(r.system || '–') + '</td>'; } },
      detail: {
        label: 'รายละเอียด',

          return '<td class="detail-cell"><a href="#/items/' + encodeURIComponent(r.id) + '">' + esc(r.detail) + '</a>' +
            '<div class="sub"><span class="mobile-only">#' + esc(r.seq === null ? '–' : r.seq) + ' / ' + esc(r.platform) + ' / ' + esc(r.system) + ' </span>' +
            (r.issues.length ? '<span class="flag">ข้อมูลไม่ครบ/ผิดช่อง</span>' : '') + '</div></td>';
        },
      },
      ticket: {
        label: 'Taiga/MANTIS',
        cell: function (r) {
          return '<td class="ticket-cell">' + (r.ticketUrl ? UI.ticketLink(r) : r.ticket ? '<span class="num">#' + esc(r.ticket) + '</span>' : '<span class="muted">–</span>') + '</td>';
        },
      },
      status: { label: 'สถานะ', sort: 'status', cell: function (r) { return '<td>' + UI.statusBadge(r.status) + '</td>'; } },
      urgency: { label: 'ความเร่งด่วน', sort: 'urgency', cell: function (r) { return '<td data-hide-mobile>' + UI.urgency(r.urgency) + '</td>'; } },
      developer: { label: 'นักพัฒนา', sort: 'developer', cell: function (r) { return '<td>' + esc(r.developer || '–') + '</td>'; } },
      pm: { label: 'PM', sort: 'pm', cell: function (r) { return '<td data-hide-mobile>' + esc(r.pm) + '</td>'; } },
      due: { label: 'กำหนดส่ง', sort: 'due', cell: function (r, state) { return '<td>' + UI.due(r, state.today) + '</td>'; } },
    };
    var ITEM_COLS_DEFAULT = ['seq', 'platform', 'system', 'detail', 'ticket', 'status', 'urgency', 'developer', 'pm', 'due'];

    var PAGE = 50;
    var STATES = [['open', 'งานค้าง'], ['overdue', 'เกินกำหนด'], ['closed', 'ปิดแล้ว'], ['all', 'ทั้งหมด']];

    function items(state) {
      var list = state.itemRows();
      var total = list.length;
      var pages = Math.max(1, Math.ceil(total / PAGE));
      var page = Math.min(state.itemsPage, pages - 1);
      var slice = list.slice(page * PAGE, page * PAGE + PAGE);
      var html = schemaBanner(state) + '<div class="page-head"><h1>รายการทั้งหมด</h1><span class="muted">' + total.toLocaleString('th-TH') + ' รายการ</span>' +
        '<span class="spacer"></span><button class="btn small" data-action="reload">โหลดข้อมูลใหม่</button></div>';
      if (state.drill) {
        html += '<div class="drill" role="status">' + UI.backButton() + '<span>กำลังดู: <strong>' + esc(state.drill.title) + '</strong> (' + state.drill.ids.length + ' รายการ)</span><button class="btn small" data-action="clear-drill">ดูรายการทั้งหมด</button></div>';
      } else {
        html += filterBar(state);
      }
      html += '<div class="toolbar"><label class="sr-only" for="q">ค้นหา</label><input type="search" id="q" placeholder="ค้นหา รายละเอียด ระบบงาน เลขลำดับ หรือเลข Taiga/MANTIS" value="' + esc(state.itemsQuery) + '" />';
      if (!state.drill) {
        html += '<div class="chips" role="group" aria-label="สถานะงาน">' + STATES.map(function (s) {
          return '<button type="button" class="chip" data-action="items-state" data-value="' + s[0] + '" aria-pressed="' + (state.itemsState === s[0]) + '">' + s[1] + '</button>';
        }).join('') + '</div>';
      }
      html += '</div>';
      if (!total) {
        return html + UI.emptyState('ไม่พบรายการ', state.itemsQuery ? 'ไม่มีรายการที่ตรงกับคำค้น "' + state.itemsQuery + '" ลองใช้คำอื่น' : 'ลองเปลี่ยนตัวกรองหรือสถานะงาน',
          state.user.canEdit ? '<a class="btn primary" href="#/new">เพิ่มรายการใหม่</a>' : '');
      }
      var th = function (key, label, cls) {
        var cur = state.sort.key === key;
        return '<th class="' + (cls || '') + '" aria-sort="' + (cur ? (state.sort.dir > 0 ? 'ascending' : 'descending') : 'none') + '"><button data-action="sort" data-key="' + key + '">' + label + (cur ? (state.sort.dir > 0 ? ' ▲' : ' ▼') : '') + '</button></th>';
      };
      // Columns are user-arrangeable (drag a header, or "จัดคอลัมน์"); the order is remembered per browser.
      var order = state.itemCols();
      html += '<div class="cols-bar"><button type="button" class="btn small" data-action="cols-toggle" aria-expanded="' + !!state.colsOpen + '">' + UI.withIcon('kanban', 'จัดคอลัมน์') + '</button>' +
        '<span class="muted">ลากหัวคอลัมน์เพื่อย้ายตำแหน่งได้</span></div>';
      if (state.colsOpen) {
        html += '<div class="cols-panel" role="group" aria-label="จัดลำดับคอลัมน์">' + order.map(function (k, i) {
          return '<span class="cols-item"><button type="button" class="cols-move" data-action="cols-move" data-key="' + k + '" data-dir="-1"' + (i === 0 ? ' disabled' : '') + ' aria-label="ย้าย ' + esc(ITEM_COLS[k].label) + ' ไปทางซ้าย">←</button>' +
            '<span>' + esc(ITEM_COLS[k].label) + '</span><button type="button" class="cols-move" data-action="cols-move" data-key="' + k + '" data-dir="1"' + (i === order.length - 1 ? ' disabled' : '') + ' aria-label="ย้าย ' + esc(ITEM_COLS[k].label) + ' ไปทางขวา">→</button></span>';
        }).join('') + '<button type="button" class="btn small" data-action="cols-reset">คืนค่าเริ่มต้น</button></div>';
      }
      html += '<div class="table-wrap"><table class="responsive"><thead><tr>' + order.map(function (k) {
        var c = ITEM_COLS[k];
        var inner = c.sort ? th(c.sort, c.label, c.cls).replace(/^<th /, '<th draggable="true" data-col="' + k + '" ') : '<th draggable="true" data-col="' + k + '" class="' + (c.cls || '') + '">' + esc(c.label) + '</th>';
        return inner;
      }).join('') + '</tr></thead><tbody>' +
        slice.map(function (r) {
          return '<tr class="clickable" data-action="open-item" data-id="' + esc(r.id) + '">' + order.map(function (k) { return ITEM_COLS[k].cell(r, state); }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
      if (pages > 1) {
        html += '<nav class="pager" aria-label="หน้า"><button class="btn small" data-action="page" data-dir="-1"' + (page === 0 ? ' disabled' : '') + '>ก่อนหน้า</button><span class="muted">หน้า ' + (page + 1) + ' จาก ' + pages +
          '</span><button class="btn small" data-action="page" data-dir="1"' + (page >= pages - 1 ? ' disabled' : '') + '>ถัดไป</button></nav>';
      }
      return html;
    }

    // ------------------------------------------------------------------ Form (US2 + US3)

    var GROUPS = [
      { legend: 'เรื่องที่ขอแก้ไข', keys: ['platform', 'issueType', 'urgency', 'system', 'detail', 'ticket'] },
      { legend: 'ผู้รับผิดชอบและกำหนดส่ง', keys: ['pm', 'developer', 'tester', 'dueDate', 'postponedDate', 'devQueue'] },
      { legend: 'ความคืบหน้า', keys: ['status', 'devStart', 'devEnd', 'devHours', 'doneDate', 'deployDate'] },
    ];
    var TIPS = {
      postponedDate: 'ถ้าใส่วันที่เลื่อน ระบบจะใช้วันนี้เป็นวันกำหนดแทนวันที่ต้องได้',
      system: 'เลือกจากรายการ หรือพิมพ์ชื่อระบบงานใหม่ได้',
      devQueue: 'ลำดับคิวงานของนักพัฒนา เลขน้อยทำก่อน',
      doneDate: 'ต้องระบุเมื่อเปลี่ยนสถานะเป็น 0.แก้ไขเรียบร้อย',
      ticket: 'ใส่เลข ticket หรือวางลิงก์ Taiga/MANTIS',
    };

    function formField(state, key, value, errors, warnings, readOnly, row) {
      var col = D.COLUMN_BY_KEY[key];
      var o = { name: key, label: col.header, value: value, required: !!col.required, pmFills: !!col.pmFills, error: errors[key], warn: warnings[key], tip: TIPS[key], disabled: readOnly, readonly: readOnly };
      var opts = state.options;
      if (col.type === 'option') return UI.select(Object.assign(o, { options: opts[key] }));
      if (col.type === 'status') {
        return UI.select(Object.assign(o, { options: D.WORKFLOW, groups: UI.statusGroups(), allowEmpty: false, hint: 'เรียงตามขั้นตอนงานจริง เลือกขั้นถัดไปเมื่องานคืบหน้า' }));
      }
      if (key === 'pm') return UI.multiPick(Object.assign(o, { options: opts.pm }));
      if (col.type === 'person') return UI.select(Object.assign(o, { options: key === 'pm' ? opts.pm : opts.developer, emptyLabel: key === 'developer' ? '— ยังไม่มอบหมาย —' : undefined }));
      if (col.type === 'freeOption') return UI.combobox(Object.assign(o, { options: opts.system }));
      if (col.type === 'freePerson') {
        return UI.combobox(Object.assign(o, { options: opts[key] || opts.developer, placeholder: 'เลือกจากรายการ หรือพิมพ์ชื่อใหม่', hint: 'ถ้าไม่มีชื่อในรายการ พิมพ์ชื่อใหม่ได้เลย' }));
      }
      if (col.type === 'date') return UI.dateField(o);
      if (col.type === 'number') return UI.input(Object.assign(o, { inputmode: 'decimal' }));
      if (key === 'detail') return UI.textarea(Object.assign(o, { wide: true, feature: true, icon: 'report', hint: 'อธิบายสิ่งที่ต้องการให้แก้ไข ให้คนอื่นอ่านแล้วเข้าใจ' }));
      if (key === 'ticket') {
        // links embedded in the sheet cell (rich text / =HYPERLINK) + a URL typed as text (2026-11-11)
        var urls = ((row && row.ticketLinks) || []).slice();
        var typed = D.ticketUrl(value);
        if (typed && urls.indexOf(typed) === -1) urls.push(typed);
        var html = UI.input(Object.assign(o, {
          wide: true,
          placeholder: 'วางลิงก์ Taiga/MANTIS หรือใส่เลข ticket',
          hint: row && row.ticketLinks && row.ticketLinks.length ? 'ช่องนี้ในชีตมีลิงก์ฝังอยู่ ถ้าแก้ข้อความในช่องนี้ ลิงก์ที่ฝังไว้จะถูกแทนด้วยข้อความใหม่' : undefined,
        }));
        var links = '<div class="ticket-actions">' + urls.map(function (u) { return UI.ticketLink({ ticket: value, ticketUrl: u }); }).join('') +
          UI.taigaButton(urls.length ? 'เข้า Taiga' : 'เข้า Taiga เพื่อเพิ่มเอกสาร/ปรับสถานะ') + '</div>';
        return html.replace(/<\/div><\/div>$/, '</div>' + links + '</div>');
      }
      return UI.input(o);
    }

    function form(state, mode, row) {
      var readOnly = !state.user.canEdit || !state.schema.ok;
      var errs = state.formErrors || {};
      var warns = state.formWarnings || {};
      var values = state.formDraft || (row ? row.raw : defaults(state));
      var title = mode === 'new' ? 'เพิ่มรายการขอแก้ไขใหม่' : 'รายการ #' + (row.seq === null ? '–' : row.seq);
      var html = schemaBanner(state) + readOnlyBanner(state);
      // someone else editing this item (presence, 2026-11-18): updated in place by the heartbeat, never re-rendered
      html += '<div id="presence-warn" role="status">' + (row ? presenceWarn(state, row) : '') + '</div>';
      html += '<div class="page-head">' + UI.backButton() + '<h1>' + esc(title) + '</h1>' + (row ? UI.statusBadge(row.status) + '<span class="muted">' + UI.due(row, state.today) + '</span>' : '<span class="muted">ช่องที่มี * ต้องกรอก</span>') + '</div>';
      if (state.formAlert) html += '<div class="banner danger" role="alert">' + esc(state.formAlert.message) + (state.formAlert.reload ? ' <button class="btn small" data-action="reload-item">โหลดข้อมูลใหม่</button>' : '') + '</div>';
      if (row && row.issues.length) {
        html += '<div class="banner warn"><strong>ข้อมูลที่ควรแก้:</strong><ul style="margin:4px 0 0;padding-left:1.2em">' + row.issues.map(function (i) { return '<li>' + esc(i.message) + '</li>'; }).join('') + '</ul></div>';
      }
      html += '<form class="form" id="item-form" data-mode="' + mode + '" novalidate>';
      GROUPS.forEach(function (g) {
        html += '<fieldset><legend>' + esc(g.legend) + '</legend><div class="form-grid">' + g.keys.filter(function (k) {
          return ((state.schema && state.schema.absent) || []).indexOf(k) === -1; // optional column not in this sheet
        }).map(function (k) {
          return formField(state, k, values[k], errs, warns, readOnly, row);
        }).join('') + '</div></fieldset>';
      });
      html += '<div class="form-actions">';
      if (!readOnly) html += '<button type="submit" class="btn primary" id="save-btn">' + UI.withIcon('save', mode === 'new' ? 'บันทึกรายการใหม่' : 'บันทึกการแก้ไข') + '</button>';
      html += '<a class="btn" href="' + (mode === 'new' ? '#/monitor' : '#/items') + '">' + (readOnly ? 'กลับ' : 'ยกเลิก') + '</a>';
      if (row && !readOnly && row.seq !== null) html += '<span class="spacer"></span><button type="button" class="btn danger" data-action="delete-item">' + UI.withIcon('trash', 'ลบรายการนี้') + '</button>';
      html += '</div></form>';
      if (row) html += '<p class="muted" style="margin-top:12px;font-size:13px">แถวที่ ' + row.rowNumber + ' ในชีต ระบบจะบันทึกเฉพาะช่องที่คุณแก้ และเก็บประวัติไว้ในชีต _app_log</p>';
      if (row && row.seq !== null) html += historyPanel(state, row);
      return html;
    }

    function defaults(state) {
      var me = state.myName();
      return {
        status: D.DEFAULT_STATUS,
        pm: me && state.options.pm.indexOf(me) !== -1 ? me : '',
      };
    }

    // ------------------------------------------------------------------ My Work (US4)


    // ------------------------------------------------------------------ Assign (dev lead, 2026-11-11)

    /** Open items without a developer, one row each with a name box + "มอบหมาย"; workload on the side. */
    function assign(state) {
      var all = D.unassignedQueue(state.rows, state.today);
      // hide statuses the dev lead is not ready to assign yet, e.g. files still being prepared (user request 2026-11-18)
      var hidden = state.asHidden || [];
      var queue = all.filter(function (r) { return hidden.indexOf(r.status) === -1; });
      var counts = {};
      all.forEach(function (r) { counts[r.status] = (counts[r.status] || 0) + 1; });
      var statuses = D.WORKFLOW.filter(function (s) { return counts[s]; });
      var chips = statuses.length
        ? '<div class="mw-bar-row as-status" role="group" aria-label="สถานะที่แสดง"><span class="muted">สถานะ:</span>' + statuses.map(function (s) {
            return '<button type="button" class="mw-chip" data-action="as-status" data-status="' + esc(s) + '" aria-pressed="' + (hidden.indexOf(s) === -1) + '">' + esc(D.statusLabel(s)) + ' <span class="num">' + counts[s] + '</span></button>';
          }).join('') + (hidden.length ? '<button type="button" class="btn small" data-action="as-status-all">แสดงทุกสถานะ</button>' : '') + '</div>'
        : '';
      var load = D.computeMetrics(state.rows, state.today).byDeveloper.filter(function (p) { return p.name !== D.UNASSIGNED; });
      var html = '<div class="page-head"><h1>มอบหมายงาน</h1><span class="muted spacer">งานค้างที่ยังไม่มีนักพัฒนา ' + (queue.length === all.length ? all.length + ' งาน' : 'แสดง ' + queue.length + ' จาก ' + all.length + ' งาน') + ' เรียงจากงานที่ควรมอบหมายก่อน</span>' +
        '<button class="btn small" data-action="reload">โหลดข้อมูลใหม่</button></div>';
      if (!state.user.canEdit) {
        return html + UI.emptyState('บัญชีนี้มีสิทธิ์ดูอย่างเดียว', 'ขอสิทธิ์แก้ไขจากผู้ดูแลก่อน จึงจะมอบหมายงานได้', '');
      }
      var list = queue.length
        ? '<ol class="as-list">' + queue.map(function (r) {
            var fid = 'as-dev-' + r.id;
            return '<li><form class="as-row' + (r.isOverdue ? ' over' : '') + '" data-id="' + esc(r.id) + '">' +
              '<div class="as-info"><div class="as-top"><span class="kseq num">#' + esc(r.seq === null ? '–' : r.seq) + '</span><span class="kplat">' + esc(r.platform) + '</span>' +
              '<span class="muted">' + esc(r.system) + '</span>' + (D.urgencyRank(r.urgency) < 2 ? UI.urgency(r.urgency) : '') + '<span>' + UI.due(r, state.today) + '</span></div>' +
              // status right after the title, on the same line (user request 2026-11-20)
              '<div class="as-head"><a href="#/items/' + encodeURIComponent(r.id) + '" class="as-title">' + esc(r.detail) + '</a>' + UI.statusBadge(r.status) + '</div>' +
              '<div class="as-sub muted">PM: ' + esc(r.pm || '–') +
                // Taiga/MANTIS one click away (user request 2026-11-20); a plain number has no link to follow
                (r.ticketUrl ? ' ' + UI.ticketLink(r) : r.ticket ? ' <span class="num">#' + esc(r.ticket) + '</span>' : '') + '</div></div>' +
              '<div class="as-pick"><label for="' + esc(fid) + '" class="sr-only">นักพัฒนาสำหรับรายการ #' + esc(r.seq) + '</label>' +
              '<input id="' + esc(fid) + '" name="developer" list="as-devs" autocomplete="off" placeholder="พิมพ์หรือเลือกชื่อ" required>' +
              '<button type="submit" class="btn primary small">มอบหมาย</button></div></form></li>';
          }).join('') + '</ol>'
        : all.length
          ? UI.emptyState('ซ่อนทุกสถานะอยู่', 'กดสถานะด้านบนเพื่อแสดงงาน', '<button type="button" class="btn" data-action="as-status-all">แสดงทุกสถานะ</button>')
          : UI.emptyState('มอบหมายครบทุกงานแล้ว 🎉', 'ไม่มีงานค้างที่ยังไม่ระบุนักพัฒนา', '<a class="btn" href="#/kanban">ไปที่บอร์ดงาน</a>');
      var side = '<aside class="panel as-load" aria-labelledby="as-load-h"><h2 id="as-load-h">งานค้างของนักพัฒนา</h2>' +
        '<p class="muted">ใช้ดูภาระงานก่อนแบ่งงาน กดชื่อเพื่อใส่ในช่องที่เลือกไว้ล่าสุด</p>' +
        (load.length ? '<ul>' + load.map(function (p) {
          return '<li><button type="button" class="as-dev" data-action="as-fill" data-name="' + esc(p.name) + '"><span>' + esc(p.name) + '</span>' +
            '<span class="num">' + p.open + ' งาน' + (p.overdue ? ' · <span class="due-over">เกิน ' + p.overdue + '</span>' : '') + '</span></button></li>';
        }).join('') + '</ul>' : '<p class="muted">ยังไม่มีข้อมูล</p>') + '</aside>';
      var devs = (state.options.developer || []).map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('');
      return html + '<datalist id="as-devs">' + devs + '</datalist><div class="as-layout"><section aria-label="งานที่ยังไม่มีนักพัฒนา">' + chips + list + '</section>' + side + '</div>';
    }

    function myWork(state) {
      // "งานของฉัน" (developers) and "งาน PM" are separate menus, each with its own name list (user request 2026-11-11)
      var isPm = state.myTab === 'pm';
      var name = isPm ? state.pmName() : state.devName();
      var people = ((isPm ? state.options.pm : state.options.developer) || []).slice();
      // งาน PM can also show a whole PM team (user request 2026-11-16); งานของฉัน can show ทุกคน (2026-11-18)
      var teams = isPm ? D.pmTeams(state.options.pm || []).map(function (t) { return t.label; }) : [D.ALL_DEVELOPERS];
      var everyone = !isPm && name === D.ALL_DEVELOPERS;
      state.mwShowDev = everyone; // cards say whose work it is
      if (name && people.indexOf(name) === -1 && teams.indexOf(name) === -1) people.unshift(name);
      var who = isPm ? D.pmFilter(name, state.options.pm || []) : name;
      var nameButton = function (n) {
        return '<button type="button" class="mw-name' + (n === name ? ' on' : '') + '" data-action="pick-name" data-name="' + esc(n) + '"><span class="kavatar" aria-hidden="true">' + esc(initials(n)) + '</span>' + esc(n) + '</button>';
      };
      var nameOption = function (n) { return '<option value="' + esc(n) + '"' + (n === name ? ' selected' : '') + '>' + esc(n) + '</option>'; };
      var html = '<div class="page-head"><h1>' + (isPm ? 'งาน PM' : 'งานนักพัฒนา') + '</h1><span class="muted">' +
        (isPm ? 'งานที่คุณเป็น PM รับผิดชอบ' : everyone ? 'งานของนักพัฒนาทุกคน' : 'งานที่คุณเป็นนักพัฒนา') + '</span></div>';
      if (!name || state.choosingName) {
        // one click: tap your own name (user request 2026-11-11)
        return html + '<section class="panel mw-who"><h2>' + (isPm ? 'ดูงานของ PM คนไหน?' : 'ดูงานของนักพัฒนาคนไหน?') + '</h2><p class="muted">กดชื่อที่ต้องการดูงาน ระบบจะจำไว้ (ชื่อของคุณเองผู้ดูแลกำหนดในหน้า จัดการสิทธิ์)</p>' +
          (teams.length ? '<h3 class="mw-names-h">ดูทั้งทีม</h3><div class="mw-names">' + teams.map(nameButton).join('') + '</div><h3 class="mw-names-h">รายคน</h3>' : '') +
          '<div class="mw-names">' + people.map(nameButton).join('') + '</div></section>';
      }
      var role = state.myTab;
      var mf = state.mwFilter;
      var mine = D.filterMyWork(state.rows, mf);
      var g = D.groupMyWeek(mine, who, role, state.today);
      var chip = function (key, value, label) {
        return '<button type="button" class="mw-chip" data-action="mw-filter" data-key="' + key + '" data-value="' + esc(value) + '" aria-pressed="' + ((mf[key] || '') === value) + '">' + esc(label) + '</button>';
      };
      var active = !!(mf.platform || mf.stage || mf.q);
      html += '<div class="mw-bar" role="search" aria-label="กรองงานนักพัฒนา">' +
        '<div class="mw-bar-who"><label for="mw-who">ดูงานของ</label><select id="mw-who" data-action-change="mw-who">' +
        (teams.length
          ? '<optgroup label="ทั้งทีม">' + teams.map(nameOption).join('') + '</optgroup><optgroup label="รายคน">' + people.map(nameOption).join('') + '</optgroup>'
          : people.map(nameOption).join('')) + '</select></div>' +
        '<div class="mw-bar-row" role="group" aria-label="แพลตฟอร์ม">' + chip('platform', '', 'ทุกแพลตฟอร์ม') + (state.options.platform || []).map(function (p) { return chip('platform', p, p); }).join('') + '</div>' +
        '<div class="mw-bar-row" role="group" aria-label="ขั้นงาน">' + chip('stage', '', 'ทุกขั้น') + ['prep', 'dev', 'back', 'test'].map(function (k) { return chip('stage', k, D.STAGE_LABELS[k]); }).join('') + '</div>' +
        '<div class="mw-bar-q"><label for="mw-q" class="sr-only">ค้นหาในงานนักพัฒนา</label><input id="mw-q" type="search" placeholder="ค้นหาเลขลำดับ หรือคำในงานของฉัน" value="' + esc(mf.q || '') + '">' +
        (active ? '<button type="button" class="btn small" data-action="mw-clear">ล้างตัวกรอง</button>' : '') + '</div></div>';
      var week = D.weekRange(state.today);
      var next = { from: D.addDays(week.from, 7), to: D.addDays(week.to, 7) };

      if (!g.openTotal && !g.doneThisWeek.length) {
        if (active) return html + UI.emptyState('ไม่พบงานตามตัวกรอง', 'ลองเลือก "ทุกแพลตฟอร์ม" หรือ "ทุกขั้น" หรือล้างคำค้นหา', '<button type="button" class="btn" data-action="mw-clear">ล้างตัวกรอง</button>');
        return html + UI.emptyState('ยังไม่มีงานค้าง', role === 'developer' ? 'งานที่มีชื่อคุณในช่อง "นักพัฒนา" จะมาแสดงที่นี่' : 'งานที่มีชื่อคุณในช่อง "PM รับผิดชอบ" จะมาแสดงที่นี่');
      }
      // Summary strip: what needs attention this week, at a glance
      var tile = function (cls, key, value, label, sub) {
        return '<a class="mw-tile ' + cls + '" href="#mw-' + key + '" data-action="mw-jump" data-target="mw-' + key + '"><span class="mw-num num">' + value + '</span><span class="mw-label">' + label + '</span>' + (sub ? '<span class="mw-sub">' + sub + '</span>' : '') + '</a>';
      };
      html += '<div class="mw-summary">' +
        tile('hot', 'urgent', g.urgent.length, 'ต้องตามด่วน', 'เกินกำหนดหรือด่วนที่สุด') +
        tile('warm', 'this', g.thisWeek.length, 'ต้องทำสัปดาห์นี้', D.formatThai(week.from) + ' – ' + D.formatThai(week.to)) +
        (role === 'developer'
          ? '<a class="mw-tile cool" href="#mw-plan" data-action="mw-week" data-week="1"><span class="mw-num num">' + g.nextWeek.length + '</span><span class="mw-label">สัปดาห์หน้า</span><span class="mw-sub">' + D.formatThai(next.from) + ' – ' + D.formatThai(next.to) + '</span></a>'
          : tile('cool', 'next', g.nextWeek.length, 'สัปดาห์หน้า', D.formatThai(next.from) + ' – ' + D.formatThai(next.to))) +
        (role === 'developer'
          ? tile('good', 'done', g.doneThisWeek.length, 'ปิดได้สัปดาห์นี้', g.doneThisWeek.length ? 'เก่งมาก ทำต่อเลย 💪' : 'มาปิดงานแรกกัน')
          : tile('plan', 'nodue', g.noDue.length, 'ยังไม่มีวันกำหนด', g.noDue.length ? 'ใส่วันกำหนดให้ครบ' : 'ครบทุกงานแล้ว')) +
        '</div>';
      var section = function (key, title, note, list, empty) {
        return '<section class="group mw-group mw-' + key + '" id="mw-' + key + '" aria-labelledby="g-' + key + '"><h2 id="g-' + key + '">' + title + ' <span class="count">' + list.length + ' งาน</span></h2>' +
          (note ? '<p class="mw-note">' + note + '</p>' : '') +
          (list.length ? list.map(function (r) { return workCard(state, r); }).join('') : '<p class="muted mw-empty">' + empty + '</p>') + '</section>';
      };
      // urgent (left) and this week (right) side by side (user request 2026-11-11)
      html += '<div class="mw-two">' +
        section('urgent', '🔥 ต้องตามด่วน', 'เกินกำหนดแล้ว หรือ "ด่วนที่สุด" เรียงจากเร่งที่สุดก่อน', g.urgent, 'ไม่มีงานด่วน เยี่ยมมาก') +
        section('this', '📅 ต้องทำสัปดาห์นี้', 'กำหนดส่งภายในสัปดาห์นี้ (ยังไม่เกินกำหนด)', g.thisWeek, 'ไม่มีงานที่ครบกำหนดสัปดาห์นี้') +
        '</div>';
      if (role === 'developer') {
        html += weekPlanner(state, D.weekPlan(mine, name, state.today, state.weekOffset || 0));
      } else {
        html += section('next', '🗓️ สัปดาห์หน้า', 'เตรียมไว้ล่วงหน้า', g.nextWeek, 'ยังไม่มีงานสัปดาห์หน้า');
        if (g.later.length) html += section('later', 'ภายหลัง', '', g.later, '');
      }
      // PM tab: items without a due date (PMs set dates). Developer tab: what I finished this week (encouragement).
      if (role === 'pm') html += section('nodue', '🗂️ ยังไม่มีวันกำหนด', 'ใส่ "วันที่ต้องได้" ให้ครบ ทีมจะได้วางแผนได้', g.noDue, 'ทุกงานมีวันกำหนดแล้ว');
      if (role === 'developer' && g.doneThisWeek.length) {
        html += '<section class="group mw-group mw-done" id="mw-done"><h2>✅ ปิดได้สัปดาห์นี้ <span class="count">' + g.doneThisWeek.length + ' งาน</span></h2>' +
          '<ul class="mw-donelist">' + g.doneThisWeek.map(function (r) {
            return '<li><a href="#/items/' + encodeURIComponent(r.id) + '">' + esc(r.detail) + '</a> <span class="muted">' + esc(r.doneDate.raw) + '</span></li>';
          }).join('') + '</ul></section>';
      }
      return html;
    }

    var DAY_NAMES = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสฯ', 'ศุกร์', 'เสาร์', 'อาทิตย์'];

    /** Developer week planner: Mon–Fri always, Sat/Sun only when something is due. ◀ ▶ move by week. */
    function weekPlanner(state, p) {
      var off = state.weekOffset || 0;
      var title = off === 0 ? 'สัปดาห์นี้' : off === 1 ? 'สัปดาห์หน้า' : off === -1 ? 'สัปดาห์ที่แล้ว' : (off > 0 ? 'อีก ' + off + ' สัปดาห์' : (-off) + ' สัปดาห์ก่อน');
      var days = p.days.filter(function (x, i) { return i < 5 || x.items.length; });
      return '<section class="group mw-plan" id="mw-plan" aria-labelledby="g-plan"><div class="plan-head"><h2 id="g-plan">🗓️ แผนรายสัปดาห์ <span class="count">' + p.total + ' งาน</span></h2>' +
        '<div class="plan-nav"><button type="button" class="kjump-arrow" data-action="mw-week" data-week="' + (off - 1) + '" aria-label="สัปดาห์ก่อนหน้า">‹</button>' +
        '<span class="plan-range"><strong>' + esc(title) + '</strong> ' + esc(D.formatThai(p.range.from) + ' – ' + D.formatThai(p.range.to)) + '</span>' +
        '<button type="button" class="kjump-arrow" data-action="mw-week" data-week="' + (off + 1) + '" aria-label="สัปดาห์ถัดไป">›</button>' +
        (off !== 0 ? '<button type="button" class="btn small" data-action="mw-week" data-week="0">กลับสัปดาห์นี้</button>' : '') + '</div></div>' +
        '<p class="mw-note">งานที่ครบกำหนดแต่ละวัน (ใช้วันที่เลื่อนถ้ามี) งานที่เลยวันไปแล้วอยู่ใน 🔥 ต้องตามด่วน</p>' +
        '<div class="plan-grid" style="--days:' + days.length + '">' + days.map(function (x) {
          var dow = (p.days.indexOf(x));
          return '<div class="plan-day' + (x.isToday ? ' today' : '') + (x.isPast ? ' past' : '') + '"><div class="plan-date"><span>' + DAY_NAMES[dow] + '</span><strong>' + esc(D.formatThai(x.date)) + '</strong>' + (x.isToday ? '<em>วันนี้</em>' : '') + '</div>' +
            (x.items.length ? x.items.map(function (r) {
              return '<a class="plan-item' + (r.isOverdue ? ' over' : '') + (D.urgencyRank(r.urgency) === 0 ? ' top' : '') + '" href="#/items/' + encodeURIComponent(r.id) + '"><span class="num">#' + esc(r.seq) + '</span> ' + esc(r.detail) +
                '<span class="plan-meta">' + esc(r.platform) + ' · ' + esc(D.statusLabel(r.status)) + '</span></a>';
            }).join('') : '<span class="plan-free">ว่าง</span>') + '</div>';
        }).join('') + '</div></section>';
    }

    function workCard(state, r) {
      var next = D.nextStatus(r.status);
      var actions = '<a class="btn small" href="#/items/' + encodeURIComponent(r.id) + '">เปิด</a>';
      var seqOk = r.seq !== null && !r.issues.some(function (x) { return x.code === 'SEQ_DUPLICATE'; });
      if (state.user.canEdit && seqOk) {
        // pick any status (user request 2026-11-11); the next workflow step is pre-selected so one click still works
        var pick = next || r.status;
        var opt = function (s, label) { return '<option value="' + esc(s) + '"' + (s === pick ? ' selected' : '') + '>' + esc(label) + (s === r.status ? ' (ปัจจุบัน)' : '') + '</option>'; };
        actions += '<form class="qs-form" data-id="' + esc(r.id) + '"><label class="sr-only" for="qs-' + esc(r.id) + '">เปลี่ยนสถานะ #' + esc(r.seq) + '</label>' +
          '<select id="qs-' + esc(r.id) + '" name="to">' + UI.statusGroups().map(function (g) {
            return '<optgroup label="' + esc(g.label) + '">' + g.options.map(function (o) { return opt(o.value, o.label); }).join('') + '</optgroup>';
          }).join('') + '</select><button type="submit" class="btn small primary">เปลี่ยนสถานะ</button></form>';
      }
      return '<article class="work' + (r.isOverdue ? ' over' : '') + '"><div><a href="#/items/' + encodeURIComponent(r.id) + '" style="color:inherit">' + esc(r.detail) + '</a>' +
        '<div class="meta"><span>#' + esc(r.seq === null ? '–' : r.seq) + '</span><span>' + esc(r.platform) + ' / ' + esc(r.system) + '</span>' +
        (state.mwShowDev && r.developer ? '<span class="dev-name">👤 ' + esc(r.developer) + '</span>' : '') + (r.devQueue !== null ? '<span>คิวที่ ' + r.devQueue + '</span>' : '') + '<span>' + UI.urgency(r.urgency) + '</span>' + UI.statusBadge(r.status) + '<span>' + UI.due(r, state.today) + '</span>' + (r.ticketUrl ? UI.ticketLink(r) : '') + '</div></div>' +
        '<div class="actions">' + actions + '</div></article>';
    }

    // ------------------------------------------------------------------ Access management (admins)

    function access(state) {
      var html = '<div class="page-head"><h1>จัดการสิทธิ์</h1><span class="muted">ใครเพิ่มหรือแก้ไขรายการได้ (บันทึกลงชีต _app_allowed และเก็บประวัติใน _app_log)</span></div>';
      if (!state.user.isAdmin) return html + UI.emptyState('เฉพาะผู้ดูแลเท่านั้น', 'หน้านี้ใช้จัดการสิทธิ์ของทีม ถ้าต้องการสิทธิ์ผู้ดูแล ให้ติดต่อ PM');
      var a = state.access;
      if (!a) return html + UI.loading('กำลังโหลดรายชื่อทีม…');
      if (a.error) return html + UI.errorState(a.error, 'reload-access');
      var pending = a.members.filter(function (m) { return m.status === a.states.pending; });
      if (pending.length) {
        html += '<section class="panel access-pending" aria-labelledby="ap-h"><div class="panel-head"><h2 id="ap-h">คำขอรออนุมัติ <span class="count">' + pending.length + '</span></h2></div>' +
          pending.map(function (m) {
            return '<div class="access-req"><div><strong>' + esc(m.email) + '</strong>' + (m.name ? ' <span class="muted">' + esc(m.name) + '</span>' : '') + (m.note ? '<div class="muted">' + esc(m.note) + '</div>' : '') + '</div>' +
              '<div class="access-actions"><button class="btn small primary" data-action="access-set" data-email="' + esc(m.email) + '" data-field="status" data-value="' + esc(a.states.allowed) + '">อนุญาต</button>' +
              '<button class="btn small danger" data-action="access-set" data-email="' + esc(m.email) + '" data-field="status" data-value="' + esc(a.states.suspended) + '">ปฏิเสธ</button></div></div>';
          }).join('') + '</section>';
      }
      html += '<section class="panel repair-panel" aria-labelledby="ar-h"><div class="panel-head"><h2 id="ar-h">ซ่อมสีของ dropdown ในชีต</h2></div>' +
        '<p class="muted">แอปเวอร์ชันก่อน v1.6.0 ใส่เครื่องหมาย &#39; หน้าค่าที่บันทึก ทำให้ chip สีในชีตไม่ขึ้น กดปุ่มนี้เพื่อเขียนค่าเดิมกลับแบบไม่มี &#39; (เฉพาะช่องที่แอปเคยบันทึกและยังไม่มีใครแก้ต่อ) และใส่สี/dropdown ให้แถวที่เพิ่มจากแอปแล้วสีหลุด (คัดลอกจากแถวด้านบน ไม่แตะค่าในช่อง)</p>' +
        '<button class="btn primary" data-action="repair-chips">' + UI.withIcon('reload', 'ซ่อมสี dropdown') + '</button></section>';
      html += '<section class="panel" aria-labelledby="aa-h"><div class="panel-head"><h2 id="aa-h">เพิ่มคนเข้าทีม</h2></div>' +
        '<form id="access-add" class="access-add">' +
        UI.input({ name: 'acc-email', label: 'อีเมล Gmail', type: 'email', required: true, placeholder: 'name@gmail.com' }) +
        UI.input({ name: 'acc-name', label: 'ชื่อ (ไม่บังคับ)' }) +
        UI.select({ name: 'acc-role', label: 'บทบาท', options: a.roles, value: a.roles[1] || a.roles[0], allowEmpty: false }) +
        '<div class="actions"><button class="btn primary" type="submit">เพิ่มเข้าทีม</button></div></form></section>';
      // removing someone = status ระงับ + sharing taken back; the row stays as history (constitution: rows are never deleted)
      var current = a.members.filter(function (m) { return m.status === a.states.allowed; });
      var removed = a.members.filter(function (m) { return m.status === a.states.suspended; });
      html += '<section class="panel" aria-labelledby="as-h"><div class="panel-head"><h2 id="as-h">แชร์ชีตให้ทีม</h2></div>' +
        '<p class="muted">เพิ่มคนเข้าทีม = แอปแชร์ชีตให้เป็นผู้แก้ไขทันที · นำออกจากทีม = ถอนสิทธิ์แชร์ ' +
        'ถ้าจะเปลี่ยนลิงก์ชีตเป็น "ผู้มีสิทธิ์ดู" ให้กดปุ่มนี้ก่อน ทีมจะยังแก้ไขผ่านแอปได้</p>' +

        '<span class="muted">ผู้ดูแลจัดการสิทธิ์ได้ ผู้แก้ไขเพิ่ม/แก้รายการได้ เจ้าของชีตเป็นผู้ดูแลเสมอ</span></div>' +

      html += deletedPanel(state) + notifyPanel(state);

    var ACTION_TEXT = { CREATE: 'เพิ่มรายการ', UPDATE: 'แก้ไข', DELETE: 'ลบรายการ', RESTORE: 'กู้คืนรายการ', TAIGA_PUSH: 'ส่งไป Taiga' };

    /** Who changed what on this item (loaded on demand from _app_log). */
    function historyPanel(state, row) {
      var h = state.history && state.history.seq === row.seq ? state.history : null;
      var body;
      if (!h || h.loading) body = '<p class="muted">' + (h ? 'กำลังโหลดประวัติ…' : 'กดเพื่อดูว่าใครเปลี่ยนอะไร เมื่อไร') + '</p>';
      else if (h.error) body = '<p class="err">' + esc(h.error) + '</p>';
      else if (!h.list.length) body = '<p class="muted">ยังไม่มีประวัติในแอป (รายการที่แก้ในชีตโดยตรงจะไม่มีประวัติ)</p>';
      else {
        body = '<ol class="hist">' + h.list.map(function (e) {
          var what = e.action === 'UPDATE' || e.action === 'CREATE' || e.action === 'TAIGA_PUSH'
            ? '<strong>' + esc(e.column) + '</strong>' + (e.action !== 'CREATE' ? ': <span class="hist-from">' + esc(e.from || '(ว่าง)') + '</span> → ' : ': ') + '<span class="hist-to">' + esc(e.to || '(ว่าง)') + '</span>'
            : '<strong>' + esc(ACTION_TEXT[e.action] || e.action) + '</strong>';
          return '<li><span class="hist-time num">' + esc(e.time) + '</span><span class="hist-who">' + esc(e.who) + '</span><span class="hist-what">' + (e.action === 'UPDATE' ? '' : esc(ACTION_TEXT[e.action] || '') + ' ') + what + '</span></li>';
        }).join('') + '</ol>';
      }
      return '<details class="panel hist-panel" id="history"' + (h ? ' open' : '') + '><summary data-action="history-load" data-seq="' + esc(row.seq) + '">' + UI.withIcon('list', 'ประวัติการแก้ไข') + '</summary>' + body + '</details>';
    }

    /** Admins: deleted items that can be put back from their _app_log snapshot. */
    function deletedPanel(state) {
      var d = state.deleted;
      var body;
      if (!d) body = '<button class="btn" data-action="deleted-load">ดูรายการที่ถูกลบ</button>';
      else if (d.loading) body = UI.loading('กำลังโหลด…');
      else if (d.error) body = '<p class="err">' + esc(d.error) + '</p>';
      else if (!d.list.length) body = '<p class="muted">ไม่มีรายการที่ถูกลบ (หรือกู้คืนครบแล้ว)</p>';
      else {
        body = '<div class="table-wrap"><table><thead><tr><th>ลำดับ</th><th>รายละเอียด</th><th>ลบเมื่อ</th><th>โดย</th><th></th></tr></thead><tbody>' + d.list.map(function (x) {
          return '<tr><td class="num">' + esc(x.seq) + '</td><td>' + esc(x.detail) + ' <span class="muted">(' + esc(D.statusLabel(x.status)) + ')</span></td><td class="num">' + esc(x.time) + '</td><td>' + esc(x.who) + '</td>' +
            '<td><button class="btn small" data-action="restore" data-log="' + esc(x.logRow) + '" data-seq="' + esc(x.seq) + '">กู้คืน</button></td></tr>';
        }).join('') + '</tbody></table></div>';
      }
      return '<section class="panel" aria-labelledby="del-h"><h2 id="del-h">กู้คืนรายการที่ถูกลบ</h2><p class="muted">กู้คืนจากสำเนาใน _app_log รายการจะกลับไปท้ายชีตด้วยเลขลำดับเดิม</p>' + body + '</section>';
    }

    /** Admins: LINE digest via แมวส้ม (the app only queues messages in _app_notify). */
    function notifyPanel() {
      return '<section class="panel" aria-labelledby="ntf-h"><h2 id="ntf-h">แจ้งเตือน LINE ผ่านแมวส้ม</h2>' +
        '<p class="muted">ทุกเช้าวันจันทร์ ระบบจะเตรียมสรุปงานเกินกำหนดและงานสัปดาห์นี้ของนักพัฒนาแต่ละคนไว้ในชีต _app_notify แล้วแมวส้มจะส่งเข้า LINE</p>' +
        '<button class="btn" data-action="digest-now">ส่งสรุปตอนนี้ (ทดสอบ)</button></section>';

    // ------------------------------------------------------------------ Closed-work report (2026-11-20)

    var DR_MODES = [['month', 'รายเดือน'], ['year', 'ทั้งปี'], ['range', 'กำหนดช่วงวันที่เอง'], ['all', 'ไม่กรองวันที่เสร็จ']];

    /** The status choice: "closed" = every closing status, "" = every status, else one exact value. */
    function drStatuses(value) {
      if (value === 'closed') return D.CLOSED.slice();
      return value ? [value] : [];
    }

    /** {statuses, period} for Domain.doneReport from the page's choices. */
    function drQuery(dr) {
      var period = { mode: dr.mode, y: dr.y, m: dr.m };
      if (dr.mode === 'range') period = { mode: 'range', from: D.parseDate(dr.from).date, to: D.parseDate(dr.to).date };
      return { statuses: drStatuses(dr.status), period: period };
    }

    function drPeriodLabel(dr, range) {
      if (dr.mode === 'month') return D.THAI_MONTHS_LONG[dr.m - 1] + ' ' + (dr.y + 543);
      if (dr.mode === 'year') return 'ปี ' + (dr.y + 543);
      if (dr.mode === 'range' && range) return (range.from ? D.formatThai(range.from) : '…') + ' ถึง ' + (range.to ? D.formatThai(range.to) : '…');
      return 'ทุกช่วงเวลา';
    }

    /** แพลตฟอร์ม / PM (incl. PM teams) narrow the rows first, then status + วันที่เสร็จ (user request 2026-11-20). */
    function drReport(state) {
      var dr = state.dr;
      var rows = D.applyFilters(state.rows, {
        platform: dr.platform ? [dr.platform] : [],
        pm: D.pmFilter(dr.pm, (state.options && state.options.pm) || []),
      });
      return D.doneReport(rows, drQuery(dr));
    }

    function doneReport(state) {
      var dr = state.dr;
      var rep = drReport(state);
      var statusOpts = { name: 'dr-status', label: 'สถานะ', icon: 'report', value: dr.status, emptyLabel: 'ทุกสถานะ',
        options: ['closed'].concat(D.WORKFLOW),
        groups: [{ label: 'ปิดงาน', options: [{ value: 'closed', label: 'ปิดแล้วทั้งหมด (3 สถานะ)' }] }].concat(UI.statusGroups()) };
      var modeSel = UI.select({ name: 'dr-mode', label: 'กรองจากวันที่เสร็จ', icon: 'calendar', value: dr.mode, allowEmpty: false,
        options: DR_MODES.map(function (x) { return x[0]; }),
        groups: [{ label: 'ช่วงเวลา', options: DR_MODES.map(function (x) { return { value: x[0], label: x[1] }; }) }] });
      var years = D.doneYears(state.rows, state.today);
      if (years.indexOf(dr.y) === -1) years.push(dr.y);
      var yearSel = UI.select({ name: 'dr-year', label: 'ปี (พ.ศ.)', value: String(dr.y), allowEmpty: false, options: years.map(String),
        groups: [{ label: 'ปี', options: years.map(function (y) { return { value: String(y), label: String(y + 543) }; }) }] });
      var monthSel = UI.select({ name: 'dr-month', label: 'เดือน', value: String(dr.m), allowEmpty: false,
        options: D.THAI_MONTHS_LONG.map(function (_, i) { return String(i + 1); }),
        groups: [{ label: 'เดือน', options: D.THAI_MONTHS_LONG.map(function (n, i) { return { value: String(i + 1), label: n }; }) }] });
      var period = dr.mode === 'month' ? monthSel + yearSel :
        dr.mode === 'year' ? yearSel :
        dr.mode === 'range' ? UI.dateField({ name: 'dr-from', label: 'วันที่เสร็จตั้งแต่', icon: 'calendar', value: dr.from }) + UI.dateField({ name: 'dr-to', label: 'ถึง', icon: 'calendar', value: dr.to }) : '';

      var html = '<div class="page-head"><h1>รายงานงานที่ปิด</h1><span class="muted">' + esc(drPeriodLabel(dr, rep.range)) + '</span>' +
        '<span class="spacer"></span><button class="btn small" data-action="reload">โหลดข้อมูลใหม่</button>' +
        '<button class="btn small primary" data-action="dr-export"' + (rep.total ? '' : ' disabled') + '>' + UI.withIcon('download', 'Export CSV (Excel)') + '</button></div>';
      var platformSel = UI.select({ name: 'dr-platform', label: 'แพลตฟอร์ม', icon: 'platform', options: state.options.platform, value: dr.platform, emptyLabel: 'ทั้งหมด' });
      var pmSel = pmFilterSelect(state.options.pm || [], dr.pm, 'dr-pm');
      html += '<form class="filters dr-filters" id="dr-form" aria-label="ตัวเลือกรายงาน">' + UI.select(statusOpts) + platformSel + pmSel + modeSel + period + '</form>';
      html += '<div class="dr-summary" role="status"><span>พบ <strong id="dr-count" class="num">' + rep.total + '</strong> รายการ</span>' +
        rep.byStatus.map(function (s) { return '<span class="dr-chip">' + UI.statusBadge(s.status) + ' <span class="num">' + s.count + '</span></span>'; }).join('') + '</div>';
      if (rep.noDoneDate) {
        html += '<div class="banner warn" role="note">มี ' + rep.noDoneDate + ' รายการในสถานะที่เลือกที่ยังไม่มีวันที่เสร็จ จึงไม่อยู่ในรายงานนี้ ' +
          'เลือก "ไม่กรองวันที่เสร็จ" เพื่อดูและเติมวันที่</div>';
      }
      if (!rep.total) return html + UI.emptyState('ไม่มีรายการในช่วงนี้', 'ลองเปลี่ยนสถานะ หรือช่วงวันที่เสร็จ', '');
      html += '<div class="table-wrap"><table class="responsive" id="dr-table"><thead><tr>' +
        '<th>ลำดับ</th><th data-hide-mobile>แพลตฟอร์ม</th><th data-hide-mobile>ระบบงาน</th><th>รายละเอียด</th><th>Taiga/MANTIS</th><th>สถานะ</th><th>นักพัฒนา</th><th>ผู้ทดสอบ</th><th data-hide-mobile>PM</th><th>วันที่เสร็จ</th><th data-hide-mobile>วันที่ Deploy</th>' +
        '</tr></thead><tbody>' + rep.rows.map(function (r) {
          return '<tr class="clickable" data-action="open-item" data-id="' + esc(r.id) + '">' +
            ['seq', 'platform', 'system', 'detail', 'ticket', 'status', 'developer', 'tester', 'pm'].map(function (k) {
              if (k === 'seq') return '<td class="num" data-hide-mobile>' + esc(r.seq === null ? '–' : r.seq) + '</td>';
              if (k === 'tester') return '<td>' + (r.tester ? esc(r.tester) : '<span class="muted">–</span>') + '</td>';
              return ITEM_COLS[k].cell(r, state);
            }).join('') +
            '<td class="num">' + (r.doneDate.date ? esc(D.formatThai(r.doneDate.date)) : '<span class="muted">–</span>') + '</td>' +
            '<td class="num" data-hide-mobile>' + (r.deployDate.date ? esc(D.formatThai(r.deployDate.date)) : '<span class="muted">–</span>') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      return html;
    }

    // ------------------------------------------------------------------ Taiga register (user request 2026-11-20)

    var TG_SCOPES = [['open', 'งานที่ยังไม่ปิด'], ['closed', 'ปิดแล้ว'], ['all', 'ทั้งหมด']];

    /** แพลตฟอร์ม / PM / search narrow the rows, then the register picks the Taiga items. */
    function tgReport(state) {
      var tg = state.tg;
      var rows = D.applyFilters(state.rows, {
        platform: tg.platform ? [tg.platform] : [],
        pm: D.pmFilter(tg.pm, (state.options && state.options.pm) || []),
      });
      if (tg.q) rows = D.search(rows, tg.q);
      if (tg.sync && state.taiga && state.taiga.available) rows = rows.filter(function (r) { return tgCompare(state, r).state === tg.sync; });
      var rep = D.taigaRegister(rows, { scope: tg.scope });
      var early = rep.rows.filter(function (r) { return tgReview(state, r); });
      if (tg.review && early.length) rep = D.taigaRegister(early, { scope: tg.scope });
      rep.earlyCount = early.length;
      return rep;
    }

    /** Developed before the PM passed the Taiga item (2026-11-24); works from the sheet alone when there is no Taiga log. */
    function tgReview(state, r) {
      return D.devBeforeReview(r, tgCompare(state, r), state.today);
    }
    function tgStatusCell(state, r) {
      var f = tgReview(state, r);
      return '<td>' + UI.statusBadge(r.status) + (f ? '<div class="tg-review"><strong>⚠ PM ยังไม่ตรวจผ่าน Taiga แต่เริ่มพัฒนาแล้ว</strong>' +
        '<span>' + esc(f.join(' · ')) + '</span></div>' : '') + '</td>';
    }

    /** Compare a row with Taiga; duplicates are counted over every row, not only the filtered ones. */
    function tgCompare(state, r) {
      if (!state.taiga || !state.taiga.available) return null;
      if (state.tgCounts === undefined || state.tgCountsOf !== state.rows) {
        state.tgCounts = D.taigaKeyCounts(state.rows);
        state.tgCountsOf = state.rows;
      }
      return D.taigaCompare(r, state.taiga.latest, state.taiga.map, state.tgCounts, state.taiga.appMap);
    }

    var TG_SYNC = [['diff', 'ไม่ตรงกับ Taiga'], ['match', 'ตรงกับ Taiga'], ['unmapped', 'ยังไม่จับคู่สถานะ'], ['deleted', 'ถูกลบใน Taiga'], ['none', 'ยังไม่มีข้อมูลจาก Taiga']];

    /** 24/11/2026 10:05 in Bangkok time. @param {number|null} ms */
    function tgTime(ms) {
      if (!ms) return '';
      var p = {};
      new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })
        .formatToParts(new Date(ms)).forEach(function (x) { p[x.type] = x.value; });
      return Number(p.day) + '/' + Number(p.month) + '/' + p.year + ' ' + p.hour + ':' + p.minute;
    }

    function tgTaigaCell(state, r) {
      var c = tgCompare(state, r);
      if (!c || c.state === 'none') return '<td><span class="muted">–</span></td>';
      var t = c.taiga;
      var who = [t.by, tgTime(t.at)].filter(Boolean).join(' · ');
      var html = '<td class="tg-taiga"><span class="tg-cap">ใน Taiga: </span><strong>' + esc(t.status || '–') + '</strong>' + (who ? '<div class="muted tg-who">' + esc(who) + '</div>' : '');
      if (c.state === 'match') html += '<div class="tg-sync tg-sync-match">✓ ตรงกัน</div>';
      else if (c.state === 'deleted') html += '<div class="tg-sync tg-sync-deleted">ถูกลบใน Taiga</div>';
      else if (c.state === 'unmapped') html += '<div class="tg-sync tg-sync-unmapped">ยังไม่จับคู่สถานะ</div>' + tgPushButton(state, r, c);
      else {
        html += '<div class="tg-sync tg-sync-diff">⚠ ควรเป็น ' + esc(D.statusLabel(c.expected)) + '</div>';
        if (c.duplicate) html += '<div class="muted tg-who">ลิงก์ Taiga นี้อยู่หลายรายการ ปรับเองทีละรายการ</div>';
        else if (c.canApply && state.user.canEdit && state.schema.ok) {
          html += '<button type="button" class="btn small" data-action="tg-apply" data-id="' + esc(r.id) + '" aria-label="ปรับตาม Taiga รายการ #' + esc(r.seq) + '">ปรับตาม Taiga</button>';
        }
        html += tgPushButton(state, r, c);
      }
      return html + '</td>';
    }

    /** The other direction: send the sheet status to Taiga (user request 2026-11-25). */
    function tgPushButton(state, r, c) {
      var host = state.taiga.host;
      if (!c.pushTo || !state.user.canEdit || !state.schema.ok || !host || D.taigaKey(D.taigaLink(r)).split('/')[0] !== host) return '';
      return '<button type="button" class="btn small" data-action="tg-push" data-id="' + esc(r.id) + '" aria-label="ปรับ Taiga ตามชีต รายการ #' + esc(r.seq) + '">ปรับ Taiga ตามชีต</button>';
    }

    /** Admins pair Taiga statuses with app statuses, then the sheet statuses left over. Saving a pair changes no item. */
    function tgMapPanel(state) {
      var t = state.taiga;
      var appMap = t.appMap || {};
      var names = D.taigaNames(t.statuses, t.map, appMap).sort();
      var gaps = D.statusTaigaGaps(t.map, appMap);
      var left = names.filter(function (n) { return !Object.prototype.hasOwnProperty.call(t.map, n); }).length +
        gaps.filter(function (g) { return !appMap[g.app]; }).length;
      var html = '<details class="tg-map" id="tg-map"' + (state.tg.mapOpen ? ' open' : '') + '><summary>จับคู่สถานะ Taiga กับสถานะในแอป' + (left ? ' (ยังไม่จับคู่ ' + left + ')' : '') + '</summary>';
      if (!names.length) return html + '<p class="muted">ยังไม่มีสถานะจาก Taiga ให้จับคู่</p></details>';
      html += '<p class="muted">การจับคู่ใช้บอกว่างานตรงกับ Taiga หรือไม่ ไม่เปลี่ยนสถานะงานเอง</p><div class="tg-map-grid">' + names.map(function (n, i) {
        var cur = Object.prototype.hasOwnProperty.call(t.map, n) ? t.map[n] : '';
        return '<label for="tg-map-' + i + '">' + esc(n) + '</label><select id="tg-map-' + i + '" class="tg-map-select" data-taiga="' + esc(n) + '"><option value="">— ไม่จับคู่ —</option>' +
          D.WORKFLOW.map(function (s) { return '<option value="' + esc(s) + '"' + (s === cur ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select>';
      }).join('') + '</div>';
