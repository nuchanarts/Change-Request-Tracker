<script>
  /* App: state store, router, API client and event handling. */
  (function () {
    'use strict';
    var D = Domain;
    var KEYS = { filters: 'ehp.filters.v1', tour: 'ehp.tour.v1', name: 'ehp.myname.v1', pmName: 'ehp.mypm.v1', tab: 'ehp.mytab.v1', devAll: 'ehp.mydevall.v1', devView: 'ehp.mydevview.v1' };
    var EMPTY_FILTERS = { platform: '', pm: '', developer: '', urgency: '', from: '', to: '' };

    function store(key, value) {
      try {
        if (value === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        return null; // storage unavailable (private mode): app still works, just doesn't remember
      }
      return value;
    }

    var state = {
      phase: 'loading',
      error: null,
      rows: [],
      byId: {},
      options: null,
      user: null,
      today: null,
      schema: { ok: true, missing: [] },
      loadedAt: '',
      filters: Object.assign({}, EMPTY_FILTERS, store(KEYS.filters) || {}),
      drill: null,
      drills: {},
      itemsQuery: '',
      itemsState: 'open',
      itemsPage: 0,
      sort: { key: 'seq', dir: -1 }, // newest first, as the register always was
      myTab: store(KEYS.tab) || 'developer',
      mwFilter: store('ehp.mwfilter.v1') || {},
      asHidden: store('ehp.ashidden.v1') || [], // มอบหมายงาน: statuses hidden by the dev lead
      kanbanCollapsed: store('ehp.kcollapsed.v1') || {},
      kanbanShowEmpty: store('ehp.kshowempty.v1') === true,
      choosingName: false,
      formErrors: null,
      formWarnings: null,
      formDraft: null,
      formAlert: null,
      tourStep: null,
    };

    state.registerDrill = function (title, ids) {
      var key = 'd' + Object.keys(state.drills).length;
      state.drills[key] = { title: title, ids: ids.slice() };
      return key;
    };
    var COLS_KEY = 'ehp.itemcols.v1';
    /** Column order for the items table: saved order (known keys only) + any new columns, else the default. */
    state.itemCols = function () {
      var log = !!(state.taiga && state.taiga.available);
      var def = Views.ITEM_COLS_DEFAULT.filter(function (k) { return k !== 'taiga' || log; });
      var saved = store(COLS_KEY);
      if (!Array.isArray(saved)) return def.slice();
      var order = saved.filter(function (k) { return def.indexOf(k) !== -1; });
      // a column the saved order does not know goes after its neighbour in the default order
      def.forEach(function (k, i) { if (order.indexOf(k) === -1) order.splice(i ? order.indexOf(def[i - 1]) + 1 : 0, 0, k); });
      return order;
    };
    function saveCols(order) {
      store(COLS_KEY, order);
      render();
    }
    function moveCol(key, toIndex) {
      var order = state.itemCols();
      var from = order.indexOf(key);
      if (from === -1 || toIndex < 0 || toIndex >= order.length) return;
      order.splice(toIndex, 0, order.splice(from, 1)[0]);
      saveCols(order);
    }
    state.moveCol = moveCol;

    /**
     * Whose work นักพัฒนา (my-work) / งาน PM shows. A view only: it never changes who "me" is
     * ("ฉันไม่ใช่กิ่ง", user 2026-11-18). Who I am comes from the admin's team list.
     */
    function setMyName(name) {
      if (!name) return;
      state.choosingName = false;
      if (state.myTab === 'pm') {
        store(KEYS.pmName, name); // the PM menu remembers its own name, separate from the developer one
        return render();
      }
      store(KEYS.devAll, name === D.ALL_DEVELOPERS);
      if (name !== D.ALL_DEVELOPERS) store(KEYS.devView, name);
      render();
    }

    /** The account menu shows who I am; only an admin can change it (จัดการสิทธิ์, user decision 2026-11-20). */
    function renderMyName() {
      document.getElementById('my-name-text').textContent = state.myName() || 'ยังไม่ได้ตั้งชื่อ';
    }

    function setMwFilter(key, value) {
      state.mwFilter[key] = value;
      if (!value) delete state.mwFilter[key];
      store('ehp.mwfilter.v1', state.mwFilter);
      render();
    }

    state.pmName = function () {
      var saved = store(KEYS.pmName);
      if (saved) return saved;
      var me = state.myName();
      return state.options && state.options.pm && state.options.pm.indexOf(me) !== -1 ? me : '';
    };
    /** Whose work งานของฉัน shows: ทุกคน, or me. */
    state.devName = function () {
      return store(KEYS.devAll) === true ? D.ALL_DEVELOPERS : store(KEYS.devView) || state.myName();
    };
    state.myName = function () {
      // the server's answer only: a name typed into this browser earlier no longer counts (2026-11-20)
      return (state.user && state.user.name) || '';
    };
    state.domainFilters = function () {
      var f = state.filters;
      var one = function (v) { return v ? [v] : []; };
      var from = D.parseDate(f.from);
      var to = D.parseDate(f.to);
      return {
        platform: one(f.platform), pm: D.pmFilter(f.pm, (state.options && state.options.pm) || []), developer: one(f.developer), urgency: one(f.urgency),
        dateFrom: from.issue ? null : from.date, dateTo: to.issue ? null : to.date,
      };
    };
    state.filteredRows = function () {
      return D.applyFilters(state.rows, state.domainFilters());
    };
    function sortRows(list) {
      var k = state.sort.key;
      var dir = state.sort.dir;
      var val = function (r) {
        if (k === 'due') return r.effectiveDue ? r.effectiveDue.y * 10000 + r.effectiveDue.m * 100 + r.effectiveDue.d : 99999999;
        if (k === 'seq') return r.seq === null ? 1e9 * dir : r.seq; // no ลำดับ: always last
        if (k === 'status') return D.statusRank(r.status);
        if (k === 'urgency') return D.urgencyRank(r.urgency);
        return r[k] || '￿';
      };
      return list.slice().sort(function (a, b) {
        var x = val(a);
        var y = val(b);
        return (x < y ? -1 : x > y ? 1 : (a.seq || 0) - (b.seq || 0)) * dir;
      });
    }
    state.sortRows = sortRows;

    // ------------------------------------------------------------------ API

    // Calls that only read; everything else changes data and must wait for fresh data (snapshot, 2026-11-20).
    var READ_ONLY_API = ['Api_bootstrap', 'Api_heartbeat', 'Api_itemHistory', 'Api_listAccess', 'Api_listDeleted', 'Api_taiga'];

    function api(name, arg) {
      if (state.stale && READ_ONLY_API.indexOf(name) === -1) {
        return Promise.resolve({ ok: false, code: 'STALE', message: 'กำลังโหลดข้อมูลล่าสุดจากชีต รอสักครู่แล้วลองใหม่อีกครั้ง' });
      }
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (res) {
            resolve(res || { ok: false, code: 'ERROR', message: 'ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์' });
          })
          .withFailureHandler(function (err) {
            console.error(name, err);
            resolve({ ok: false, code: 'ERROR', message: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่' });
          })[name](arg);
      });
    }

    // ------------------------------------------------------------------ presence (2026-11-18)
    // Heartbeat every 60 s while the tab is visible; the server keeps who is online in the script cache.

    var HEARTBEAT_MS = 60000;
    var hbTimer = null;
    var hbDebounce = null;

    function presenceView() {
      var r = route();
      if (r.name === 'items' && r.id) {
        var row = state.byId[r.id];
        return { view: 'edit', seq: row && row.seq !== null ? row.seq : null };
      }
      if (r.name === 'my-work' && r.id === 'pm') return { view: 'my-work-pm', seq: null };
      return { view: r.name, seq: null };
    }

    function renderPresence() {
      var box = document.getElementById('presence');
      var list = state.online || [];
      box.hidden = !list.length;
      document.getElementById('presence-count').innerHTML = '<span class="presence-dot" aria-hidden="true"></span><span class="num">' + list.length + '</span> คนออนไลน์';
      document.getElementById('presence-list').innerHTML = Views.presenceList(state);
      var warn = document.getElementById('presence-warn');
      var r = route();
      if (warn && r.name === 'items' && r.id) {
        var html = Views.presenceWarn(state, state.byId[r.id]);
        if (warn.innerHTML !== html) warn.innerHTML = html; // unchanged: no rewrite, so screen readers are not re-told
      }
    }

    function heartbeat() {
      if (document.visibilityState === 'hidden' || !state.user) return;
      api('Api_heartbeat', presenceView()).then(function (res) {
        if (!res.ok) return console.warn('heartbeat', res.code); // silent: presence is a nice-to-have
        state.online = res.data.online;
        state.onlineAt = res.data.nowMs;
        renderPresence();
      });
    }

    function startHeartbeat() {
      if (hbTimer) return;
      heartbeat();
      hbTimer = setInterval(heartbeat, HEARTBEAT_MS);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') heartbeat();
      });
    }

    function heartbeatSoon() {
      if (!hbTimer) return;
      clearTimeout(hbDebounce);
      hbDebounce = setTimeout(heartbeat, 2000);
    }

    // ------------------------------------------------------------------ colour themes (2026-11-20)
    // A per-browser choice (like the remembered filters): stored in localStorage, applied before the first paint
    // of each view. Unknown values fall back to the default green.

    var SKIN_KEY = 'ehp.skin.v1';
    var SKINS = [
      { id: 'green', label: 'เขียว (ค่าเริ่มต้น)', color: '#0f766e' },
      { id: 'sky', label: 'ฟ้า', color: '#1d64b0' },
      { id: 'pink', label: 'ชมพู', color: '#b3195a' },
      { id: 'purple', label: 'ม่วง', color: '#6d28d9' },
      { id: 'orange', label: 'ส้ม', color: '#b93e0b' },
    ];

    function applySkin(id) {
      var skin = SKINS.filter(function (s) { return s.id === id; })[0] || SKINS[0];
      if (skin.id === 'green') document.documentElement.removeAttribute('data-skin');
      else document.documentElement.setAttribute('data-skin', skin.id);
      var host = document.getElementById('skin-pick');
      if (host) {
        host.innerHTML = SKINS.map(function (s) {
          return '<button type="button" data-skin="' + s.id + '" data-action="pick-skin" style="--sw:' + s.color + '" aria-pressed="' + (s.id === skin.id) + '" aria-label="ธีม' + UI.esc(s.label) + '" title="' + UI.esc(s.label) + '"></button>';
        }).join('');
      }
      return skin.id;
    }
    applySkin(store(SKIN_KEY));

    // The account menu opens towards the side with room: when the header wraps, the avatar sits at the left
    // edge and a right-aligned popover would open off screen (found 2026-11-20).
    document.getElementById('user-menu').addEventListener('toggle', function (ev) {
      var menu = ev.currentTarget;
      if (!menu.open) return;
      var pop = menu.querySelector('.user-pop');
      pop.style.transform = '';
      menu.classList.toggle('pop-left', menu.getBoundingClientRect().right < 290);
      // still off screen (narrow phones): slide it back inside with an 8px margin
      var r = pop.getBoundingClientRect();
      var vw = document.documentElement.clientWidth;
      var dx = r.right > vw - 8 ? vw - 8 - r.right : r.left < 8 ? 8 - r.left : 0;
      if (dx) pop.style.transform = 'translateX(' + Math.round(dx) + 'px)';
    });

    // ------------------------------------------------------------------ remembered copy (speed, 2026-11-20)
    // The last good load is kept in this browser. The next visit shows it at once, marked "กำลังอัปเดต",
    // and replaces it when the server answers. Writes wait for fresh data (api() refuses them meanwhile).

    var SNAP_KEY = 'ehp.snapshot.v1';
    var SNAP_MAX_AGE_MS = 3 * 24 * 3600 * 1000;

    // The account that opened this page (set by doGet). A copy is shown only to the account that saved it,
    // so switching Google accounts in the same browser never shows someone else's data.
    var VIEWER = String(document.body.getAttribute('data-viewer') || '').toLowerCase();

    function saveSnapshot(b) {
      var owner = String((b.user && b.user.email) || '').toLowerCase();
      if (!owner || owner !== VIEWER) return clearSnapshot(); // unknown account: never remember
      try {
        localStorage.setItem(SNAP_KEY, JSON.stringify({ at: Date.now(), owner: owner, data: b }));
      } catch (e) {
        try { localStorage.removeItem(SNAP_KEY); } catch (e2) { /* storage blocked */ }
      }
    }
    window.__appApi = function (name, arg) { return api(name, arg); }; // e2e: try a call from the page

    function readSnapshot() {
      try {
        var snap = JSON.parse(localStorage.getItem(SNAP_KEY) || 'null');
        if (snap && snap.data && VIEWER && snap.owner === VIEWER && Date.now() - snap.at < SNAP_MAX_AGE_MS) return snap;
        if (snap) clearSnapshot(); // another account's, too old, or from an older version
      } catch (e) { /* missing or corrupt */ }
      return null;
    }
    function clearSnapshot() {
      try { localStorage.removeItem(SNAP_KEY); } catch (e) { /* storage blocked */ }
    }

    function setStale(on, failed) {
      state.stale = on;
      if (on) document.body.setAttribute('data-stale', '1');
      else document.body.removeAttribute('data-stale');
      var pill = document.getElementById('sync-pill');
      if (!pill) {
        pill = document.createElement('button');
        pill.type = 'button';
        pill.id = 'sync-pill';
        pill.setAttribute('data-action', 'reload');
        pill.setAttribute('role', 'status');
        document.body.appendChild(pill);
      }
      pill.hidden = !on;
      pill.classList.toggle('failed', !!failed);
      pill.innerHTML = failed
        ? 'อัปเดตข้อมูลไม่สำเร็จ แสดงข้อมูลเมื่อ ' + UI.esc(state.loadedAt) + ' · กดเพื่อลองใหม่'
        : '<span class="spin" aria-hidden="true"></span>กำลังอัปเดตข้อมูลล่าสุด…';
    }

    function showSnapshot() {
      // local preview tests reload pages mid-test; they opt in with ?snapshot=1 (tests/e2e/mock-gas.js)
      if (window.__mockNoSnapshot) return false;
      var snap = readSnapshot();
      if (!snap) return false;
      try {
        applyBootstrap(snap.data, true);
      } catch (e) {
        clearSnapshot();
        return false;
      }
      return true;
    }

    function load() {
      state.phase = state.rows.length ? 'refreshing' : 'loading';
      if (state.phase === 'loading') render();
      return api('Api_bootstrap').then(function (res) {
        if (!res.ok) {
          // keep a remembered copy only for a network hiccup; lost access or bad setup must not show old data
          if (state.stale && res.code === 'ERROR') {
            state.phase = 'ready';
            setStale(true, true);
            return UI.toast(res.message, 'error');
          }
          clearSnapshot();
          setStale(false);
          state.phase = 'error';
          state.error = res.message;
          return render();
        }
        saveSnapshot(res.data);
        applyBootstrap(res.data, false);
      });
    }

    function applyBootstrap(b, stale) {
      state.today = b.today;
      state.user = b.user;
      state.options = b.options;
      state.schema = b.schema;
      state.loadedAt = b.loadedAt;
      var rows = b.rows.map(function (r) { return D.enrich(r, b.today); });
      var seqCounts = D.countSeq(rows);
      state.byId = {};
      rows.forEach(function (r) {
        r.issues = D.detectIssues(r, b.options, seqCounts);
        // duplicate ลำดับ must not share an id, or links/moves could hit the wrong row
        if (r.seq !== null && seqCounts[r.seq] > 1) r.id = 'row:' + r.rowNumber;
        state.byId[r.id] = r;
      });
      state.rows = rows;
      if (!(state.history && state.history.loading)) state.history = null; // reload history next time (keep an in-flight load)
      state.phase = 'ready';
      document.getElementById('sheet-name').textContent = b.spreadsheetName;
      document.getElementById('nav-access').hidden = !b.user.isAdmin;
      // dev lead menu: editors only, with the number of open items that still need a developer
      var unassigned = D.unassignedQueue(rows, state.today).length;
      document.getElementById('nav-assign').hidden = !(b.user.canEdit && b.schema.ok);
      document.getElementById('nav-assign-count').textContent = unassigned ? String(unassigned) : '';
      document.getElementById('nav-assign').setAttribute('aria-label', 'มอบหมายงาน (ยังไม่มีนักพัฒนา ' + unassigned + ' งาน)');
      var menu = document.getElementById('user-menu');
      menu.hidden = !b.user.email;
      document.getElementById('user-email').textContent = b.user.email || '';
      document.getElementById('user-avatar').textContent = (b.user.email || '?').charAt(0).toUpperCase();
      document.getElementById('user-role').textContent = b.user.isAdmin ? 'ผู้ดูแล' : b.user.canEdit ? 'ผู้แก้ไข' : 'ดูอย่างเดียว';
      renderMyName();
      state.access = null;
      state.taigaFresh = false; // read the Taiga log again with the new rows; the old answer stays on screen meanwhile
      setStale(stale);
      render();
      if (stale) return; // the tour and presence wait for the real answer
      startHeartbeat();
      // offer the tour once per page load, never again after saves/reloads (or when storage is blocked)
      if (!state.tourOffered) {
        state.tourOffered = true;
        if (!store(KEYS.tour)) startTour();
      }
    }

    // ------------------------------------------------------------------ router & render

    /*
     * Routing. In Apps Script the app runs inside a sandboxed iframe: the visible URL belongs to the outer
     * page, so the iframe's own location/hashchange cannot drive navigation. The current route lives in
     * `currentHash`; links are intercepted, and the outer URL is kept in sync with google.script.history
     * (back/forward via setChangeHandler, deep links via google.script.url). Outside Apps Script (local
     * preview, tests) the browser hash is used instead.
     */
    var gasHistory = window.google && google.script && google.script.history;
    var currentHash = gasHistory ? '#/monitor' : location.hash || '#/monitor';

    function route() {
      var h = (currentHash || '#/monitor').slice(2).split('/');
      var r = { name: h[0] || 'monitor', id: h[1] ? decodeURIComponent(h[1]) : null };
      if (r.name === 'items' && !r.id) r.name = 'taiga'; // "รายการทั้งหมด" is part of ทะเบียน Taiga now (2026-11-25)
      return r;
    }
    /** An old link or bookmark to "รายการทั้งหมด" still shows every item. */
    function isOldItemsLink() {
      return /^#\/items\/?$/.test(currentHash);
    }

    function showRoute(hash) {
      currentHash = hash || '#/monitor';
      if (isOldItemsLink()) taigaState().tg.kind = 'all';
      resetForm();
      render();
      heartbeatSoon();
      document.getElementById('main').focus({ preventScroll: true });
      var y = pendingBack ? scrollMemo[currentHash] || 0 : 0;
      pendingBack = false;
      window.scrollTo(0, y);
    }

    function render() {
      var main = document.getElementById('main');
      var r = route();
      document.querySelectorAll('.nav a').forEach(function (a) {
        var active = a.getAttribute('data-route') === (r.name === 'my-work' && r.id === 'pm' ? 'my-work-pm' : r.name === 'items' ? 'taiga' : r.name);
        if (active) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      if (state.phase === 'loading') return (main.innerHTML = UI.loading('กำลังโหลดข้อมูลจากชีต…'));
      if (state.phase === 'error') return (main.innerHTML = UI.errorState(state.error, 'reload'));
      state.drills = {};
      var html;
      if (r.name === 'items' && r.id) {
        var row = state.byId[r.id];
        html = row ? Views.form(state, 'edit', row) : UI.emptyState('ไม่พบรายการนี้', 'รายการอาจถูกเปลี่ยนเลขลำดับในชีต ลองโหลดข้อมูลใหม่', '<a class="btn" href="#/taiga">กลับไปที่ทะเบียน Taiga</a>');
      }
      else if (r.name === 'new') html = Views.form(state, 'new', null);
      else if (r.name === 'my-work') {
        state.myTab = r.id === 'pm' ? 'pm' : 'developer';
        html = Views.myWork(state);
      }
      else if (r.name === 'kanban') html = Views.kanban(state);
      else if (r.name === 'assign') html = Views.assign(state);
      else if (r.name === 'access') {
        if (state.user.isAdmin && !state.access && !state.accessLoading) loadAccess();
        html = Views.access(state);
      }
      else if (r.name === 'done-report') html = Views.doneReport(doneReportState());
      else if (r.name === 'taiga') {
        if (!state.taigaFresh && !state.taigaLoading) loadTaiga();
        html = Views.taigaRegister(taigaState());
      }
      else if (r.name === 'help') html = Views.help(state);
      else html = Views.monitor(state);
      if (state.tourStep !== null) html += Views.tour(state.tourStep);
      main.innerHTML = html;
      if (r.name === 'monitor' && !state.introPlayed) playIntro(main);
    }

    /**
     * The one orchestrated entrance (first Monitor view of a page load): hero rises, pipeline grows,
     * headline numbers count up. Skipped for reduced motion and for automated browsers (tests read numbers).
     */
    function playIntro(main) {
      state.introPlayed = true;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced || navigator.webdriver) return;
      main.classList.add('intro');
      setTimeout(function () { main.classList.remove('intro'); }, 2200);
      var els = main.querySelectorAll('.hero .stat .value');
      var targets = Array.prototype.map.call(els, function (el) { return Number(el.textContent.replace(/[^\d]/g, '')) || 0; });
      var start = null;
      var DURATION = 1100;
      function frame(t) {
        if (start === null) start = t;
        var p = Math.min(1, (t - start) / DURATION);
        var eased = 1 - Math.pow(1 - p, 3);
        els.forEach(function (el, i) {
          if (el.isConnected) el.textContent = Math.round(targets[i] * eased).toLocaleString('th-TH');
        });
        if (p < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // Pages visited in this session, for the in-app "← กลับ" button (the browser back button also works).
    var navStack = [];
    var scrollMemo = {}; // where each page was scrolled to, so "back" lands on the same spot
    var pendingBack = false;

    function go(hash, opts) {
      if (hash !== currentHash) scrollMemo[currentHash] = window.scrollY;
      if (hash !== currentHash && !(opts && opts.back)) navStack.push(currentHash);
      if (gasHistory) {
        if (hash !== currentHash) gasHistory.push(null, null, hash.slice(1));
        return showRoute(hash);
      }
      if (location.hash === hash) render();
      else location.hash = hash; // hashchange → showRoute
    }

    /** Where "กลับ" goes when the page was opened directly (no history in this session). */
    function parentOf(r) {
      if (r.name === 'items') return '#/taiga';
      return '#/monitor';
    }

    function back() {
      var target = navStack.pop() || parentOf(route());
      if (target === '#/monitor') state.drill = null; // leaving a drill-down for its source
      pendingBack = true;
      go(target, { back: true });
    }

    /** Keep navStack in step when the browser's own back/forward is used. */
    function onExternalNav(hash) {
      if (navStack.length && navStack[navStack.length - 1] === hash) navStack.pop();
      showRoute(hash);
    }

    function resetForm() {
      state.formErrors = state.formWarnings = state.formDraft = state.formAlert = null;
    }

    if (gasHistory) {
      gasHistory.setChangeHandler(function (e) {
        onExternalNav('#' + ((e && e.location && e.location.hash) || '/monitor'));
      });
      if (google.script.url) {
        google.script.url.getLocation(function (loc) {
          if (loc && loc.hash) showRoute('#' + loc.hash); // deep link like …/exec#/kanban
        });
      }
    } else {
      window.addEventListener('hashchange', function () {
        if (location.hash !== currentHash) onExternalNav(location.hash);
      });
    }

    // In-app links ("#/…") never leave the iframe: route them through go().
    document.addEventListener('click', function (ev) {
      var a = ev.target.closest && ev.target.closest('a[href^="#/"]');
      if (!a || ev.defaultPrevented || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
      ev.preventDefault();
      go(a.getAttribute('href'));
    });

    // ------------------------------------------------------------------ form helpers

    function todaySheet() {
      return D.formatDate(state.today);
    }

    /** Read the form into sheet-format strings; unchanged-but-different-looking values keep the original. */
    function collect(form, original) {
      var out = {};
      D.COLUMNS.forEach(function (c) {
        if (c.key === 'seq') return;
        var el = form.elements[c.key];
        if (!el) return;
        var v = el.value.trim();
        var orig = original ? original[c.key] || '' : '';
        // same PMs in a different order or spacing is not a change
        if (c.key === 'pm' && orig && D.joinPm(D.splitPm(v), state.options.pm) === D.joinPm(D.splitPm(orig), state.options.pm)) v = orig;
        if (c.type === 'date') {
          var origCell = D.parseDate(orig);
          var typed = D.parseDate(v);
          if (!v) v = origCell.issue ? orig : ''; // untouched unparseable value stays as-is
          else if (typed.date && !typed.issue) {
            // same date written differently (05/01 vs 5/1) is not a change; otherwise normalize to d/m/yyyy
            v = origCell.date && !origCell.issue && D.compareDate(origCell.date, typed.date) === 0 ? orig : D.formatDate(typed.date);
          } // invalid text is kept so validation can point at it
        }
        out[c.key] = v;
      });
      return out;
    }

    /**
     * Show a failed save once. In a form the details go next to the fields / in the banner;
     * for quick actions (My Work, Kanban) there is no form, so one toast carries the details.
     */
    function failMessage(res, inForm) {
      var fields = (res.details && res.details.fields) || {};
      if (!inForm) {
        var why = Object.keys(fields).map(function (k) { return fields[k]; }).filter(Boolean);
        return UI.toast(res.message + (why.length ? ': ' + why.join(', ') : ''), 'error');
      }
      if (res.code === 'VALIDATION') {
        state.formErrors = fields;
        return UI.toast(res.message, 'error');
      }
      var reload = res.code === 'CONFLICT' || res.code === 'SEQ_MISMATCH' || res.code === 'NOT_FOUND';
      state.formAlert = { message: res.message, reload: reload };
      if (res.code === 'CONFLICT' && res.details) {
        state.formAlert.message += ' (ช่องที่ถูกแก้: ' + Object.keys(res.details).map(function (k) {
          return D.COLUMN_BY_KEY[k] ? D.COLUMN_BY_KEY[k].header + ' = "' + res.details[k].actual + '"' : k;
        }).join(', ') + ')';
      }
    }

    function submitForm(form) {
      var mode = form.getAttribute('data-mode');
      var r = route();
      var row = mode === 'edit' ? state.byId[r.id] : null;
      var values = collect(form, row ? row.raw : null);
      state.formDraft = values;
      state.formAlert = null;
      var btn = document.getElementById('save-btn');
      if (mode === 'new') {
        var v = D.validateCreate(values, state.options);
        state.formErrors = v.errors;
        state.formWarnings = v.warnings;
        if (!v.ok) {
          render();
          return focusFirstError();
        }
        btn.disabled = true;
        btn.textContent = 'กำลังบันทึก…';
        return api('Api_createRequest', values).then(function (res) {
          if (!res.ok) {
            failMessage(res, true);
            return render();
          }
          UI.toast('บันทึกรายการใหม่แล้ว ลำดับที่ ' + res.data.seq);
          resetForm();
          return load().then(function () { go('#/items/' + res.data.seq); });
        });
      }
      var changes = D.diffChanges(row.raw, values);
      if (!Object.keys(changes).length) return UI.toast('ยังไม่มีช่องไหนเปลี่ยน');
      var vu = D.validateUpdate(changes, row.raw, state.options);
      state.formErrors = vu.errors;
      state.formWarnings = vu.warnings;
      if (!vu.ok) {
        render();
        return focusFirstError();
      }
      // after saving, go back to the page the item was opened from (user request 2026-11-11)
      return saveChanges(row, changes, btn).then(function (ok) {
        if (ok && route().name === 'items' && route().id === r.id) back();
      });
    }

    /** @param {boolean} [inForm] failures shown on the item form (default: when a button is given) */
    function saveChanges(row, changes, btn, inForm) {
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'กำลังบันทึก…';
      }
      return api('Api_updateRequest', { rowNumber: row.rowNumber, seq: row.seq, changes: changes }).then(function (res) {
        if (!res.ok) {
          failMessage(res, inForm === undefined ? !!btn : inForm);
          render();
          return false;
        }
        UI.toast('บันทึกการแก้ไขแล้ว (' + res.data.written.map(function (k) { return D.COLUMN_BY_KEY[k].header; }).join(', ') + ')');
        resetForm();
        return load().then(function () { return true; });
      });
    }

    /** Change one item's status (My Work quick action and Kanban); same safe-write path as the form. */
    function loadDeleted() {

    function moveStatus(id, to) {
      var row = state.byId[id];
      if (!row || row.status === to) return;
      if (!state.user.canEdit) return UI.toast('บัญชีนี้มีสิทธิ์ดูอย่างเดียว', 'error');
      var changes = { status: { from: row.raw.status, to: to } };
      if (to === D.DONE && !row.doneDate.date) changes.doneDate = { from: row.raw.doneDate, to: todaySheet() };
      return saveChanges(row, changes, null);
    }

    // ------------------------------------------------------------------ calendar popover (date fields)

    function drawCalendar() {
      document.querySelectorAll('.cal').forEach(function (c) { c.remove(); });

      if (!input) return (cal = null);
      var typed = D.parseDate(input.value);

      var pick = host.querySelector('.cal [aria-pressed="true"]') || host.querySelector('.cal .today') || host.querySelector('.cal .cal-day');
      if (pick) pick.focus();

    // ------------------------------------------------------------------ Taiga register (2026-11-20)

    function renderTaiga() {
      var active = document.activeElement;
      var focusId = active && active.id;
      var typed = document.getElementById('q');
      if (typed) state.itemsQuery = typed.value;
      var pos = active && active.tagName === 'INPUT' ? active.selectionStart : null;
      render();

    // the status map stays open or closed through every re-render, also a data reload ("toggle" does not bubble)
    document.addEventListener('toggle', function (ev) {

    // Taiga statuses (2026-11-24): read from the bot's log when the register opens; the app never writes that log.
    function loadTaiga() {
      state.taigaLoading = true;

      api('Api_taiga').then(function (res) {

        state.taiga = res.ok ? res.data : { available: false, error: res.message, latest: {}, statuses: [], map: {} };

    }
    function saveTaigaMap(name, app) {

        } else UI.toast(res.message, 'error');

    function saveStatusTaiga(app, name) {

        if (res.ok) {
          state.taiga.appMap = state.taiga.appMap || {};
          if (name) state.taiga.appMap[app] = name;
          else delete state.taiga.appMap[app];
          UI.toast(name ? 'จับคู่ "' + D.statusLabel(app) + '" กับ Taiga "' + name + '" แล้ว' : 'ยกเลิกการจับคู่ "' + D.statusLabel(app) + '" แล้ว');
        } else UI.toast(res.message, 'error');

    /** A person confirms every status change; the save uses the same guarded path as Kanban. */
    function applyTaiga(id) {
      var row = state.byId[id];
      var c = row && Views.tgCompare(state, row);
      if (!c || !c.canApply) return;
      var close = !D.isOpen(c.expected) ? ' การปรับครั้งนี้จะปิดงาน' + (c.expected === D.DONE && !row.doneDate.date ? 'และใส่วันที่เสร็จเป็นวันนี้' : '') : '';
      var skips = Views.tgReview(state, row) && D.DEV_STEPS.indexOf(c.expected) !== -1 ? ' ⚠ PM ยังไม่ตรวจผ่าน Taiga ของรายการนี้ การปรับจะข้ามขั้นตอนนี้' : '';
      UI.confirm('ปรับสถานะรายการ #' + row.seq + ' ตาม Taiga?',
        'Taiga: "' + c.taiga.status + '" · สถานะจะเปลี่ยนจาก "' + (row.status ? D.statusLabel(row.status) : 'ว่าง') + '" เป็น "' + D.statusLabel(c.expected) + '"' + close + skips,
        'ปรับสถานะ').then(function (yes) { if (yes) moveStatus(id, c.expected); });
    }
    var TG_USER_KEY = 'ehp.taigaUser.v1';
    /** Log in to Taiga with the person's own account; resolves true once logged in, false when cancelled. */
    function taigaLogin(host) {
      return new Promise(function (resolve) {
        var dlg = document.getElementById('dialog');
        var done = false;
        var kept = store(TG_USER_KEY); // username only; false = the person asked not to keep it
        dlg.className = '';
        dlg.innerHTML = '<form id="tg-login" method="post"><h2>เข้าสู่ระบบ Taiga</h2>' +
          '<p class="muted">ใช้บัญชี Taiga ของคุณเอง รหัสผ่านส่งตรงไปที่ ' + UI.esc(host) + ' แอปไม่เก็บรหัสผ่าน และจำการเข้าสู่ระบบเฉพาะแท็บนี้</p>' +
          '<div class="field"><label for="tg-user">ชื่อผู้ใช้ Taiga</label><input id="tg-user" name="username" type="text" autocomplete="username" value="' + UI.esc(kept || '') + '" required /></div>' +
          '<div class="field"><label for="tg-pass">รหัสผ่าน Taiga</label><input id="tg-pass" name="password" type="password" autocomplete="current-password" required /></div>' +
          '<label class="tg-keep"><input type="checkbox" name="keep"' + (kept === false ? '' : ' checked') + ' /> จำชื่อผู้ใช้ในเครื่องนี้</label>' +
          '<p class="err" role="alert" id="tg-login-err"></p>' +
          '<div class="dialog-actions"><button type="button" class="btn" id="tg-login-no">ยกเลิก</button><button type="submit" class="btn primary">เข้าสู่ระบบ</button></div></form>';
        var form = document.getElementById('tg-login');
        document.getElementById('tg-login-no').addEventListener('click', function () { dlg.close(); });
        form.addEventListener('submit', function (ev) {
          ev.preventDefault();
          ev.stopPropagation();
          var btn = form.querySelector('[type="submit"]');
          btn.disabled = true;
          var user = form.elements.username.value.trim();
          TaigaApi.login(host, user, form.elements.password.value).then(function () {
            store(TG_USER_KEY, form.elements.keep.checked ? user : false);
            done = true;
            dlg.close();
          }, function (e) {
            btn.disabled = false;
            document.getElementById('tg-login-err').textContent = e.message;
            form.elements.password.value = '';
            form.elements.password.focus();
          });
        });
        dlg.addEventListener('close', function onClose() {
          dlg.removeEventListener('close', onClose);
          dlg.innerHTML = '';
          // closed while Taiga was still answering: the person cancelled
          if (!done) TaigaApi.logout();
          resolve(done);
        });
        dlg.showModal();
        if (kept) form.elements.password.focus();
      });
    }

    var tgPushing = false;
    /** "ปรับ Taiga ตามชีต": a person confirms every item; Taiga's version check stops overwriting newer changes. */
    function pushTaiga(id) {
      var row = state.byId[id];
      var c = row && Views.tgCompare(state, row);
      if (!c || !c.pushTo || tgPushing) return;
      var host = state.taiga.host;
      var key = D.taigaKey(D.taigaLink(row));
      if (!key || key.split('/')[0] !== host) return;
      var seen = c.taiga.status;
      var cancelled = { code: 'CANCELLED' };
      tgPushing = true;
      function needLogin() {
        if (TaigaApi.loggedIn(host)) return Promise.resolve();
        return taigaLogin(host).then(function (yes) { if (!yes) throw cancelled; });
      }
      function settle(status) {
        // the register shows it at once; the bot's log catches up later
        state.taiga.latest[key] = { status: status, from: item.status, by: TaigaApi.name(), at: Date.now(), deleted: false };
      }
      var item, target;
      needLogin().then(function () {
        return TaigaApi.load(key).catch(function (e) {
          if (e.code !== 'AUTH') throw e;
          TaigaApi.logout(); // expired: log in once more
          return needLogin().then(function () { return TaigaApi.load(key); });
        });
      }).then(function (res) {
        item = res;
        if (D.taigaName(item.status) === D.taigaName(c.pushTo)) {
          state.taiga.latest[key] = Object.assign({}, c.taiga, { status: item.status });
          throw { code: 'SAME', message: 'Taiga อยู่ที่ "' + item.status + '" อยู่แล้ว' };
        }
        target = item.statuses.filter(function (s) { return D.taigaName(s.name) === D.taigaName(c.pushTo); })[0];
        if (!target) throw { code: 'NO_STATUS', message: 'โปรเจกต์นี้ใน Taiga ไม่มีสถานะ "' + c.pushTo + '" ตรวจการจับคู่สถานะอีกครั้ง' };
        return UI.confirm('ปรับ Taiga รายการ #' + row.seq + ' ตามสถานะในชีต?',
          'ชีต: "' + D.statusLabel(row.status) + '" · Taiga จะเปลี่ยนจาก "' + item.status + '" เป็น "' + target.name + '" ในชื่อ ' + TaigaApi.name() +
          (D.taigaName(item.status) !== D.taigaName(seen) ? ' ⚠ Taiga เปลี่ยนจากที่แสดงในทะเบียน ("' + seen + '") แล้ว' : '') +
          (target.is_closed ? ' สถานะนี้ปิดงานใน Taiga' : ''), 'ส่งไป Taiga');
      }).then(function (yes) {
        if (!yes) throw cancelled;
        return api('Api_taigaPushCheck', { rowNumber: row.rowNumber, seq: row.seq, status: row.raw.status });
      }).then(function (res) {
        if (!res.ok) throw res;
        return TaigaApi.saveStatus(item, target.id).catch(function (e) {
          if (e.code === 'AUTH') TaigaApi.logout();
          if (e.code === 'NETWORK') throw { code: e.code, message: 'ไม่แน่ใจว่า Taiga ได้รับหรือไม่ กรุณาเปิดดูใน Taiga' };
          throw e;
        });
      }).then(function () {
        settle(target.name);
        return api('Api_logTaigaPush', { rowNumber: row.rowNumber, seq: row.seq, from: item.status, to: target.name });
      }).then(function (res) {
        if (res.ok) UI.toast('ปรับ Taiga รายการ #' + row.seq + ' เป็น "' + target.name + '" แล้ว');
        else UI.toast('ปรับ Taiga แล้ว แต่บันทึกประวัติในแอปไม่สำเร็จ', 'error');
      }).catch(function (e) {
        if (e.code === 'CANCELLED') return;
        UI.toast(e.message || 'ส่งไป Taiga ไม่สำเร็จ', e.code === 'SAME' ? undefined : 'error');
      }).then(function () {
        tgPushing = false;
        if (route().name === 'taiga') renderTaiga();
      });
    }
    function exportTaiga() {
      var rep = Views.tgReport(state);

      var a = document.createElement('a');

    // ------------------------------------------------------------------ text report export

    var REPORT_KEY = 'ehp.report.since.v1';
    var exportOpts = null;

    function reportRows() {
      // several PMs can be picked (2026-11-11); none = everyone
      return D.applyFilters(state.rows, { pm: D.splitPm(exportOpts.pm) });
    }
    function reportText() {
      return D.buildReport(reportRows(), state.today, { sinceSeq: exportOpts.since, pm: exportOpts.pm });
    }
    function openExport() {
      var saved = store(REPORT_KEY);
      // a PM-team filter opens the report with that team's PMs ticked
      exportOpts = { pm: D.joinPm(D.pmFilter(state.filters.pm, state.options.pm || []), state.options.pm), since: typeof saved === 'number' ? saved : null };
      var dlg = document.getElementById('dialog');
      dlg.className = 'export-dialog';
      dlg.innerHTML = '<form id="export-form" method="dialog">' + Views.exportDialog(state, exportOpts, reportText()) + '</form>';
      dlg.showModal();
    }
    function refreshExport() {
      var form = document.getElementById('export-form');
      var sinceRaw = form.elements['rep-since'].value.trim();
      var picked = Array.prototype.slice.call(form.querySelectorAll('input[name="rep-pm-pick"]:checked')).map(function (x) { return x.value; });
      exportOpts.pm = D.joinPm(picked, state.options.pm);
      form.elements['rep-pm'].value = exportOpts.pm;
      exportOpts.since = /^\d+$/.test(sinceRaw) ? Number(sinceRaw) : null;
      document.getElementById('rep-text').value = reportText();
    }
    /** Next report's "new items" start after the highest ลำดับ in this one. */
    function rememberReportBaseline() {
      store(REPORT_KEY, D.nextSeq(state.rows) - 1);
    }

    function focusFirstError() {
      var el = document.querySelector('[aria-invalid="true"]');
      if (el) el.focus();
    }

    // ------------------------------------------------------------------ tour

    function startTour() {
      state.tourStep = 0;
      render();
    }
    function endTour() {
      state.tourStep = null;
      store(KEYS.tour, true);
      render();
    }

    // ------------------------------------------------------------------ events

    var actions = {
      reload: function () { load(); },
      'reload-item': function () { resetForm(); load(); },
      drill: function (el) {
        state.drill = state.drills[el.getAttribute('data-drill')];
        state.itemsPage = 0;
        state.itemsQuery = '';
        if (state.tg) Object.assign(state.tg, { review: false }); // the list must match the number that was clicked
        go('#/taiga');
      },
      'clear-drill': function () { state.drill = null; state.itemsPage = 0; render(); },
      'clear-filters': function () {
        state.filters = Object.assign({}, EMPTY_FILTERS);
        store(KEYS.filters, state.filters);
        render();
      },
      'items-state': function (el) { state.itemsState = el.getAttribute('data-value'); state.itemsPage = 0; render(); },
      sort: function (el) {
        var k = el.getAttribute('data-key');
        state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : 1 };
        render();
      },
      page: function (el) { state.itemsPage += Number(el.getAttribute('data-dir')); render(); window.scrollTo(0, 0); },
      'open-item': function (el, ev) {
        if (ev.target.closest('a')) return;
        go('#/items/' + encodeURIComponent(el.getAttribute('data-id')));
      },
      'delete-item': function (el) {
        var row = state.byId[route().id];
        if (!row) return;
        UI.confirm('ลบรายการ #' + row.seq + '?', 'ระบบจะลบแถวนี้ออกจากชีต "' + D.clean(row.detail).slice(0, 60) + '" สำเนาข้อมูลทั้งแถวจะเก็บไว้ในชีต _app_log เผื่อต้องกู้คืน', 'ลบรายการ', true).then(function (yes) {
          if (!yes) return;
          el.disabled = true;
          // the server re-checks ลำดับ and every column against what this screen shows, under the lock
          api('Api_deleteRequest', { rowNumber: row.rowNumber, seq: row.seq, snapshot: row.raw }).then(function (res) {
            if (!res.ok) {
              el.disabled = false;
              return failMessage(res, true), render();
            }
            UI.toast('ลบรายการ #' + row.seq + ' แล้ว');
            resetForm();
            back(); // the page the item was opened from (or the list)
            load();
          });
        });
      },
      tab: function (el) { state.myTab = el.getAttribute('data-tab'); store(KEYS.tab, state.myTab); render(); },
      'change-name': function () { state.choosingName = true; render(); },
      'pick-name': function (el) { setMyName(el.getAttribute('data-name')); },
      'mw-filter': function (el) { setMwFilter(el.getAttribute('data-key'), el.getAttribute('data-value')); },
      'mw-clear': function () { state.mwFilter = {}; store('ehp.mwfilter.v1', {}); render(); },
      'quick-status': function (el) {
        el.disabled = true;
        el.textContent = 'กำลังบันทึก…';
        moveStatus(el.getAttribute('data-id'), el.getAttribute('data-to'));
      },
      kmove: function (el) {
        el.disabled = true;
        moveStatus(el.getAttribute('data-id'), el.getAttribute('data-to'));
      },
      'cal-open': function (el) {
        var id = el.getAttribute('data-target');
        if (cal && cal.target === id) return closeCalendar();
        var typed = D.parseDate(document.getElementById(id).value);
        var base = typed.date && !typed.issue ? typed.date : state.today;
        cal = { target: id, y: base.y, m: base.m, opener: el };
        drawCalendar();
      },
      'cal-nav': function (el) {
        var n = cal.m + Number(el.getAttribute('data-dir'));
        cal.y += n < 1 ? -1 : n > 12 ? 1 : 0;
        cal.m = ((n + 11) % 12) + 1;
        drawCalendar();
      },
      'cal-pick': function (el) {
        var input = document.getElementById(cal.target);
        input.value = el.getAttribute('data-date');
        input.dispatchEvent(new Event('change', { bubbles: true }));
        closeCalendar();
        input.focus();
      },
      'cal-close': function () {
        closeCalendar();
      },
      back: back,
      'as-status': function (el) {
        var s = el.getAttribute('data-status');
        var i = state.asHidden.indexOf(s);
        if (i === -1) state.asHidden.push(s);
        else state.asHidden.splice(i, 1);
        store('ehp.ashidden.v1', state.asHidden);
        render();
      },
      'as-status-all': function () {
        state.asHidden = [];
        store('ehp.ashidden.v1', state.asHidden);
        render();
      },
      'as-fill': function (el) {
        var input = (lastAssignInput && document.contains(lastAssignInput) && lastAssignInput) || document.querySelector('.as-row input[name="developer"]');
        if (!input) return;
        input.value = el.getAttribute('data-name');
        input.focus();
      },
      'cols-toggle': function () { state.colsOpen = !state.colsOpen; render(); },
      'cols-move': function (el) {
        var key = el.getAttribute('data-key');
        moveCol(key, state.itemCols().indexOf(key) + Number(el.getAttribute('data-dir')));
        var again = document.querySelector('.cols-move[data-key="' + key + '"][data-dir="' + el.getAttribute('data-dir') + '"]');
        if (again && !again.disabled) again.focus();
      },
      'cols-reset': function () { saveCols(Views.ITEM_COLS_DEFAULT.slice()); },
      kjump: function (el) {
        var col = document.querySelector('.kcol[data-status="' + el.getAttribute('data-status').replace(/"/g, '\\"') + '"]');
        if (col) col.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
      },
      kscroll: function (el) {
        var board = document.querySelector('.board');
        if (board) board.scrollBy({ left: Number(el.getAttribute('data-dir')) * Math.max(300, board.clientWidth * 0.8), behavior: 'smooth' });
      },
      kcollapse: function (el) {
        var key = el.getAttribute('data-status');
        if (state.kanbanCollapsed[key]) delete state.kanbanCollapsed[key];
        else state.kanbanCollapsed[key] = true;
        store('ehp.kcollapsed.v1', state.kanbanCollapsed);
        render();
      },
      'kcollapse-all': function () {
        state.kanbanCollapsed = {};
        store('ehp.kcollapsed.v1', state.kanbanCollapsed);
        render();
      },
      'kshow-empty': function () {
        state.kanbanShowEmpty = !state.kanbanShowEmpty;
        store('ehp.kshowempty.v1', state.kanbanShowEmpty);
        render();
      },
      'request-access': function (el) {
        el.disabled = true;
        api('Api_requestAccess', { name: state.myName() }).then(function (res) {
          if (!res.ok) return UI.toast(res.message, 'error');
          state.user.editReason = res.data.status === 'อนุญาต' ? 'OK' : 'PENDING';
          UI.toast(res.data.status === 'อนุญาต' ? 'คุณมีสิทธิ์อยู่แล้ว กดโหลดข้อมูลใหม่' : 'ส่งคำขอแล้ว รอผู้ดูแลอนุมัติ');
          render();
        });
      },
      'reload-access': function () { state.access = null; render(); },
      'history-load': function (el, ev) {
        var seq = Number(el.getAttribute('data-seq'));
        if (state.history && state.history.seq === seq && !state.history.error) return; // <details> toggles itself
        if (ev) ev.preventDefault();
        state.history = { seq: seq, loading: true };
        render();
        api('Api_itemHistory', seq).then(function (res) {
          state.history = res.ok ? { seq: seq, list: res.data } : { seq: seq, error: res.message };
          if (route().name === 'items') render();
        });
      },
      'deleted-load': loadDeleted,
      restore: function (el) {
        var seq = el.getAttribute('data-seq');
        UI.confirm('กู้คืนรายการ #' + seq + '?', 'รายการจะกลับไปท้ายชีตด้วยเลขลำดับเดิม และบันทึกใน _app_log', 'กู้คืน', false).then(function (yes) {
          if (!yes) return;
          el.disabled = true;
          api('Api_restoreRequest', Number(el.getAttribute('data-log'))).then(function (res) {
            if (!res.ok) UI.toast(res.message, 'error');
            else UI.toast('กู้คืนรายการ #' + res.data.seq + ' แล้ว');
            load().then(loadDeleted);
          });
        });
      },
      'digest-now': function (el) {
        el.disabled = true;
        api('Api_queueDigestNow').then(function (res) {
          el.disabled = false;
          if (!res.ok) return UI.toast(res.message, 'error');
          UI.toast('เตรียมสรุปไว้ ' + res.data.added + ' ข้อความ แมวส้มจะส่งในรอบถัดไป (ไม่เกิน 15 นาที)');
        });
      },
      'repair-chips': function (el) {
        el.disabled = true;
        el.textContent = 'กำลังซ่อม…';
        api('Api_repairChips').then(function (res) {
          if (!res.ok) UI.toast(res.message, 'error');
          else UI.toast('ซ่อมแล้ว ' + res.data.repaired + ' ช่อง และใส่สี/dropdown ให้ ' + (res.data.rows || 0) + ' แถว (ข้าม ' + res.data.skipped + ' ช่องที่มีคนแก้ต่อแล้ว)');
          render();
        });
      },
      'share-all': function (el) {
        el.disabled = true;
        api('Api_shareAll').then(function (res) {
          el.disabled = false;
          if (!res.ok) return UI.toast(res.message, 'error');
          var d = res.data;
          var msg = 'แชร์เพิ่ม ' + d.added + ' คน (มีสิทธิ์อยู่แล้ว ' + d.already + ' คน)';
          if (d.failed.length) UI.toast(msg + ' แชร์ไม่สำเร็จ: ' + d.failed.join(', '), 'error');
          else UI.toast(msg);
        });
      },
      'access-set': function (el) {
        var input = { email: el.getAttribute('data-email') };
        input[el.getAttribute('data-field')] = el.getAttribute('data-value');
        el.disabled = true;
        saveAccess(input);
      },
      'dr-export': exportDoneReport,
      'tg-export': exportTaiga,
      'tg-review': function () { state.tg.review = !state.tg.review; state.itemsPage = 0; renderTaiga(); },
      'tg-kind': function (el) { setTgKind(el.getAttribute('data-value')); },
      'tg-apply': function (el) { applyTaiga(el.getAttribute('data-id')); },
      'tg-push': function (el) { pushTaiga(el.getAttribute('data-id')); },
      'tg-logout': function () { TaigaApi.logout(); renderTaiga(); },
      'pick-skin': function (el) {
        var id = applySkin(el.getAttribute('data-skin'));
        store(SKIN_KEY, id);
        var again = document.querySelector('#skin-pick [data-skin="' + id + '"]');
        if (again) again.focus();
      },
      'export-open': openExport,
      'export-close': function () { document.getElementById('dialog').close(); },
      'export-copy': function () {
        var ta = document.getElementById('rep-text');
        ta.focus();
        ta.select();
        var done = function () { rememberReportBaseline(); UI.toast('คัดลอกข้อความแล้ว วางใน LINE หรืออีเมลได้เลย'); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ta.value).then(done, function () {
            UI.toast('คัดลอกอัตโนมัติไม่ได้ ข้อความถูกเลือกไว้แล้ว กด Ctrl+C (มือถือ: กดค้างแล้วเลือกคัดลอก)', 'error');
          });
        } else {
          UI.toast('ข้อความถูกเลือกไว้แล้ว กด Ctrl+C เพื่อคัดลอก');
        }
      },
      'export-download': function () {
        var text = document.getElementById('rep-text').value;
        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'สรุปรายการขอแก้ไข-' + D.formatDate(state.today).split('/').join('-') + '.txt';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        rememberReportBaseline();
      },
      'mw-week': function (el, ev) {
        if (ev) ev.preventDefault();
        state.weekOffset = Number(el.getAttribute('data-week')) || 0;
        render();
        var t = document.getElementById('mw-plan');
        if (t && el.classList.contains('mw-tile')) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        var again = document.querySelector('[data-action="mw-week"][aria-label="' + (el.getAttribute('aria-label') || '') + '"]');
        if (again) again.focus();
      },
      'mw-jump': function (el, ev) {
        ev.preventDefault();
        var t = document.getElementById(el.getAttribute('data-target'));
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },
      'tour-start': startTour,
      'tour-next': function () {
        if (state.tourStep >= Views.TOUR_STEPS - 1) return endTour();
        state.tourStep++;
        render();
      },
      'tour-skip': endTour,
    };

    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-action]');
      if (!el || !actions[el.getAttribute('data-action')]) return;
      if (el.tagName === 'A') ev.preventDefault();
      actions[el.getAttribute('data-action')](el, ev);
    });

    document.addEventListener('change', function (ev) {
      var form = ev.target.form;
      if (ev.target.id === 'mw-who') return setMyName(ev.target.value);
      if (ev.target.classList && ev.target.classList.contains('access-name')) {
        return saveAccess({ email: ev.target.getAttribute('data-email'), name: ev.target.value });
      }
      if (ev.target.classList && ev.target.classList.contains('tg-map-select')) return saveTaigaMap(ev.target.getAttribute('data-taiga'), ev.target.value);
      if (ev.target.classList && ev.target.classList.contains('tg-app-select')) return saveStatusTaiga(ev.target.getAttribute('data-app'), ev.target.value);
      if (ev.target.classList && ev.target.classList.contains('access-select')) {
        var input = { email: ev.target.getAttribute('data-email') };
        input[ev.target.getAttribute('data-field')] = ev.target.value;
        return saveAccess(input);
      }
      if (form && form.id === 'export-form') return refreshExport();
      if (form && form.id === 'dr-form') return readDoneReportForm(form);
      if (ev.target.id === 'f-tg-sync') {
        state.tg.sync = ev.target.value; // not remembered: a hidden filter would look like missing items
        state.itemsPage = 0;
        return renderTaiga();
      }
      if (form && form.id === 'filters') {
        ['platform', 'pm', 'developer', 'urgency', 'from', 'to'].forEach(function (k) { state.filters[k] = form.elements[k].value; });
        store(KEYS.filters, state.filters);
        state.itemsPage = 0;
        render();
      } else if (form && ev.target.name === 'pm-pick') {
        // keep the hidden "A, B" value in sync with the checked PMs (in PM-list order)
        var picked = Array.prototype.slice.call(form.querySelectorAll('input[name="pm-pick"]:checked')).map(function (x) { return x.value; });
        form.elements.pm.value = D.joinPm(picked, state.options.pm);
      } else if (form && form.id === 'item-form' && ev.target.name === 'status' && ev.target.value === D.DONE) {
        var done = form.elements.doneDate;
        if (done && !done.value) {
          done.value = todaySheet();
          UI.toast('ใส่วันที่เสร็จเป็นวันนี้ให้แล้ว แก้ได้ถ้าไม่ใช่');
        }
      }
    });

    var searchTimer = null;
    document.addEventListener('input', function (ev) {
      if (ev.target.id === 'mw-q') {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
          var pos = ev.target.selectionStart;
          setMwFilter('q', ev.target.value);
          var q = document.getElementById('mw-q');
          q.focus();
          q.setSelectionRange(pos, pos);
        }, 150);
        return;
      }
      if (ev.target.id !== 'q') return;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        if (!ev.target.isConnected) return; // left the page, or re-rendered with the typed text kept
        state.itemsQuery = ev.target.value;
        state.itemsPage = 0;
        var pos = ev.target.selectionStart;
        render();
        var q = document.getElementById('q');
        q.focus();
        q.setSelectionRange(pos, pos);
      }, 150);
    });

    var lastAssignInput = null;
    document.addEventListener('focusin', function (ev) {
      if (ev.target.matches && ev.target.matches('.as-row input[name="developer"]')) lastAssignInput = ev.target;
    });

    document.addEventListener('submit', function (ev) {
      var form = ev.target;
      if (form.classList && form.classList.contains('qs-form')) {
        ev.preventDefault();
        var qsRow = state.byId[form.getAttribute('data-id')];
        var to = form.elements.to.value;
        if (!qsRow) return;
        if (to === qsRow.status) return UI.toast('สถานะนี้เป็นสถานะปัจจุบันอยู่แล้ว');
        var qsBtn = form.querySelector('button[type="submit"]');
        qsBtn.disabled = true;
        qsBtn.textContent = 'กำลังบันทึก…';
        moveStatus(qsRow.id, to); // same safe path: lock, ลำดับ + conflict check, done date for แก้ไขเรียบร้อย
        return;
      }
      if (form.classList && form.classList.contains('as-row')) {
        ev.preventDefault();
        var row = state.byId[form.getAttribute('data-id')];
        var name = D.clean(form.elements.developer.value);
        if (!row || !name) return UI.toast('กรุณาพิมพ์หรือเลือกชื่อนักพัฒนา', 'error');
        // same safe update path as the form: lock, ลำดับ + conflict check, changed cell only, logged
        // the assign page has no form alert area, so failures go to a toast (inForm=false)
        saveChanges(row, { developer: { from: row.raw.developer, to: name } }, form.querySelector('button[type="submit"]'), false).then(function (ok) {
          if (!ok) {
            var again = document.querySelector('.as-row[data-id="' + row.id + '"] input[name="developer"]');
            if (again) again.value = name; // render() rebuilt the row; keep what was typed
            return;
          }
          UI.toast('มอบหมาย #' + row.seq + ' ให้ ' + name + ' แล้ว');
          var next = document.querySelector('.as-row input[name="developer"]');
          if (next) next.focus();
        });
      } else if (form.id === 'item-form') {
        ev.preventDefault();
        submitForm(form);
      } else if (form.id === 'access-add') {
        ev.preventDefault();
        var email = form.elements['acc-email'].value.trim();
        if (!email) return UI.toast('กรุณากรอกอีเมล', 'error');
        saveAccess({ email: email, name: form.elements['acc-name'].value, role: form.elements['acc-role'].value, status: state.access.states.allowed });
      } else if (form.id === 'export-form') {
        ev.preventDefault();
      }
    });

    // Items table: drag a column header onto another to move it ("จัดคอลัมน์" is the keyboard/touch alternative)
    var dragCol = null;
    document.addEventListener('dragstart', function (ev) {
      var th = ev.target.closest && ev.target.closest('th[data-col]');
      if (!th) return;
      dragCol = th.getAttribute('data-col');
      ev.dataTransfer.setData('text/plain', 'col:' + dragCol);
      ev.dataTransfer.effectAllowed = 'move';
    });
    document.addEventListener('dragover', function (ev) {
      if (dragCol && ev.target.closest && ev.target.closest('th[data-col]')) ev.preventDefault();
    });
    document.addEventListener('drop', function (ev) {
      var th = dragCol && ev.target.closest && ev.target.closest('th[data-col]');
      if (!th) return;
      ev.preventDefault();
      moveCol(dragCol, state.itemCols().indexOf(th.getAttribute('data-col')));
      dragCol = null;
    });
    document.addEventListener('dragend', function () { dragCol = null; });

    // Kanban drag & drop (buttons ◀ ▶ are the keyboard/touch alternative)
    document.addEventListener('dragstart', function (ev) {
      var card = ev.target.closest && ev.target.closest('.kcard[draggable="true"]');
      if (!card) return;
      ev.dataTransfer.setData('text/plain', card.getAttribute('data-id'));
      ev.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    document.addEventListener('dragend', function (ev) {
      if (ev.target.classList) ev.target.classList.remove('dragging');
      document.querySelectorAll('.kcol.drop-target').forEach(function (c) { c.classList.remove('drop-target'); });
    });
    document.addEventListener('dragover', function (ev) {
      var col = ev.target.closest && ev.target.closest('.kcol:not(.other)'); // the "other" column is not a drop target
      if (!col) return;
      ev.preventDefault();
      document.querySelectorAll('.kcol.drop-target').forEach(function (c) { if (c !== col) c.classList.remove('drop-target'); });
      col.classList.add('drop-target');
    });
    document.addEventListener('drop', function (ev) {
      var col = ev.target.closest && ev.target.closest('.kcol:not(.other)'); // the "other" column is not a drop target
      if (!col) return;
      ev.preventDefault();
      col.classList.remove('drop-target');
      moveStatus(ev.dataTransfer.getData('text/plain'), col.getAttribute('data-status'));
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && cal) {
        ev.preventDefault();
        return closeCalendar();
      }
      if (ev.key === 'Escape' && state.tourStep !== null) endTour();
      if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr[data-action]')) {
        ev.preventDefault();
        actions['open-item'](ev.target, ev);
      }
    });

    // menu icons (decorative; link text stays the accessible name)
    document.querySelectorAll('.nav a[data-icon]').forEach(function (el) {
      el.insertAdjacentHTML('afterbegin', '<span class="bi">' + UI.icon(el.getAttribute('data-icon')) + '</span>');
    });

    showSnapshot();
    load();
  })();
</script>
