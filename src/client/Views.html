<script>
  /* Views: pure render functions (state → HTML). Business rules come only from Domain (constitution XII). */
  var Views = (function () {
    'use strict';
    var D = Domain;
    var esc = UI.esc;

    // ------------------------------------------------------------------ shared bits

    function filterBar(state) {
      var f = state.filters;
      var o = state.options;
      var devs = [D.UNASSIGNED].concat(o.developer || []);
      var active = ['platform', 'pm', 'developer', 'urgency', 'from', 'to'].filter(function (k) { return f[k]; }).length;
      return (
        '<form class="filters' + (active ? ' is-active' : '') + '" id="filters" aria-label="ตัวกรอง">' +
        '<div class="filters-head"><span class="filters-ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg></span>' +
        '<strong>ตัวกรอง</strong><span class="filters-count">' + (active ? 'ใช้อยู่ ' + active + ' ตัว' : 'แสดงทุกรายการ') + '</span>' +
        (active ? '<button type="button" class="btn small filters-clear" data-action="clear-filters">' + UI.withIcon('clear', 'ล้างตัวกรอง') + '</button>' : '') + '</div>' +
        UI.select({ name: 'platform', label: 'แพลตฟอร์ม', icon: 'platform', options: o.platform, value: f.platform, emptyLabel: 'ทั้งหมด' }) +
        UI.select({ name: 'pm', label: 'PM', icon: 'pm', options: o.pm, value: f.pm, emptyLabel: 'ทั้งหมด' }) +
        UI.select({ name: 'developer', label: 'นักพัฒนา', icon: 'dev', options: devs, value: f.developer, emptyLabel: 'ทั้งหมด' }) +
        UI.select({ name: 'urgency', label: 'ความเร่งด่วน', icon: 'urgency', options: o.urgency, value: f.urgency, emptyLabel: 'ทั้งหมด' }) +
        UI.dateField({ name: 'from', label: 'กำหนดส่งตั้งแต่', icon: 'calendar', value: f.from }) +
        UI.dateField({ name: 'to', label: 'ถึง', icon: 'calendar', value: f.to }) +
        '</form>'
      );
    }

    function filterSummary(state) {
      var f = state.filters;
      var parts = [];
      ['platform', 'pm', 'developer', 'urgency'].forEach(function (k) {
        if (f[k]) parts.push(f[k]);
      });
      var from = D.parseDate(f.from).date;
      var to = D.parseDate(f.to).date;
      if (from || to) parts.push('กำหนดส่ง ' + (from ? D.formatThai(from) : '…') + ' ถึง ' + (to ? D.formatThai(to) : '…'));
      return parts.length ? 'กรองอยู่: ' + parts.join(', ') : 'ทุกรายการในชีต';
    }

    function drillButton(state, title, ids, inner, extraClass) {
      var key = state.registerDrill(title, ids);
      return '<button type="button" class="' + (extraClass || 'linklike') + '" data-action="drill" data-drill="' + key + '" aria-label="' + esc(title + ' ' + ids.length + ' รายการ') + '">' + inner + '</button>';
    }

    function readOnlyBanner(state) {
      if (state.user.canEdit) return '';
      var who = 'บัญชี ' + esc(state.user.email || '');
      if (state.user.editReason === 'PENDING') {
        return '<div class="banner info">' + who + ' ส่งคำขอสิทธิ์แก้ไขแล้ว กำลังรอผู้ดูแลอนุมัติ เมื่ออนุมัติแล้วกด "โหลดข้อมูลใหม่"</div>';
      }
      if (state.user.editReason === 'NOT_ALLOWED') {
        return '<div class="banner warn banner-row"><span>' + who + ' ยังไม่อยู่ในรายชื่อทีมที่แก้ไขได้ จึงดูข้อมูลได้อย่างเดียว</span>' +
          '<button class="btn small primary" data-action="request-access">ขอสิทธิ์แก้ไข</button></div>';
      }
      return '<div class="banner warn">' + who + ' มีสิทธิ์ดูอย่างเดียวในชีต จึงดูข้อมูลได้แต่เพิ่มหรือแก้ไขไม่ได้</div>';
    }

    function schemaBanner(state) {
      if (state.schema.ok) return '';
      return '<div class="banner danger" role="alert">ไม่พบคอลัมน์ในชีต: ' + esc(state.schema.missing.join(', ')) + ' ระบบจึงปิดการเพิ่มและแก้ไขไว้ กรุณาตรวจสอบหัวคอลัมน์ในชีตหลัก</div>';
    }

    // ------------------------------------------------------------------ Monitor (US1)

    function monitor(state) {
      var rows = state.filteredRows();
      var m = D.computeMetrics(rows, state.today);
      var html = schemaBanner(state) + readOnlyBanner(state);

      // Hero: the welcome moment. Q1 + Q5 live here as the four headline numbers.
      html += hero(state, m, rows.length);
      html += filterBar(state);

      if (!rows.length) {
        return html + UI.emptyState('ไม่มีรายการตามตัวกรองนี้', 'ลองล้างตัวกรอง หรือเลือกช่วงวันที่ให้กว้างขึ้น', '<button class="btn" data-action="clear-filters">ล้างตัวกรอง</button>');
      }

      // Q2: pipeline (the signature element)
      html += pipeline(state, m);

      // Q6 (left) + Q3/Q4 (right)
      html += '<div class="grid-2"><div>' + overduePanel(state, m) + '</div><div>' + developerPanel(state, m) + pmPanel(state, m) + qualityPanel(state) + '</div></div>';
      return html;
    }

    function greetingName(state) {
      var name = state.myName();
      if (name) return name;
      var email = (state.user && state.user.email) || '';
      return email ? email.split('@')[0] : '';
    }

    /** One plain sentence that says what matters today. */
    function todaySentence(m) {
      if (!m.openCount) return 'ไม่มีงานค้างเลย เยี่ยมมาก';
      var top = m.byStatus.filter(function (s) { return D.WORKFLOW.indexOf(s.value) !== -1; })
        .sort(function (a, b) { return b.count - a.count; })[0];
      var parts = [];
      parts.push(m.overdueCount ? 'มีงานเกินกำหนด ' + m.overdueCount.toLocaleString('th-TH') + ' งานที่ควรตามก่อน' : 'ยังไม่มีงานเกินกำหนด');
      if (top) parts.push('งานกองอยู่ที่ "' + top.value + '" มากที่สุด');
      return parts.join(' และ');
    }

    function myWorkChip(state) {
      var name = state.myName();
      if (!name) return '<a class="hero-chip" href="#/my-work">เลือกชื่อของคุณ เพื่อดูงานของตัวเอง</a>';
      var dev = D.groupMyWork(state.rows, name, 'developer', state.today);
      var pm = D.groupMyWork(state.rows, name, 'pm', state.today);
      var g = dev.total || !pm.total ? dev : pm;
      if (!g.total) return '<a class="hero-chip" href="#/my-work">ยังไม่มีงานค้างของคุณ</a>';
      return '<a class="hero-chip" href="#/my-work">งานของคุณ <strong>' + g.total + '</strong> งาน' +
        (g.overdue.length ? ', เกินกำหนด <strong class="hot">' + g.overdue.length + '</strong>' : '') +
        (g.today.length ? ', ครบกำหนดวันนี้ <strong>' + g.today.length + '</strong>' : '') + '</a>';
    }

    function hero(state, m, count) {
      var name = greetingName(state);
      return '<section class="hero" aria-labelledby="hero-h">' +
        '<div class="hero-text"><p class="hero-hello">' + (name ? 'สวัสดี คุณ<strong>' + esc(name) + '</strong>' : 'สวัสดี') + '<span class="hero-date">' + esc(D.formatThaiLong(state.today)) + '</span></p>' +
        '<h1 id="hero-h">ภาพรวมงานขอแก้ไขโปรแกรม</h1>' +
        (count ? '<p class="hero-sub">' + esc(todaySentence(m)) + '</p>' : '') +
        '<div class="hero-actions">' +
        (state.user.canEdit && state.schema.ok
          ? '<a class="hero-add" href="#/new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>เพิ่มรายการขอแก้ไข</a>'
          : '') +
        myWorkChip(state) +
        '<button class="btn small export-btn" data-action="export-open">' + UI.withIcon('report', 'สรุปรายงาน (Export)') + '</button>' +
        '<button class="btn small" data-action="reload">' + UI.withIcon('reload', 'โหลดข้อมูลใหม่') + '</button>' +
        '<span class="hero-meta">' + esc(filterSummary(state)) + ', ข้อมูล ณ ' + esc(state.loadedAt) + '</span></div></div>' +
        '<div class="hero-art">' + UI.illustration() + '</div>' +
        (count ? '<div class="hero-stats">' +
          stat(state, 'lead', 'open', m.openCount, 'งานค้าง', m.openIds, 'งานที่สถานะยังไม่ใช่ แก้ไขเรียบร้อย / ใช้งานได้อยู่แล้ว / ยกเลิก (รวมสถานะว่าง)', 'open') +
          stat(state, 'danger', 'overdue', m.overdueCount, 'เกินกำหนด', m.overdueIds, 'งานค้างที่วันกำหนดผ่านไปแล้ว โดยใช้วันที่เลื่อนก่อน ถ้าไม่มีจึงใช้วันที่ต้องได้', 'overdue') +
          stat(state, 'ok', 'closed-week', m.closedThisWeek.count, 'ปิดสัปดาห์นี้', m.closedThisWeek.ids, 'นับจากวันที่เสร็จ วันจันทร์ถึงวันอาทิตย์นี้', 'week') +
          stat(state, 'month', 'closed-month', m.closedThisMonth.count, 'ปิดเดือนนี้', m.closedThisMonth.ids, 'นับจากวันที่เสร็จ ภายในเดือนนี้', 'month') +
          '</div>' : '') +
        '</section>';
    }

    function stat(state, cls, metric, value, label, ids, tip, iconName) {
      return '<div class="stat ' + cls + '" data-metric="' + metric + '">' +
        (iconName ? '<span class="ico">' + UI.icon(iconName) + '</span>' : '') +
        drillButton(state, label, ids, '<span class="value num">' + value.toLocaleString('th-TH') + '</span>', 'stat-btn') +
        '<span class="label">' + esc(label) + ' ' + UI.helpTip(tip) + '</span></div>';
    }

    function pipeline(state, m) {
      var counts = {};
      m.byStatus.forEach(function (s) { counts[s.value] = s; });
      var open = D.WORKFLOW.filter(function (s) { return D.isOpen(s); });
      var max = 0;
      var maxStatus = null;
      open.forEach(function (s) {
        var c = counts[s] ? counts[s].count : 0;
        if (c > max) { max = c; maxStatus = s; }
      });
      var stages = open.map(function (s, idx) {
        var c = counts[s] ? counts[s].count : 0;
        var h = max ? Math.round((c / max) * 100) : 0;
        var cls = 'stage' + (s === maxStatus && c > 0 ? ' bottleneck' : '') + (c === 0 ? ' zero' : '');
        var key = state.registerDrill('สถานะ ' + D.statusLabel(s), counts[s] ? counts[s].ids : []);
        return '<button type="button" class="' + cls + '" data-action="drill" data-drill="' + key + '" aria-label="' + esc(D.statusLabel(s) + ' ' + c + ' รายการ') + '">' +
          '<span class="fill" style="height:' + h + '%;--i:' + idx + '"></span><span class="count num">' + c + '</span><span class="name">' + esc(D.statusLabel(s)) + '</span></button>';
      }).join('');
      var others = m.byStatus.filter(function (s) { return open.indexOf(s.value) === -1; });
      var extra = others.length
        ? '<div class="pipeline-extra">สถานะอื่นที่ยังเปิดอยู่: ' + others.map(function (s) {
            return drillButton(state, 'สถานะ ' + s.status, s.ids, esc(s.status) + ' ' + s.count);
          }).join(', ') + '</div>'
        : '';
      var head = maxStatus
        ? 'งานกองอยู่ที่ "' + esc(maxStatus) + '" มากที่สุด (' + max + ' งาน)'
        : 'ไม่มีงานค้าง';
      return '<section class="pipeline" aria-labelledby="pl-h"><div class="pipeline-head"><h2 id="pl-h">งานค้างแต่ละขั้นตอน ' +
        UI.helpTip('เรียงตามลำดับขั้นตอนจริง ขั้นที่ไฮไลต์คือขั้นที่มีงานรอมากที่สุด (คอขวด) กดที่ขั้นเพื่อดูรายการ') +
        '</h2><span class="muted">' + head + '</span></div><div class="stages">' + stages + '</div>' + extra + '</section>';
    }

    /** Ring showing the share of open work that is still on time. */
    function onTimeRing(open, overdue) {
      var pct = open ? Math.round(((open - overdue) / open) * 100) : 100;
      var r = 34;
      var c = 2 * Math.PI * r;
      return '<svg class="ring" viewBox="0 0 84 84" role="img" aria-label="งานค้างที่ยังไม่เกินกำหนด ' + pct + '%">' +
        '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="#fde8e6" stroke-width="10"/>' +
        '<circle cx="42" cy="42" r="' + r + '" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + ((c * pct) / 100).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 42 42)"/>' +
        '<text x="42" y="40" text-anchor="middle" class="ring-num">' + pct + '%</text><text x="42" y="55" text-anchor="middle" class="ring-sub">ทันกำหนด</text></svg>';
    }

    function severity(days) {
      return days > 30 ? 'sev-4' : days > 14 ? 'sev-3' : days > 7 ? 'sev-2' : 'sev-1';
    }

    function overduePanel(state, m) {
      var list = m.overdueList;
      var head = '<div class="panel-head"><h2 id="od-h">งานเกินกำหนด</h2><span class="muted">เรียงจากเกินนานที่สุด</span></div>';
      if (!list.length) {
        return '<section class="panel od-panel" aria-labelledby="od-h">' + head +
          '<div class="od-clear"><span aria-hidden="true">🎉</span><div><strong>ไม่มีงานเกินกำหนด</strong><p class="muted">ทีมทำได้ยอดเยี่ยม รักษามาตรฐานนี้ไว้</p></div></div></section>';
      }
      var buckets = D.overdueBuckets(list);
      var maxB = buckets.reduce(function (a, b) { return Math.max(a, b.ids.length); }, 0) || 1;
      var chart = '<div class="od-buckets">' + buckets.map(function (b, i) {
        var pct = Math.round((b.ids.length / maxB) * 100);
        return '<div class="od-bucket"><span class="od-blabel">' + esc(b.label) + '</span>' +
          '<span class="od-btrack"><span class="od-bfill sev-' + (i + 1) + '" style="width:' + pct + '%"></span></span>' +
          (b.ids.length ? drillButton(state, 'เกินกำหนด ' + b.label, b.ids, '<strong class="num">' + b.ids.length + '</strong>') : '<span class="muted num">0</span>') + '</div>';
      }).join('') + '</div>';
      var week = m.closedThisWeek.count;
      var cheer = '<div class="od-cheer">' + onTimeRing(m.openCount, m.overdueCount) +
        '<div><p>เกินกำหนด <b class="hot num">' + list.length + '</b> งาน' +
        (week ? ' · สัปดาห์นี้ปิดไปแล้ว <b class="good num">' + week + '</b> งาน 💪' : ' · เริ่มปิดงานแรกของสัปดาห์กันเลย') + '</p>' + chart + '</div></div>';
      var body = '<ol class="od-list">' + list.slice(0, 12).map(function (r) {
        return '<li class="' + severity(r.overdueDays) + '"><div class="od-days num">' + r.overdueDays + '<small>วัน</small></div><div>' +
          '<a href="#/items/' + encodeURIComponent(r.id) + '">' + esc(r.detail) + '</a>' +
          '<div class="meta"><span>#' + esc(r.seq === null ? '-' : r.seq) + '</span><span>' + esc(r.platform) + '</span><span>' + esc(r.system) + '</span><span>' + esc(r.developer || D.UNASSIGNED) + '</span>' +
          UI.statusBadge(r.status) + (r.ticketUrl ? UI.ticketLink(r) : '') + '</div></div></li>';
      }).join('') + '</ol>';
      if (list.length > 12) body += '<p style="margin-top:8px">' + drillButton(state, 'งานเกินกำหนดทั้งหมด', m.overdueIds, 'ดูงานเกินกำหนดทั้งหมด ' + list.length + ' งาน') + '</p>';
      return '<section class="panel od-panel" aria-labelledby="od-h">' + head + cheer + body + '</section>';
    }

    function peopleTable(state, rows, label, withOverdue) {
      if (!rows.length) return '<p class="muted">ไม่มีงานค้าง</p>';
      var max = rows.reduce(function (a, r) { return Math.max(a, r.open); }, 0);
      return '<div class="table-wrap"><table><thead><tr><th>' + esc(label) + '</th><th class="n">งานค้าง</th>' + (withOverdue ? '<th class="n">เกินกำหนด</th>' : '') + '</tr></thead><tbody>' +
        rows.map(function (p) {
          var pct = max ? Math.round((p.open / max) * 100) : 0;
          var od = p.open ? Math.round((p.overdue / p.open) * 100) : 0;
          var fill = 'linear-gradient(90deg, var(--danger) ' + od + '%, var(--accent) ' + od + '%)';
          return '<tr><td>' + esc(p.name) + '<div class="bar" aria-hidden="true"><span style="width:' + pct + '%;background:' + fill + '"></span></div></td>' +
            '<td class="n">' + (p.open ? drillButton(state, label + ' ' + p.name + ' งานค้าง', p.ids, String(p.open)) : '<span class="muted">0</span>') + '</td>' +
            (withOverdue ? '<td class="n">' + (p.overdue ? drillButton(state, label + ' ' + p.name + ' เกินกำหนด', p.overdueIds, '<span class="due-over">' + p.overdue + '</span>') : '<span class="muted">0</span>') + '</td>' : '') +
            '</tr>';
        }).join('') + '</tbody></table></div>';
    }

    function developerPanel(state, m) {
      return '<section class="panel" aria-labelledby="dev-h"><div class="panel-head"><h2 id="dev-h">นักพัฒนาแต่ละคน</h2><span class="muted">แถบแดง = ส่วนที่เกินกำหนด</span></div>' +
        peopleTable(state, m.byDeveloper, 'นักพัฒนา', true) + '</section>';
    }

    function pmPanel(state, m) {
      return '<section class="panel" aria-labelledby="pm-h"><div class="panel-head"><h2 id="pm-h">PM แต่ละคน</h2></div>' +
        peopleTable(state, D.pmBreakdown(m.byPm, state.options.pm || []), 'PM', true) + '</section>';
    }

    function qualityPanel(state) {
      var bad = state.filteredRows().filter(function (r) { return r.issues.length; });
      var body = !bad.length
        ? '<p class="muted">ไม่พบข้อมูลที่ไม่ครบหรืออยู่ผิดช่อง</p>'
        : '<p>' + drillButton(state, 'ข้อมูลไม่ครบ/ผิดช่อง', bad.map(function (r) { return r.id; }), '<strong class="num">' + bad.length + '</strong> รายการ') +
          ' มีข้อมูลที่ต้องแก้ เช่น ค่าอยู่ผิดช่อง วันที่อ่านไม่ได้ หรือไม่มีวันกำหนด</p>' +
          '<ul style="margin:8px 0 0;padding-left:1.2em">' + bad.slice(0, 5).map(function (r) {
            return '<li><a href="#/items/' + encodeURIComponent(r.id) + '">#' + esc(r.seq === null ? 'แถว ' + r.rowNumber : r.seq) + '</a> ' + esc(r.issues[0].message) + (r.issues.length > 1 ? ' <span class="muted">(+' + (r.issues.length - 1) + ')</span>' : '') + '</li>';
          }).join('') + '</ul>';
      return '<section class="panel" aria-labelledby="dq-h" data-panel="quality"><div class="panel-head"><h2 id="dq-h">ข้อมูลไม่ครบ/ผิดช่อง ' +
        UI.helpTip('รายการที่ค่าไม่อยู่ในตัวเลือก วันที่อ่านไม่ได้ ลำดับซ้ำ/ว่าง งานค้างไม่มีวันกำหนด หรือแก้ไขเรียบร้อยแต่ไม่มีวันที่เสร็จ PM ควรตามแก้') +
        '</h2></div>' + body + '</section>';
    }

    // ------------------------------------------------------------------ Items (US5 + drill-down)

    /** Column definitions for "รายการทั้งหมด" (order is configurable; default per user request 2026-11-11). */
    var ITEM_COLS = {
      seq: { label: 'ลำดับ', sort: 'seq', cell: function (r) { return '<td class="num" data-hide-mobile>' + esc(r.seq === null ? '–' : r.seq) + '</td>'; } },
      platform: { label: 'แพลตฟอร์ม', sort: 'platform', cell: function (r) { return '<td class="platform-cell" data-hide-mobile><span class="kplat">' + esc(r.platform || '–') + '</span></td>'; } },
      system: { label: 'ระบบงาน', sort: 'system', cell: function (r) { return '<td class="system-cell" data-hide-mobile>' + esc(r.system || '–') + '</td>'; } },
      detail: {
        label: 'รายละเอียด',
        cell: function (r) {
          return '<td class="detail-cell"><a href="#/items/' + encodeURIComponent(r.id) + '">' + esc(r.detail) + '</a>' +
            '<div class="sub"><span class="mobile-only">#' + esc(r.seq === null ? '–' : r.seq) + ' / ' + esc(r.platform) + ' / ' + esc(r.system) + ' </span>' +
            (r.issues.length ? '<span class="flag">ข้อมูลไม่ครบ/ผิดช่อง</span>' : '') + '</div></td>';
        },
      },
      ticket: {
        label: 'Taiga/MANTIS',
        cell: function (r) {

        tile('warm', 'this', g.thisWeek.length, 'ต้องทำสัปดาห์นี้', D.formatThai(week.from) + ' – ' + D.formatThai(week.to)) +
        (role === 'developer'
          ? '<a class="mw-tile cool" href="#mw-plan" data-action="mw-week" data-week="1"><span class="mw-num num">' + g.nextWeek.length + '</span><span class="mw-label">สัปดาห์หน้า</span><span class="mw-sub">' + D.formatThai(next.from) + ' – ' + D.formatThai(next.to) + '</span></a>'
          : tile('cool', 'next', g.nextWeek.length, 'สัปดาห์หน้า', D.formatThai(next.from) + ' – ' + D.formatThai(next.to))) +
        (role === 'developer'
          ? tile('good', 'done', g.doneThisWeek.length, 'ปิดได้สัปดาห์นี้', g.doneThisWeek.length ? 'เก่งมาก ทำต่อเลย 💪' : 'มาปิดงานแรกกัน')
          : tile('plan', 'nodue', g.noDue.length, 'ยังไม่มีวันกำหนด', g.noDue.length ? 'ใส่วันกำหนดให้ครบ' : 'ครบทุกงานแล้ว')) +
        '</div>';
      var section = function (key, title, note, list, empty) {
        return '<section class="group mw-group mw-' + key + '" id="mw-' + key + '" aria-labelledby="g-' + key + '"><h2 id="g-' + key + '">' + title + ' <span class="count">' + list.length + ' งาน</span></h2>' +
          (note ? '<p class="mw-note">' + note + '</p>' : '') +
          (list.length ? list.map(function (r) { return workCard(state, r); }).join('') : '<p class="muted mw-empty">' + empty + '</p>') + '</section>';
      };
      // urgent (left) and this week (right) side by side (user request 2026-11-11)
      html += '<div class="mw-two">' +
        section('urgent', '🔥 ต้องตามด่วน', 'เกินกำหนดแล้ว หรือ "ด่วนที่สุด" เรียงจากเร่งที่สุดก่อน', g.urgent, 'ไม่มีงานด่วน เยี่ยมมาก') +
        section('this', '📅 ต้องทำสัปดาห์นี้', 'กำหนดส่งภายในสัปดาห์นี้ (ยังไม่เกินกำหนด)', g.thisWeek, 'ไม่มีงานที่ครบกำหนดสัปดาห์นี้') +
        '</div>';
      if (role === 'developer') {
        html += weekPlanner(state, D.weekPlan(mine, name, state.today, state.weekOffset || 0));
      } else {
        html += section('next', '🗓️ สัปดาห์หน้า', 'เตรียมไว้ล่วงหน้า', g.nextWeek, 'ยังไม่มีงานสัปดาห์หน้า');
        if (g.later.length) html += section('later', 'ภายหลัง', '', g.later, '');

      // PM tab: items without a due date (PMs set dates). Developer tab: what I finished this week (encouragement).
      if (role === 'pm') html += section('nodue', '🗂️ ยังไม่มีวันกำหนด', 'ใส่ "วันที่ต้องได้" ให้ครบ ทีมจะได้วางแผนได้', g.noDue, 'ทุกงานมีวันกำหนดแล้ว');
      if (role === 'developer' && g.doneThisWeek.length) {
        html += '<section class="group mw-group mw-done" id="mw-done"><h2>✅ ปิดได้สัปดาห์นี้ <span class="count">' + g.doneThisWeek.length + ' งาน</span></h2>' +
          '<ul class="mw-donelist">' + g.doneThisWeek.map(function (r) {
            return '<li><a href="#/items/' + encodeURIComponent(r.id) + '">' + esc(r.detail) + '</a> <span class="muted">' + esc(r.doneDate.raw) + '</span></li>';

      return html;

    var DAY_NAMES = ['จันทร์', 'อังคาร', 'พุธ', 'พฤหัสฯ', 'ศุกร์', 'เสาร์', 'อาทิตย์'];

    /** Developer week planner: Mon–Fri always, Sat/Sun only when something is due. ◀ ▶ move by week. */
    function weekPlanner(state, p) {
      var off = state.weekOffset || 0;
      var title = off === 0 ? 'สัปดาห์นี้' : off === 1 ? 'สัปดาห์หน้า' : off === -1 ? 'สัปดาห์ที่แล้ว' : (off > 0 ? 'อีก ' + off + ' สัปดาห์' : (-off) + ' สัปดาห์ก่อน');
      var days = p.days.filter(function (x, i) { return i < 5 || x.items.length; });
      return '<section class="group mw-plan" id="mw-plan" aria-labelledby="g-plan"><div class="plan-head"><h2 id="g-plan">🗓️ แผนรายสัปดาห์ <span class="count">' + p.total + ' งาน</span></h2>' +
        '<div class="plan-nav"><button type="button" class="kjump-arrow" data-action="mw-week" data-week="' + (off - 1) + '" aria-label="สัปดาห์ก่อนหน้า">‹</button>' +
        '<span class="plan-range"><strong>' + esc(title) + '</strong> ' + esc(D.formatThai(p.range.from) + ' – ' + D.formatThai(p.range.to)) + '</span>' +
        '<button type="button" class="kjump-arrow" data-action="mw-week" data-week="' + (off + 1) + '" aria-label="สัปดาห์ถัดไป">›</button>' +
        (off !== 0 ? '<button type="button" class="btn small" data-action="mw-week" data-week="0">กลับสัปดาห์นี้</button>' : '') + '</div></div>' +
        '<p class="mw-note">งานที่ครบกำหนดแต่ละวัน (ใช้วันที่เลื่อนถ้ามี) งานที่เลยวันไปแล้วอยู่ใน 🔥 ต้องตามด่วน</p>' +
        '<div class="plan-grid" style="--days:' + days.length + '">' + days.map(function (x) {
          var dow = (p.days.indexOf(x));
          return '<div class="plan-day' + (x.isToday ? ' today' : '') + (x.isPast ? ' past' : '') + '"><div class="plan-date"><span>' + DAY_NAMES[dow] + '</span><strong>' + esc(D.formatThai(x.date)) + '</strong>' + (x.isToday ? '<em>วันนี้</em>' : '') + '</div>' +
            (x.items.length ? x.items.map(function (r) {
              return '<a class="plan-item' + (r.isOverdue ? ' over' : '') + (D.urgencyRank(r.urgency) === 0 ? ' top' : '') + '" href="#/items/' + encodeURIComponent(r.id) + '"><span class="num">#' + esc(r.seq) + '</span> ' + esc(r.detail) +
                '<span class="plan-meta">' + esc(r.platform) + ' · ' + esc(D.statusLabel(r.status)) + '</span></a>';
            }).join('') : '<span class="plan-free">ว่าง</span>') + '</div>';
        }).join('') + '</div></section>';
    }

    function workCard(state, r) {
      var next = D.nextStatus(r.status);
      var actions = '<a class="btn small" href="#/items/' + encodeURIComponent(r.id) + '">เปิด</a>';
      var seqOk = r.seq !== null && !r.issues.some(function (x) { return x.code === 'SEQ_DUPLICATE'; });
      if (state.user.canEdit && seqOk) {
        // pick any status (user request 2026-11-11); the next workflow step is pre-selected so one click still works
        var pick = next || r.status;
        var opt = function (s, label) { return '<option value="' + esc(s) + '"' + (s === pick ? ' selected' : '') + '>' + esc(label) + (s === r.status ? ' (ปัจจุบัน)' : '') + '</option>'; };
        actions += '<form class="qs-form" data-id="' + esc(r.id) + '"><label class="sr-only" for="qs-' + esc(r.id) + '">เปลี่ยนสถานะ #' + esc(r.seq) + '</label>' +
          '<select id="qs-' + esc(r.id) + '" name="to">' + UI.statusGroups().map(function (g) {
            return '<optgroup label="' + esc(g.label) + '">' + g.options.map(function (o) { return opt(o.value, o.label); }).join('') + '</optgroup>';
          }).join('') + '</select><button type="submit" class="btn small primary">เปลี่ยนสถานะ</button></form>';
      }
      return '<article class="work' + (r.isOverdue ? ' over' : '') + '"><div><a href="#/items/' + encodeURIComponent(r.id) + '" style="color:inherit">' + esc(r.detail) + '</a>' +
        '<div class="meta"><span>#' + esc(r.seq === null ? '–' : r.seq) + '</span><span>' + esc(r.platform) + ' / ' + esc(r.system) + '</span>' +
        (r.devQueue !== null ? '<span>คิวที่ ' + r.devQueue + '</span>' : '') + '<span>' + UI.urgency(r.urgency) + '</span>' + UI.statusBadge(r.status) + '<span>' + UI.due(r, state.today) + '</span>' + (r.ticketUrl ? UI.ticketLink(r) : '') + '</div></div>' +
        '<div class="actions">' + actions + '</div></article>';
    }

    // ------------------------------------------------------------------ Access management (admins)

    function access(state) {
      var html = '<div class="page-head"><h1>จัดการสิทธิ์</h1><span class="muted">ใครเพิ่มหรือแก้ไขรายการได้ (บันทึกลงชีต _app_allowed และเก็บประวัติใน _app_log)</span></div>';
      if (!state.user.isAdmin) return html + UI.emptyState('เฉพาะผู้ดูแลเท่านั้น', 'หน้านี้ใช้จัดการสิทธิ์ของทีม ถ้าต้องการสิทธิ์ผู้ดูแล ให้ติดต่อ PM');
      var a = state.access;
      if (!a) return html + UI.loading('กำลังโหลดรายชื่อทีม…');
      if (a.error) return html + UI.errorState(a.error, 'reload-access');
      var pending = a.members.filter(function (m) { return m.status === a.states.pending; });
      if (pending.length) {
        html += '<section class="panel access-pending" aria-labelledby="ap-h"><div class="panel-head"><h2 id="ap-h">คำขอรออนุมัติ <span class="count">' + pending.length + '</span></h2></div>' +
          pending.map(function (m) {
            return '<div class="access-req"><div><strong>' + esc(m.email) + '</strong>' + (m.name ? ' <span class="muted">' + esc(m.name) + '</span>' : '') + (m.note ? '<div class="muted">' + esc(m.note) + '</div>' : '') + '</div>' +
              '<div class="access-actions"><button class="btn small primary" data-action="access-set" data-email="' + esc(m.email) + '" data-field="status" data-value="' + esc(a.states.allowed) + '">อนุญาต</button>' +
              '<button class="btn small danger" data-action="access-set" data-email="' + esc(m.email) + '" data-field="status" data-value="' + esc(a.states.suspended) + '">ปฏิเสธ</button></div></div>';
          }).join('') + '</section>';
      }
      html += '<section class="panel repair-panel" aria-labelledby="ar-h"><div class="panel-head"><h2 id="ar-h">ซ่อมสีของ dropdown ในชีต</h2></div>' +
        '<p class="muted">แอปเวอร์ชันก่อน v1.6.0 ใส่เครื่องหมาย &#39; หน้าค่าที่บันทึก ทำให้ chip สีในชีตไม่ขึ้น กดปุ่มนี้เพื่อเขียนค่าเดิมกลับแบบไม่มี &#39; (เฉพาะช่องที่แอปเคยบันทึกและยังไม่มีใครแก้ต่อ)</p>' +
        '<button class="btn primary" data-action="repair-chips">' + UI.withIcon('reload', 'ซ่อมสี dropdown') + '</button></section>';
      html += '<section class="panel" aria-labelledby="aa-h"><div class="panel-head"><h2 id="aa-h">เพิ่มคนเข้าทีม</h2></div>' +
        '<form id="access-add" class="access-add">' +
        UI.input({ name: 'acc-email', label: 'อีเมล Gmail', type: 'email', required: true, placeholder: 'name@gmail.com' }) +
        UI.input({ name: 'acc-name', label: 'ชื่อ (ไม่บังคับ)' }) +
        UI.select({ name: 'acc-role', label: 'บทบาท', options: a.roles, value: a.roles[1] || a.roles[0], allowEmpty: false }) +
        '<div class="actions"><button class="btn primary" type="submit">เพิ่มเข้าทีม</button></div></form></section>';
      html += '<section class="panel" aria-labelledby="am-h"><div class="panel-head"><h2 id="am-h">สมาชิกทั้งหมด <span class="count">' + a.members.length + '</span></h2>' +
        '<span class="muted">ผู้ดูแลจัดการสิทธิ์ได้ ผู้แก้ไขเพิ่ม/แก้รายการได้ เจ้าของชีตเป็นผู้ดูแลเสมอ</span></div>' +
        '<div class="table-wrap"><table class="access-table"><thead><tr><th>อีเมล</th><th>ชื่อ</th><th>บทบาท</th><th>สถานะ</th></tr></thead><tbody>' +
        a.members.map(function (m) {
          var sel = function (field, list, value) {
            return '<select class="access-select" data-email="' + esc(m.email) + '" data-field="' + field + '" aria-label="' + (field === 'role' ? 'บทบาทของ ' : 'สถานะของ ') + esc(m.email) + '">' +
              list.map(function (v) { return '<option' + (v === value ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select>';
          };
          return '<tr class="st-' + (m.status === a.states.allowed ? 'ok' : m.status === a.states.pending ? 'wait' : 'off') + '"><td>' + esc(m.email) + (m.email === a.owner ? ' <span class="badge s-done">เจ้าของชีต</span>' : '') + '</td><td>' + esc(m.name) + '</td>' +
            '<td>' + sel('role', a.roles, m.role) + '</td><td>' + sel('status', [a.states.allowed, a.states.pending, a.states.suspended], m.status) + '</td></tr>';
        }).join('') + '</tbody></table></div></section>';
      return html;
    }

    // ------------------------------------------------------------------ Text report export

    function exportDialog(state, opts, text) {
      return '<h2>สรุปรายงาน (Export)</h2>' +
        '<p class="muted" style="margin:4px 0 12px">สร้างข้อความสรุปพร้อมส่งใน LINE หรืออีเมล เลือก PM เพื่อแยกรายงานตามผู้รับผิดชอบ</p>' +
        '<div class="export-opts">' +
        UI.multiPick({ name: 'rep-pm', label: 'PM ผู้รับผิดชอบ', options: state.options.pm, value: opts.pm, wide: true, hint: 'เลือกได้หลายคน ถ้าไม่เลือกเลย = ทุกคน' }) +
        UI.input({ name: 'rep-since', label: 'ลำดับสุดท้ายของรายงานครั้งก่อน', value: opts.since === null || opts.since === undefined ? '' : String(opts.since), inputmode: 'numeric', tip: 'รายการที่มีลำดับมากกว่าเลขนี้นับเป็น "รายการขอแก้ไขใหม่" ระบบจำเลขล่าสุดให้ทุกครั้งที่คัดลอกหรือดาวน์โหลด' }) +
        '</div>' +
        '<label class="sr-only" for="rep-text">ข้อความรายงาน</label><textarea id="rep-text" class="export-text" readonly>' + esc(text) + '</textarea>' +
        '<div class="dialog-actions"><button class="btn" value="close" data-action="export-close">ปิด</button>' +
        '<button class="btn" data-action="export-download">' + UI.withIcon('download', 'ดาวน์โหลด .txt') + '</button>' +
        '<button class="btn primary" data-action="export-copy">' + UI.withIcon('copy', 'คัดลอกข้อความ') + '</button></div>';
    }

    // ------------------------------------------------------------------ Kanban (US8)

    var KANBAN_LIMIT = 40;
    var KANBAN_TAIL = ['dev ขอ Sourecode อจ.', 'รอ Complie ต้องแจ้งอจ.'];
    var OTHER_COLUMN = '__other__';

    function kanban(state) {
      var rows = state.filteredRows();
      var open = D.WORKFLOW.filter(function (s) { return D.isOpen(s); });
      var week = D.weekRange(state.today);
      var cols = open.map(function (s, i) {
        return { status: s, title: D.statusLabel(s), step: i + 1, rows: rows.filter(function (r) { return r.isOpen && r.status === s; }) };
      });
      // open items with an empty or unknown status still count as open, so they must be on the board too
      var other = rows.filter(function (r) { return r.isOpen && open.indexOf(r.status) === -1; });
      if (other.length) cols.unshift({ status: OTHER_COLUMN, title: 'สถานะว่าง / ไม่อยู่ในขั้นตอน', other: true, rows: other });
      cols.push({
        status: D.DONE,
        title: 'ปิดงานสัปดาห์นี้',
        closed: true,
        rows: rows.filter(function (r) { return !r.isOpen && D.inRange(r.doneDate.date, week); }),
      });
      // Waiting-on-อจ. columns sit after "ปิดงานสัปดาห์นี้" (user request 2026-11-11); the workflow order is unchanged
      var tail = cols.filter(function (c) { return KANBAN_TAIL.indexOf(c.status) !== -1; });
      cols = cols.filter(function (c) { return KANBAN_TAIL.indexOf(c.status) === -1; }).concat(tail);
      var max = Math.max.apply(null, cols.filter(function (c) { return c.step; }).map(function (c) { return c.rows.length; }));
      var html = readOnlyBanner(state) + '<div class="page-head"><h1>บอร์ดงาน</h1><span class="muted">' + esc(filterSummary(state)) + '</span><span class="spacer muted">' +
        (state.user.canEdit ? 'ลากการ์ดไปคอลัมน์อื่น หรือกดปุ่ม ◀ ▶ เพื่อเปลี่ยนสถานะ' : 'ดูอย่างเดียว') +
        '</span><button class="btn small" data-action="reload">โหลดข้อมูลใหม่</button></div>' + filterBar(state);
      var collapsed = state.kanbanCollapsed || {};
      // Jump bar ON TOP (user request): chips per column + ◀ ▶ to scroll the board without the bottom scrollbar
      html += '<div class="kjump" role="toolbar" aria-label="เลื่อนไปยังคอลัมน์">' +
        '<button type="button" class="kjump-arrow" data-action="kscroll" data-dir="-1" aria-label="เลื่อนบอร์ดไปทางซ้าย">‹</button>' +
        '<div class="kjump-chips">' + cols.map(function (c) {
          return '<button type="button" class="kjump-chip g-' + stageGroup(c) + (c.rows.length === max && c.step && max > 0 ? ' hot' : '') + '" data-action="kjump" data-status="' + esc(c.status) + '">' +
            (c.step ? '<span class="kjump-step">' + c.step + '</span>' : '') + '<span class="kjump-name">' + esc(c.title) + '</span><span class="kjump-count num">' + c.rows.length + '</span></button>';
        }).join('') + '</div>' +
        '<button type="button" class="kjump-arrow" data-action="kscroll" data-dir="1" aria-label="เลื่อนบอร์ดไปทางขวา">›</button>' +
        '<button type="button" class="btn small kjump-all" data-action="kcollapse-all">' + (Object.keys(collapsed).length ? 'ขยายทุกคอลัมน์' : 'ยุบคอลัมน์ว่าง') + '</button></div>';
      html += '<div class="board" role="list" aria-label="บอร์ดงานตามสถานะ">' + cols.map(function (c) {
        var sorted = c.rows.slice().sort(function (a, b) {
          return (b.isOverdue - a.isOverdue) || (D.urgencyRank(a.urgency) - D.urgencyRank(b.urgency)) ||
            ((a.effectiveDue ? D.compareDate(a.effectiveDue, b.effectiveDue || { y: 9999, m: 1, d: 1 }) : 1));
        });
        var more = sorted.length - KANBAN_LIMIT;
        var isCollapsed = !!collapsed[c.status];
        var cls = 'kcol g-' + stageGroup(c) + (c.closed ? ' closed' : '') + (c.other ? ' other' : '') + (c.step && c.rows.length === max && max > 0 ? ' bottleneck' : '') + (isCollapsed ? ' collapsed' : '');
        return '<section class="' + cls + '" role="listitem" data-status="' + esc(c.status) + '" aria-label="' + esc(c.title + ' ' + c.rows.length + ' งาน') + '">' +
          '<header class="kcol-head"><h2>' + (c.step ? '<span class="kstep">' + c.step + '</span>' : '') + '<span class="ktitle-h">' + esc(c.title) + '</span></h2>' + (cls.indexOf('bottleneck') !== -1 && !isCollapsed ? '<span class="kbadge">คอขวด</span>' : '') + '<span class="kcount num">' + c.rows.length + '</span>' +
          '<button type="button" class="kcollapse" data-action="kcollapse" data-status="' + esc(c.status) + '" aria-expanded="' + !isCollapsed + '" aria-label="' + (isCollapsed ? 'ขยาย' : 'ยุบ') + 'คอลัมน์ ' + esc(c.title) + '">' + (isCollapsed ? '⤢' : '⤡') + '</button></header>' +
          (isCollapsed ? '' : '<div class="kcards">' + (sorted.length ? sorted.slice(0, KANBAN_LIMIT).map(function (r) { return kcard(state, r, open); }).join('') : '<p class="kempty">ไม่มีงาน</p>') +
          (more > 0 ? '<p class="kmore">' + drillButton(state, c.title, c.rows.map(function (r) { return r.id; }), 'ดูทั้งหมด ' + c.rows.length + ' งาน') + '</p>' : '') +
          '</div>') + '</section>';
      }).join('') + '</div>';
      return html;
    }

    function kcard(state, r, open) {
      var seqOk = r.seq !== null && !r.issues.some(function (x) { return x.code === 'SEQ_DUPLICATE'; });
      var canMove = state.user.canEdit && state.schema.ok && seqOk && r.isOpen;
      var i = open.indexOf(r.status);
      var prev = i > 0 ? open[i - 1] : null;
      // items in the "other" column move forward to the first workflow step
      var next = i >= 0 ? D.nextStatus(r.status) : D.nextStatus(r.status) || open[0];
      var btns = '';
      if (canMove) {
        btns = '<div class="kmove">' +
          (prev ? '<button class="btn small" data-action="kmove" data-id="' + esc(r.id) + '" data-to="' + esc(prev) + '" aria-label="ย้าย #' + esc(r.seq) + ' กลับไป ' + esc(D.statusLabel(prev)) + '" title="กลับไป ' + esc(D.statusLabel(prev)) + '">◀</button>' : '<span></span>') +
          (next ? '<button class="btn small" data-action="kmove" data-id="' + esc(r.id) + '" data-to="' + esc(next) + '" aria-label="ย้าย #' + esc(r.seq) + ' ไป ' + esc(D.statusLabel(next)) + '" title="ไป ' + esc(D.statusLabel(next)) + '">▶</button>' : '') +
          '</div>';
      }
      var dev = r.developer || D.UNASSIGNED;
      var urg = D.urgencyRank(r.urgency);
      var dueCls = !r.effectiveDue ? 'none' : r.isOverdue ? 'over' : D.daysBetween(state.today, r.effectiveDue) <= 3 ? 'soon' : 'ok';
      var dueText = !r.effectiveDue ? 'ไม่มีกำหนด' : r.isOverdue ? '🔥 เกิน ' + r.overdueDays + ' วัน' : D.formatThai(r.effectiveDue);
      return '<article class="kcard u-' + urg + (r.isOverdue ? ' over' : '') + '"' + (canMove ? ' draggable="true"' : '') + ' data-id="' + esc(r.id) + '">' +
        '<div class="kcard-top"><span class="kseq num">#' + esc(r.seq === null ? '–' : r.seq) + '</span><span class="kplat">' + esc(r.platform) + '</span>' +
        (urg < 2 ? '<span class="kurg">' + esc(r.urgency) + '</span>' : '') + (r.ticketUrl ? UI.ticketLink(r) : '') + '</div>' +
        '<a href="#/items/' + encodeURIComponent(r.id) + '" class="ktitle">' + esc(r.detail) + '</a>' +
        '<div class="kcard-foot"><span class="kavatar" title="' + esc(dev) + '" aria-hidden="true">' + esc(initials(dev)) + '</span><span class="kdev">' + esc(dev) + '</span>' +
        '<span class="kdue ' + dueCls + '">' + esc(dueText) + '</span></div>' + btns + '</article>';
    }

    /** Colour group for a column: waiting / developing / testing / sent back / closed / other. */
    function stageGroup(c) {
      if (c.closed) return 'done';
      if (c.other) return 'other';
      return D.stageOf(c.status);
    }

    function initials(name) {
      var n = String(name || '').replace(/^(นักพัฒนา|พีเอ็ม)\s+/, '').trim();
      return n ? n.charAt(0) : '?';
    }
