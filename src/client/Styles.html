<style>
  /* Design tokens (constitution XIII): every color, space and radius comes from here. */
  :root {
    --paper: #f5f8f7;
    --surface: #ffffff;
    --surface-2: #eef3f2;
    --ink: #1c2b2f;
    --muted: #55686d;
    --line: #d6e0df;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --accent-soft: #d8efec;
    --danger: #b42318;
    --danger-soft: #fde8e6;
    --warn: #a15c07;
    --warn-soft: #fdf1dc;
    --ok: #256b41;
    --ok-soft: #e1f2e7;
    --focus: #1d4ed8;
    --shadow: 0 1px 2px rgba(28, 43, 47, 0.06);
    --r-s: 6px;
    --r-m: 10px;
    --s-1: 4px;
    --s-2: 8px;
    --s-3: 12px;
    --s-4: 16px;
    --s-5: 24px;
    --s-6: 32px;
    --font: 'IBM Plex Sans Thai', 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --paper: #11181a;
      --surface: #182225;
      --surface-2: #1f2c30;
      --ink: #e4eceb;
      --muted: #9fb2b5;
      --line: #2c3c40;
      --accent: #3fb8aa;
      --accent-ink: #082522;
      --accent-soft: #163a37;
      --danger: #ff8a7a;
      --danger-soft: #3a1d1a;
      --warn: #f2b45a;
      --warn-soft: #3a2c14;
      --ok: #6fcf97;
      --ok-soft: #173325;
      --focus: #8ab4ff;
      --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.6 var(--font);
    font-variant-numeric: tabular-nums;
  }
  a { color: var(--accent); }
  h1, h2, h3 { line-height: 1.3; margin: 0; font-weight: 600; }
  h1 { font-size: 22px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }
  p { margin: 0; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- shell */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: none; margin: 0; padding: var(--s-3) clamp(12px, 2vw, 28px);
    display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; margin-right: auto; min-width: 0; }
  .brand strong { font-size: 16px; }
  .brand span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ver { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 11px; line-height: 18px; }
  .page-head .back, .drill .back { margin-right: var(--s-1); }
  .nav { display: flex; gap: var(--s-1); overflow-x: auto; max-width: 100%; }
  .nav a {
    text-decoration: none; color: var(--muted); padding: var(--s-2) var(--s-3);
    border-radius: var(--r-s); white-space: nowrap; font-weight: 500;
  }
  .nav a:hover { background: var(--surface-2); color: var(--ink); }
  .nav a[aria-current='page'] { background: var(--accent-soft); color: var(--accent); }
  .nav a.nav-add { background: var(--accent); color: var(--accent-ink); }
  main { max-width: none; margin: 0; padding: var(--s-5) clamp(12px, 2vw, 28px) 64px; }
  .page-head { display: flex; align-items: baseline; gap: var(--s-3); flex-wrap: wrap; margin-bottom: var(--s-4); }
  .page-head .spacer { margin-left: auto; }
  .banner { padding: var(--s-3) var(--s-4); border-radius: var(--r-m); margin-bottom: var(--s-4); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.danger { background: var(--danger-soft); color: var(--danger); }

  /* ---------- buttons & fields */
  .btn {
    display: inline-flex; align-items: center; gap: var(--s-2);
    font: inherit; font-weight: 500; cursor: pointer;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    padding: 7px 14px; border-radius: var(--r-s); text-decoration: none; min-height: 38px;
  }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.danger { color: var(--danger); border-color: var(--danger); }
  .btn.small { padding: 3px 10px; min-height: 30px; font-size: 13px; }
  .btn[disabled] { opacity: 0.55; cursor: not-allowed; }
  .linklike { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  .field { display: flex; flex-direction: column; gap: var(--s-1); min-width: 0; }
  .field label { font-weight: 500; font-size: 14px; }
  .field .req { color: var(--danger); }
  .field .hint { font-size: 13px; color: var(--muted); }
  .field .err { font-size: 13px; color: var(--danger); }
  .field .warn { font-size: 13px; color: var(--warn); }
  input, select, textarea {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r-s); padding: 7px 10px; min-height: 38px; width: 100%;
  }
  textarea { min-height: 96px; resize: vertical; }
  [aria-invalid='true'] { border-color: var(--danger); }
  input[readonly], select[disabled], textarea[readonly] { background: var(--surface-2); }

  /* ---------- filter bar */
  .filters {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--s-3);
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
    padding: var(--s-3) var(--s-4); margin-bottom: var(--s-5);
  }
  .filters .field label { font-size: 13px; color: var(--muted); font-weight: 400; }
  .filters .actions { display: flex; align-items: flex-end; gap: var(--s-2); }

  /* ---------- summary line (monitor) */
  .summary { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-6); align-items: baseline; margin-bottom: var(--s-4); }
  .stat { display: flex; align-items: baseline; gap: var(--s-2); }
  .stat button { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
  .stat .value { font-size: 34px; font-weight: 600; line-height: 1.1; }
  .stat.lead .value { font-size: 48px; }
  .stat.danger .value { color: var(--danger); }
  .stat.ok .value { color: var(--ok); }
  .stat .label { color: var(--muted); }
  .stat button:hover .value { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px; }

  /* ---------- brand mark */
  .brand-row { display: flex; align-items: center; gap: var(--s-3); margin-right: auto; min-width: 0; }
  .logo { width: 34px; height: 34px; flex: none; color: var(--accent); }
  .brand-row .brand { margin-right: 0; }

  /* ---------- hero: the welcome moment (light, friendly, illustrated) */
  .hero {
    position: relative; overflow: hidden; isolation: isolate;
    background: linear-gradient(120deg, #e6f6f2 0%, #f1f8ff 60%, #fff8ec 100%);
    border: 1px solid #d3ebe5; border-radius: 20px;
    padding: clamp(20px, 3vw, 32px); margin-bottom: var(--s-5);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 380px); gap: var(--s-4) var(--s-6); align-items: center;
  }
  .hero-hello { color: var(--muted); font-size: 15px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .hero-hello strong { color: var(--accent); font-weight: 600; }
  .hero h1 { font-size: clamp(24px, 3.2vw, 34px); margin: 6px 0 8px; }
  .hero-sub { font-size: 16px; max-width: 60ch; }
  .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s-2) var(--s-3); margin-top: var(--s-4); }
  .hero-chip { background: var(--accent); color: var(--accent-ink); text-decoration: none; padding: 8px 16px; border-radius: 999px; font-weight: 500; box-shadow: 0 4px 12px rgba(15, 118, 110, 0.25); }
  .hero-chip:hover { filter: brightness(1.06); }
  .hero-chip .hot { color: #ffe2dc; }
  .hero-meta { color: var(--muted); font-size: 13px; }
  .hero-art { align-self: stretch; display: flex; align-items: center; justify-content: center; }
  .hero-art .illus { width: 100%; max-width: 380px; height: auto; }
  .hero-stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-3); }
  .hero .stat {
    background: var(--surface); border-radius: 14px; padding: var(--s-3) var(--s-4);
    display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: var(--s-3); align-items: center;
    box-shadow: 0 2px 10px rgba(15, 61, 58, 0.06); border: 1px solid #e3efec;
  }
  .hero .stat .ico { grid-row: 1 / span 2; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
  .hero .stat .ico svg { width: 22px; height: 22px; }
  .hero .stat .value { font-size: clamp(26px, 3vw, 36px); }
  .hero .stat .label { font-size: 14px; }
  .hero .stat.lead .ico { background: #d8efec; color: var(--accent); }
  .hero .stat.danger .ico { background: #fde8e6; color: var(--danger); }
  .hero .stat.ok .ico { background: #e1f2e7; color: var(--ok); }
  .hero .stat.month .ico { background: #ece6fb; color: #5b3fb5; }
  @media (max-width: 960px) { .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; }
    .hero-art { order: -1; }
    .hero-art .illus { max-width: 300px; }
  }

  /* ---------- illustration motion (gentle; off for reduced motion) */
  .illus .il-float { animation: il-float 4.5s ease-in-out infinite; }
  .illus .il-float-slow { animation: il-float 6.5s ease-in-out infinite; }
  .illus .il-move { animation: il-move 7s cubic-bezier(0.45, 0, 0.2, 1) infinite; }
  .illus .il-bar { transform-box: fill-box; transform-origin: bottom; animation: il-grow 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: var(--d, 0s); }
  .illus .il-pop { transform-box: fill-box; transform-origin: center; animation: il-pop 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) 0.6s both; }
  @keyframes il-float { 50% { transform: translateY(-6px); } }
  @keyframes il-move {
    0%, 22% { transform: translate(0, 0); opacity: 1; }
    42%, 78% { transform: translate(106px, -48px); opacity: 1; }
    92% { transform: translate(106px, -48px); opacity: 0; }
    100% { transform: translate(0, 0); opacity: 0; }
  }
  @keyframes il-grow { from { transform: scaleY(0); } }
  @keyframes il-pop { from { transform: scale(0); } }

  /* ---------- one orchestrated entrance, first load only (skipped for reduced motion) */
  .intro .hero { animation: rise 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .intro .stage .fill { animation: grow 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both; animation-delay: calc(0.25s + var(--i, 0) * 70ms); transform-origin: bottom; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(0.9); opacity: 0.7; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  @keyframes grow { from { transform: scaleY(0); } }
  @keyframes growx { from { transform: scaleX(0); } }

  /* ---------- the pipeline: the one memorable element */
  .pipeline { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--s-4); margin-bottom: var(--s-5); }
  .pipeline-head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-3); margin-bottom: var(--s-3); flex-wrap: wrap; }
  .stages { display: flex; gap: 3px; align-items: stretch; min-height: 116px; }
  .stage {
    flex: 1 1 0; min-width: 0; border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--ink);
    background: var(--surface-2); padding: var(--s-3) var(--s-2) var(--s-2); position: relative;
    display: flex; flex-direction: column; justify-content: flex-end; gap: var(--s-1);
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%);
    padding-left: 18px;
  }
  .stage:first-child { clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); padding-left: var(--s-3); border-radius: var(--r-s) 0 0 var(--r-s); }
  .stage .fill { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent-soft); z-index: 0; }
  .stage > * { position: relative; z-index: 1; }
  .stage .count { font-size: 26px; font-weight: 600; line-height: 1; }
  .stage .name { font-size: 12.5px; line-height: 1.35; color: var(--muted); overflow-wrap: anywhere; }
  .stage.bottleneck .fill { background: var(--accent); }
  .stage.bottleneck .count, .stage.bottleneck .name { color: var(--accent-ink); }
  .stage:hover .name { color: var(--ink); text-decoration: underline; }
  .stage.bottleneck:hover .name { color: var(--accent-ink); }
  .stage.zero .count { color: var(--muted); font-weight: 400; }
  .pipeline-extra { margin-top: var(--s-3); font-size: 13px; color: var(--muted); }
  @media (max-width: 760px) {
    .stages { flex-direction: column; min-height: 0; gap: 2px; }
    .stage, .stage:first-child { clip-path: none; border-radius: 0; flex-direction: row; align-items: center; justify-content: space-between; padding: var(--s-2) var(--s-3); }
    .stage .fill { top: 0; bottom: 0; right: auto; height: auto !important; }
    .stage .count { font-size: 18px; order: 2; }
    .stage.bottleneck { background: var(--accent); }
    .intro .stage .fill { animation-name: growx; transform-origin: left; }
  }

  /* ---------- panels, tables */
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: var(--s-5); align-items: start; }
  @media (max-width: 960px) { .grid-2 { grid-template-columns: minmax(0, 1fr); } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--s-4); }
  .panel + .panel { margin-top: var(--s-5); }
  .panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); margin-bottom: var(--s-3); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: var(--s-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
  th button { all: unset; cursor: pointer; }
  th button:focus-visible { outline: 3px solid var(--focus); }
  td { padding: var(--s-2); border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--surface-2); }
  .detail-cell { max-width: 46ch; }
  .detail-cell .sub { font-size: 12.5px; color: var(--muted); }
  .bar { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
  .bar span { display: block; height: 100%; background: var(--accent); }
  .bar span.od { background: var(--danger); }

  /* overdue list */
  .od-list { list-style: none; margin: 0; padding: 0; }
  .od-list li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: var(--s-3); padding: var(--s-3) 0; border-bottom: 1px solid var(--line); }
  .od-list li:last-child { border-bottom: 0; }
  .od-days { color: var(--danger); font-weight: 600; font-size: 20px; line-height: 1.1; }
  .od-days small { display: block; font-size: 12px; font-weight: 400; }
  .od-list a { color: var(--ink); text-decoration: none; }
  .od-list a:hover { text-decoration: underline; }
  .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 2px; }

  /* ---------- badges */
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12.5px; white-space: nowrap; background: var(--surface-2); color: var(--ink); }
  .badge.s-wait { background: var(--surface-2); }
  .badge.s-dev { background: var(--accent-soft); color: var(--accent); }
  .badge.s-test { background: #e9e5fb; color: #5b3fb5; }
  .badge.s-back { background: var(--warn-soft); color: var(--warn); }
  .badge.s-done { background: var(--ok-soft); color: var(--ok); }
  .badge.s-closed { background: var(--surface-2); color: var(--muted); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .badge.s-test { background: #2b2450; color: #c3b5ff; } }
  .urg-top { color: var(--danger); font-weight: 600; }
  .urg-high { color: var(--warn); font-weight: 500; }
  .due-over { color: var(--danger); font-weight: 500; }
  .due-today { color: var(--warn); font-weight: 500; }
  .flag { color: var(--warn); font-size: 12.5px; }

  /* ---------- tip */
  .tip { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center; font-size: 12px; border: 1px solid var(--line); color: var(--muted); cursor: help; position: relative; vertical-align: middle; background: var(--surface); }
  .tip .tip-body { display: none; position: absolute; left: 50%; top: 24px; transform: translateX(-50%); width: min(280px, 80vw); background: var(--ink); color: var(--paper); padding: var(--s-2) var(--s-3); border-radius: var(--r-s); font-size: 13px; line-height: 1.5; z-index: 20; text-align: left; font-weight: 400; }
  .tip:hover .tip-body, .tip:focus .tip-body { display: block; }

  /* ---------- form */
  /* Form: on wide screens the three groups sit side by side so the whole form fits without much scrolling */
  .form { display: grid; gap: var(--s-4); grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; }
  .form .form-actions { grid-column: 1 / -1; }
  @media (max-width: 1280px) { .form { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form fieldset:first-of-type { grid-column: 1 / -1; } }
  @media (max-width: 760px) { .form { grid-template-columns: 1fr; } }
  .form fieldset { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: var(--s-3) var(--s-4) var(--s-4); margin: 0; min-width: 0; }
  .form legend { font-weight: 600; padding: 0 var(--s-2); }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--s-3); }
  .form-grid .wide { grid-column: 1 / -1; }
  .form textarea { min-height: 72px; }
  .form .field .hint { font-size: 12.5px; }

  /* Date field + calendar popover */
  .field { position: relative; }
  .date-row { display: flex; gap: 6px; }
  .cal-btn { padding: 0 10px; flex: none; }
  .cal {
    position: absolute; z-index: 40; top: 100%; left: 0; margin-top: 6px; width: min(300px, 92vw);
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: var(--s-3);
    box-shadow: 0 12px 32px rgba(15, 61, 58, 0.16);
  }
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); margin-bottom: var(--s-2); }
  .cal-title { display: flex; flex-direction: column; align-items: center; line-height: 1.3; }
  .cal-title span { font-size: 12px; color: var(--muted); }
  .cal-nav { font: inherit; font-size: 20px; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--ink); }
  .cal-nav:hover { background: var(--surface-2); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-wd { font-size: 12px; color: var(--muted); padding: 4px 0; }
  .cal-day { font: inherit; font-size: 14px; height: 36px; border-radius: 10px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  .cal-day:hover { background: var(--accent-soft); }
  .cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 600; }
  .cal-day[aria-pressed='true'] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .cal-foot { display: flex; gap: var(--s-2); justify-content: space-between; margin-top: var(--s-2); }

  /* Big "add" call to action on the first page */
  .hero-add { display: inline-flex; align-items: center; gap: 8px; background: #c2410c; color: #fff; text-decoration: none; font-weight: 600; font-size: 16px; padding: 10px 22px; border-radius: 999px; box-shadow: 0 8px 18px rgba(194, 65, 12, 0.3); }
  .hero-add:hover { filter: brightness(1.05); }
  .hero-add svg { width: 20px; height: 20px; }
  .form-actions { display: flex; gap: var(--s-3); flex-wrap: wrap; align-items: center; position: sticky; bottom: 0; background: var(--paper); padding: var(--s-3) 0; border-top: 1px solid var(--line); }
  .form-actions .spacer { margin-left: auto; }

  /* ---------- items list */
  .toolbar { display: flex; gap: var(--s-3); flex-wrap: wrap; align-items: center; margin-bottom: var(--s-3); }
  .toolbar input[type='search'] { max-width: 360px; }
  .chips { display: flex; gap: var(--s-1); flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13.5px; cursor: pointer; color: var(--ink); }
  .chip[aria-pressed='true'] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .pager { display: flex; gap: var(--s-2); align-items: center; justify-content: flex-end; margin-top: var(--s-3); }
  .drill { display: flex; gap: var(--s-3); align-items: center; flex-wrap: wrap; background: var(--accent-soft); color: var(--accent); padding: var(--s-2) var(--s-3); border-radius: var(--r-s); margin-bottom: var(--s-3); }
  .mobile-only { display: none; }
  @media (max-width: 640px) {
    .mobile-only { display: inline; }
    table.responsive thead { display: none; }
    table.responsive tr { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--s-3); padding: var(--s-3) 0; border-bottom: 1px solid var(--line); }
    table.responsive td { border: 0; padding: 0; }
    table.responsive td.detail-cell { grid-column: 1 / -1; max-width: none; }
    table.responsive td[data-hide-mobile] { display: none; }
  }

  /* ---------- kanban */
  .board { display: flex; gap: var(--s-3); overflow-x: auto; padding-bottom: var(--s-3); align-items: flex-start; scroll-snap-type: x proximity; }
  .kcol { flex: 0 0 272px; background: var(--surface-2); border-radius: var(--r-m); display: flex; flex-direction: column; max-height: calc(100vh - 230px); min-height: 160px; scroll-snap-align: start; border: 2px solid transparent; }
  .kcol.bottleneck .kcol-head { background: var(--accent); color: var(--accent-ink); }
  .kcol.bottleneck .kcol-head .kstep { background: var(--accent-ink); color: var(--accent); }
  .kcol.closed .kcol-head { background: var(--ok-soft); color: var(--ok); }
  .kcol.drop-target { border-color: var(--accent); background: var(--accent-soft); }
  .kcol-head { display: flex; justify-content: space-between; align-items: center; gap: var(--s-2); padding: var(--s-2) var(--s-3); border-radius: var(--r-m) var(--r-m) 0 0; }
  .kcol-head h2 { font-size: 14px; display: flex; gap: var(--s-2); align-items: center; }
  .kstep { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); color: var(--muted); align-items: center; justify-content: center; font-size: 12px; flex: none; }
  .kcount { font-weight: 600; }
  .kcards { overflow-y: auto; padding: 0 var(--s-2) var(--s-2); display: grid; gap: var(--s-2); }
  .kcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); padding: var(--s-2) var(--s-3); font-size: 13.5px; box-shadow: var(--shadow); }
  .kcard[draggable='true'] { cursor: grab; }
  .kcard.dragging { opacity: 0.5; }
  .kcard.over { border-left: 4px solid var(--danger); }
  .ktitle { color: var(--ink); text-decoration: none; display: block; line-height: 1.45; }
  .ktitle:hover { text-decoration: underline; }
  .kmove { display: flex; justify-content: space-between; margin-top: var(--s-2); }
  .kmove .btn { min-height: 28px; padding: 0 12px; }
  .kempty, .kmore { color: var(--muted); font-size: 13px; padding: var(--s-2); margin: 0; }

  /* ---------- my work */
  .tabs { display: flex; gap: var(--s-1); border-bottom: 1px solid var(--line); margin-bottom: var(--s-4); }
  .tabs button { font: inherit; background: none; border: 0; padding: var(--s-2) var(--s-3); cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button[aria-selected='true'] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .group { margin-bottom: var(--s-5); }
  .group h2 { display: flex; gap: var(--s-2); align-items: baseline; margin-bottom: var(--s-2); }
  .group h2 .count { color: var(--muted); font-weight: 400; font-size: 14px; }
  .work { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--s-2) var(--s-4); align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--s-3) var(--s-4); margin-bottom: var(--s-2); }
  .work.over { border-left: 4px solid var(--danger); }
  .work .actions { display: flex; gap: var(--s-2); flex-wrap: wrap; justify-content: flex-end; }
  @media (max-width: 640px) { .work { grid-template-columns: 1fr; } .work .actions { justify-content: flex-start; } }

  /* ---------- empty, loading, error */
  .empty { text-align: center; padding: var(--s-6) var(--s-4); color: var(--muted); }
  .empty h2 { color: var(--ink); margin-bottom: var(--s-2); }
  .empty .btn { margin-top: var(--s-4); }
  .loading { padding: 80px var(--s-4); text-align: center; color: var(--muted); }
  .welcome-loading { padding: 32px var(--s-4) 64px; }
  .welcome-loading .illus { width: min(440px, 92%); height: auto; display: block; margin: 0 auto 8px; }
  .welcome-title { color: var(--ink); font-size: clamp(18px, 2.4vw, 22px); font-weight: 600; margin-bottom: 4px; }
  .welcome-bar { height: 4px; width: 180px; margin: 16px auto 0; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
  .welcome-bar span { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 4px; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  body { background: linear-gradient(180deg, #f2faf8 0, var(--paper) 320px); background-attachment: fixed; }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto var(--s-3); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- toast & dialog */
  .toast-host { position: fixed; bottom: var(--s-4); left: 50%; transform: translateX(-50%); z-index: 50; display: grid; gap: var(--s-2); width: min(520px, calc(100% - 32px)); }
  .toast { background: var(--ink); color: var(--paper); padding: var(--s-3) var(--s-4); border-radius: var(--r-m); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); }
  .toast.error { background: var(--danger); color: #fff; }
  dialog { border: 1px solid var(--line); border-radius: var(--r-m); padding: var(--s-5); max-width: min(480px, calc(100% - 32px)); background: var(--surface); color: var(--ink); }
  dialog::backdrop { background: rgba(10, 20, 22, 0.45); }
  dialog .dialog-actions { display: flex; gap: var(--s-2); justify-content: flex-end; margin-top: var(--s-4); }

  /* ---------- tour */
  .tour { position: fixed; inset: 0; z-index: 60; background: rgba(10, 20, 22, 0.5); display: flex; align-items: center; justify-content: center; padding: var(--s-4); }
  .tour-card { background: var(--surface); border-radius: var(--r-m); padding: var(--s-5); max-width: 460px; width: 100%; }
  .tour-card .step { font-size: 13px; color: var(--muted); margin-bottom: var(--s-2); }
  .tour-card p { margin-top: var(--s-2); }
  .tour-card .dialog-actions { display: flex; gap: var(--s-2); justify-content: flex-end; margin-top: var(--s-5); }

  /* ---------- help */
  .help { max-width: 760px; }
  .help section { margin-bottom: var(--s-6); }
  .help h2 { margin-bottom: var(--s-2); }
  .help ol, .help ul { padding-left: 1.4em; }
  .help li { margin: var(--s-1) 0; }
  .help dl { display: grid; grid-template-columns: max-content 1fr; gap: var(--s-2) var(--s-4); }
  .help dt { font-weight: 500; }
  .help dd { margin: 0; }
  @media (max-width: 640px) { .help dl { grid-template-columns: 1fr; } .help dd { margin-bottom: var(--s-2); } }

  /* ================================================================ v1.5 refinements (user feedback 2026-11-11) */

  /* Compact hero: text | four tiles | small illustration in one band, so the content below starts sooner */
  .hero { grid-template-columns: minmax(260px, 1.1fr) minmax(0, 1.6fr) 170px; padding: 16px 20px; gap: 12px 20px; margin-bottom: var(--s-4); }
  .hero h1 { font-size: clamp(20px, 2.2vw, 26px); margin: 2px 0 4px; }
  .hero-sub { font-size: 14.5px; }
  .hero-actions { margin-top: var(--s-3); gap: 8px 10px; }
  .hero-stats { grid-column: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .hero .stat { padding: 10px 12px; }
  .hero .stat .ico { width: 38px; height: 38px; }
  .hero .stat .value { font-size: clamp(22px, 2.4vw, 30px); }
  .hero-art .illus { max-width: 170px; }
  @media (max-width: 1180px) { .hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); } .hero-art { display: none; } }
  @media (max-width: 760px) { .hero { grid-template-columns: 1fr; } }
  .export-btn { background: #ece6fb; border-color: #d9cff7; color: #4b2fa3; }
  .export-btn:hover { background: #e2d9fa; }

  /* Filters: their own sky-blue tone so they stand out from content panels */
  .filters { background: linear-gradient(135deg, #eaf3ff 0%, #f4f9ff 100%); border: 1px solid #cfe0fa; border-left: 5px solid #3b82f6; border-radius: 14px; padding: 12px 16px 14px; }
  .filters.is-active { border-left-color: #c2410c; background: linear-gradient(135deg, #fff4ea 0%, #fffaf4 100%); border-color: #f6d4b8; }
  .filters-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; }
  .filters-head strong { font-size: 15px; color: #1e3a8a; }
  .filters.is-active .filters-head strong { color: #9a3412; }
  .filters-ico { width: 30px; height: 30px; border-radius: 9px; background: #3b82f6; color: #fff; display: grid; place-items: center; }
  .filters.is-active .filters-ico { background: #c2410c; }
  .filters-ico svg { width: 17px; height: 17px; }
  .filters-count { font-size: 13px; color: #1d4ed8; background: #fff; border-radius: 999px; padding: 1px 10px; border: 1px solid #cfe0fa; }
  .filters.is-active .filters-count { color: #9a3412; border-color: #f6d4b8; }
  .filters-clear { margin-left: auto; }
  .filters .field label { color: #1e3a8a; font-weight: 500; }
  .filters.is-active .field label { color: #9a3412; }
  .filters select, .filters input { border-color: #c9dbf6; background: #fff; }

  /* Banners */
  .banner.info { background: #e4f0ff; color: #1d4ed8; }
  .banner-row { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); flex-wrap: wrap; }

  /* Overdue panel with chart + encouragement */
  .od-cheer { display: flex; gap: 16px; align-items: center; background: linear-gradient(120deg, #fff5f3, #fffaf0); border: 1px solid #fadbd5; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .od-cheer > div { flex: 1; min-width: 0; }
  .od-cheer p { margin: 2px 0 8px; color: var(--muted); }
  .od-cheer .hot { color: var(--danger); }
  .od-cheer .good { color: var(--ok); }
  .ring { width: 86px; height: 86px; flex: none; }
  .ring-num { font-size: 18px; font-weight: 600; fill: var(--ink); }
  .ring-sub { font-size: 9.5px; fill: var(--muted); }
  .od-buckets { display: grid; gap: 4px; }
  .od-bucket { display: grid; grid-template-columns: 82px 1fr 36px; align-items: center; gap: 8px; font-size: 13px; }
  .od-btrack { height: 10px; background: #f6e7e4; border-radius: 6px; overflow: hidden; }
  .od-bfill { display: block; height: 100%; border-radius: 6px; }
  .od-bfill.sev-1 { background: #f59e0b; } .od-bfill.sev-2 { background: #f97316; } .od-bfill.sev-3 { background: #ef4444; } .od-bfill.sev-4 { background: #991b1b; }
  .od-list li { border-left: 4px solid transparent; padding-left: 8px; }
  .od-list li.sev-1 { border-left-color: #f59e0b; } .od-list li.sev-2 { border-left-color: #f97316; }
  .od-list li.sev-3 { border-left-color: #ef4444; } .od-list li.sev-4 { border-left-color: #991b1b; background: #fff7f6; }
  .od-clear { display: flex; gap: 12px; align-items: center; font-size: 15px; } .od-clear span { font-size: 34px; }
  /* "245 วัน" on one line, room for 3-digit numbers */
  .od-list li { grid-template-columns: 84px minmax(0, 1fr); }
  .od-days { white-space: nowrap; font-size: 19px; }
  .od-days small { display: inline; margin-left: 3px; font-size: 13px; }

  /* My Work */
  .mw-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: var(--s-4); }
  @media (max-width: 860px) { .mw-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .mw-tile { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; border-top: 5px solid var(--line); }
  .mw-tile:hover { box-shadow: 0 6px 18px rgba(15, 61, 58, 0.1); }
  .mw-tile.hot { border-top-color: #ef4444; background: #fff7f6; } .mw-tile.warm { border-top-color: #f59e0b; background: #fffbf2; }
  .mw-tile.cool { border-top-color: #3b82f6; background: #f5f9ff; } .mw-tile.good { border-top-color: #22a35a; background: #f3fbf6; }
  .mw-num { font-size: 32px; font-weight: 600; line-height: 1.1; }
  .mw-tile.hot .mw-num { color: var(--danger); } .mw-tile.good .mw-num { color: var(--ok); }
  .mw-label { font-weight: 600; } .mw-sub { font-size: 12.5px; color: var(--muted); }
  .mw-group { scroll-margin-top: 90px; }
  .mw-group h2 { font-size: 18px; }
  .mw-note { color: var(--muted); font-size: 13.5px; margin: -4px 0 8px; }
  .mw-urgent .work { border-left: 4px solid #ef4444; }
  .mw-this .work { border-left: 4px solid #f59e0b; }
  .mw-next .work { border-left: 4px solid #3b82f6; }
  .mw-donelist { margin: 0; padding-left: 1.2em; } .mw-donelist li { margin: 4px 0; }

  /* All items: larger, easier to scan for testers */
  table.responsive { font-size: 15.5px; }
  table.responsive th { font-size: 14px; }
  table.responsive td { padding: 12px 10px; }
  table.responsive .detail-cell a { font-size: 16px; font-weight: 500; color: var(--ink); }
  table.responsive .detail-cell .sub { font-size: 13.5px; margin-top: 2px; }
  table.responsive tbody tr:nth-child(even) { background: #fafcfc; }
  table.responsive .badge { font-size: 13.5px; padding: 2px 10px; }

  /* Links to Taiga / MANTIS */
  .ticket-link { display: inline-flex; align-items: center; gap: 3px; font-weight: 500; color: #1d4ed8; }
  .ticket-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; align-items: center; }
  .taiga-btn { color: #1d4ed8; border-color: #cfe0fa; }
  .nav a.nav-ext { color: #1d4ed8; }

  /* Access management */
  .access-req { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .access-req:last-child { border-bottom: 0; }
  .access-actions { display: flex; gap: 8px; }
  .access-pending { border-left: 5px solid #f59e0b; }
  .access-add { display: grid; grid-template-columns: 2fr 1.4fr 1fr auto; gap: 12px; align-items: end; }
  @media (max-width: 760px) { .access-add { grid-template-columns: 1fr; } }
  .access-table tr.st-off td { color: var(--muted); }
  .access-table tr.st-wait td:first-child { font-weight: 600; }
  .access-select { min-height: 34px; padding: 4px 8px; }

  /* Export dialog */
  dialog.export-dialog { width: min(760px, calc(100% - 32px)); max-width: none; }
  .export-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
  @media (max-width: 640px) { .export-opts { grid-template-columns: 1fr; } }
  .export-text { width: 100%; min-height: 320px; font-size: 14px; line-height: 1.6; background: var(--surface-2); }

  /* User menu (logout / switch account) */
  .user-menu { position: relative; }
  .user-menu summary { list-style: none; cursor: pointer; }
  .user-menu summary::-webkit-details-marker { display: none; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; }
  .user-pop { position: absolute; right: 0; top: 44px; z-index: 50; width: 270px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: 0 12px 32px rgba(15, 61, 58, 0.16); display: grid; gap: 8px; }
  .user-email { font-weight: 600; word-break: break-all; margin: 0; }
  .user-role { color: var(--muted); font-size: 13px; margin: 0; }
  .user-note { color: var(--muted); font-size: 12px; margin: 0; }
  .user-pop .btn { justify-content: center; }

  /* Icons on buttons, menu and field labels */
  .bi { display: inline-flex; width: 17px; height: 17px; flex: none; }
  .bi svg, .li svg { width: 100%; height: 100%; }
  .nav a { display: inline-flex; align-items: center; gap: 6px; }
  .btn .bi { margin-right: 2px; }
  .li { display: inline-flex; width: 15px; height: 15px; margin-right: 5px; vertical-align: -2px; color: inherit; opacity: 0.9; }
  .filters .li { color: #3b82f6; }
  .filters.is-active .li { color: #c2410c; }

  /* "hidden" must always win over display rules (menu links for editors/admins only) */
  [hidden] { display: none !important; }

  /* Table headers that stand apart from the rows */
  table.responsive thead th { background: #e3f3ef; color: #0b4f49; font-weight: 600; font-size: 14px; border-bottom: 2px solid #0f766e; padding: 10px; }
  table.responsive thead th:first-child { border-top-left-radius: 10px; }
  table.responsive thead th:last-child { border-top-right-radius: 10px; }
  table.responsive thead th button { color: inherit; font-weight: 600; }
  table.responsive thead th[aria-sort='ascending'], table.responsive thead th[aria-sort='descending'] { background: #cdebe4; }
  table.responsive td.system-cell { font-size: 14.5px; color: #33474c; }

  /* hero order: text | tiles | illustration */
  .hero-text { order: 1; } .hero-stats { order: 2; } .hero-art { order: 3; }
  .hero .stat .label { white-space: nowrap; }

  /* Filters fill the full width: six equal columns (head row spans all) */
  .filters { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  @media (max-width: 1100px) { .filters { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 640px) { .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 420px) { .filters { grid-template-columns: 1fr; } }
  .filters .date-row input { min-width: 0; }
  .repair-panel { border-left: 5px solid #8b5cf6; }

  /* My Work: urgent | this week side by side */
  .mw-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-4); align-items: start; }
  @media (max-width: 960px) { .mw-two { grid-template-columns: 1fr; } }
  .mw-two .work { grid-template-columns: 1fr; }
  .mw-two .work .actions { justify-content: flex-start; }
  .mw-tile.plan { border-top-color: #8b5cf6; background: #f8f5ff; }
  .mw-nodue .work { border-left: 4px solid #8b5cf6; }
  .mw-done { background: linear-gradient(120deg, #effaf3, #f7fdf9); border: 1px solid #cfeedd; border-radius: 14px; padding: 12px 16px; }

  /* ================================================================ Kanban v1.7 (eye-catching, easy to navigate) */
  :root { --g-prep: #64748b; --g-prep-soft: #eef2f7; --g-dev: #0f766e; --g-dev-soft: #ddf3ef; --g-test: #6d28d9; --g-test-soft: #ede7fd;
          --g-back: #b45309; --g-back-soft: #fdf0dc; --g-done: #15803d; --g-done-soft: #dcf5e4; --g-other: #9f1239; --g-other-soft: #fde7ec; }

  /* jump bar on top */
  .kjump { position: sticky; top: 74px; z-index: 15; display: flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.94);
           border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; margin-bottom: 12px; box-shadow: 0 4px 14px rgba(15, 61, 58, 0.06); }
  .kjump-chips { display: flex; gap: 6px; overflow-x: auto; flex: 1; scrollbar-width: thin; padding-bottom: 2px; }
  .kjump-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; border-radius: 999px; padding: 4px 10px 4px 4px; cursor: pointer; border: 1px solid transparent; color: var(--ink); }
  .kjump-chip:hover { border-color: currentColor; }
  .kjump-step { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; }
  .kjump-count { font-weight: 600; }
  .kjump-chip.hot { box-shadow: 0 0 0 2px #f59e0b inset; }
  .kjump-arrow { flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink); }
  .kjump-arrow:hover { background: var(--surface-2); }
  .kjump-all { flex: none; }
  @media (max-width: 640px) { .kjump { top: 120px; } .kjump-all { display: none; } }

  .g-prep.kjump-chip { background: var(--g-prep-soft); } .g-prep .kjump-step { background: var(--g-prep); }
