<script>
  /* App: state store, router, API client and event handling. */
  (function () {
    'use strict';
    var D = Domain;
    var KEYS = { filters: 'ehp.filters.v1', tour: 'ehp.tour.v1', name: 'ehp.myname.v1', tab: 'ehp.mytab.v1' };
    var EMPTY_FILTERS = { platform: '', pm: '', developer: '', urgency: '', from: '', to: '' };

    function store(key, value) {
      try {
        if (value === undefined) return JSON.parse(localStorage.getItem(key) || 'null');
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        return null; // storage unavailable (private mode): app still works, just doesn't remember
      }
      return value;
    }

    var state = {
      phase: 'loading',
      error: null,
      rows: [],
      byId: {},
      options: null,
      user: null,
      today: null,
      schema: { ok: true, missing: [] },
      loadedAt: '',
      filters: Object.assign({}, EMPTY_FILTERS, store(KEYS.filters) || {}),
      drill: null,
      drills: {},
      itemsQuery: '',
      itemsState: 'open',
      itemsPage: 0,
      sort: { key: 'due', dir: 1 },
      myTab: store(KEYS.tab) || 'developer',
      kanbanCollapsed: store('ehp.kcollapsed.v1') || {},
      choosingName: false,
      formErrors: null,
      formWarnings: null,
      formDraft: null,
      formAlert: null,
      tourStep: null,
    };

    state.registerDrill = function (title, ids) {
      var key = 'd' + Object.keys(state.drills).length;
      state.drills[key] = { title: title, ids: ids.slice() };
      return key;
    };
    var COLS_KEY = 'ehp.itemcols.v1';
    /** Column order for the items table: saved order (known keys only) + any new columns, else the default. */
    state.itemCols = function () {
      var def = Views.ITEM_COLS_DEFAULT;
      var saved = store(COLS_KEY);
      if (!Array.isArray(saved)) return def.slice();
      var order = saved.filter(function (k) { return def.indexOf(k) !== -1; });
      def.forEach(function (k) { if (order.indexOf(k) === -1) order.push(k); });
      return order;
    };
    function saveCols(order) {
      store(COLS_KEY, order);
      render();
    }
    function moveCol(key, toIndex) {
      var order = state.itemCols();
      var from = order.indexOf(key);
      if (from === -1 || toIndex < 0 || toIndex >= order.length) return;
      order.splice(toIndex, 0, order.splice(from, 1)[0]);
      saveCols(order);
    }
    state.moveCol = moveCol;

    state.myName = function () {
      return (state.user && state.user.name) || store(KEYS.name) || '';
    };
    state.domainFilters = function () {
      var f = state.filters;
      var one = function (v) { return v ? [v] : []; };
      var from = D.parseDate(f.from);
      var to = D.parseDate(f.to);
      return {
        platform: one(f.platform), pm: one(f.pm), developer: one(f.developer), urgency: one(f.urgency),
        dateFrom: from.issue ? null : from.date, dateTo: to.issue ? null : to.date,
      };
    };
    state.filteredRows = function () {
      return D.applyFilters(state.rows, state.domainFilters());
    };
    state.itemRows = function () {
      var list = state.drill
        ? D.applyFilters(state.rows, { ids: state.drill.ids })
        : D.applyFilters(state.rows, Object.assign(state.domainFilters(), { state: state.itemsState === 'all' ? null : state.itemsState }));
      list = D.search(list, state.itemsQuery);
      return sortRows(list);
    };

    function sortRows(list) {
      var k = state.sort.key;
      var dir = state.sort.dir;
      var val = function (r) {
        if (k === 'due') return r.effectiveDue ? r.effectiveDue.y * 10000 + r.effectiveDue.m * 100 + r.effectiveDue.d : 99999999;
        if (k === 'seq') return r.seq === null ? 1e9 : r.seq;
        if (k === 'status') return D.statusRank(r.status);
        if (k === 'urgency') return D.urgencyRank(r.urgency);
        return r[k] || '￿';
      };
      return list.slice().sort(function (a, b) {
        var x = val(a);
        var y = val(b);
        return (x < y ? -1 : x > y ? 1 : (a.seq || 0) - (b.seq || 0)) * dir;
      });
    }

    // ------------------------------------------------------------------ API

    function api(name, arg) {
      return new Promise(function (resolve) {
        google.script.run
          .withSuccessHandler(function (res) {
            resolve(res || { ok: false, code: 'ERROR', message: 'ไม่ได้รับข้อมูลจากเซิร์ฟเวอร์' });
          })
          .withFailureHandler(function (err) {
            console.error(name, err);
            resolve({ ok: false, code: 'ERROR', message: 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่' });
          })[name](arg);
      });
    }

    function load() {
      state.phase = state.rows.length ? 'refreshing' : 'loading';
      if (state.phase === 'loading') render();
      return api('Api_bootstrap').then(function (res) {
        if (!res.ok) {
          state.phase = 'error';
          state.error = res.message;
          return render();
        }
        var b = res.data;
        state.today = b.today;
        state.user = b.user;
        state.options = b.options;
        state.schema = b.schema;
        state.loadedAt = b.loadedAt;
        var rows = b.rows.map(function (r) { return D.enrich(r, b.today); });
        var seqCounts = D.countSeq(rows);
        state.byId = {};
        rows.forEach(function (r) {
          r.issues = D.detectIssues(r, b.options, seqCounts);
          // duplicate ลำดับ must not share an id, or links/moves could hit the wrong row
          if (r.seq !== null && seqCounts[r.seq] > 1) r.id = 'row:' + r.rowNumber;
          state.byId[r.id] = r;
        });
        state.rows = rows;
        state.phase = 'ready';
        document.getElementById('sheet-name').textContent = b.spreadsheetName;
        document.getElementById('nav-add').hidden = !(b.user.canEdit && b.schema.ok);
        document.getElementById('nav-access').hidden = !b.user.isAdmin;
        var menu = document.getElementById('user-menu');
        menu.hidden = !b.user.email;
        document.getElementById('user-email').textContent = b.user.email || '';
        document.getElementById('user-avatar').textContent = (b.user.email || '?').charAt(0).toUpperCase();
        document.getElementById('user-role').textContent = b.user.isAdmin ? 'ผู้ดูแล' : b.user.canEdit ? 'ผู้แก้ไข' : 'ดูอย่างเดียว';
        state.access = null;
        render();
        // offer the tour once per page load, never again after saves/reloads (or when storage is blocked)
        if (!state.tourOffered) {
          state.tourOffered = true;
          if (!store(KEYS.tour)) startTour();
        }
      });
    }

    // ------------------------------------------------------------------ router & render

    /*
     * Routing. In Apps Script the app runs inside a sandboxed iframe: the visible URL belongs to the outer
     * page, so the iframe's own location/hashchange cannot drive navigation. The current route lives in
     * `currentHash`; links are intercepted, and the outer URL is kept in sync with google.script.history
     * (back/forward via setChangeHandler, deep links via google.script.url). Outside Apps Script (local
     * preview, tests) the browser hash is used instead.
     */
    var gasHistory = window.google && google.script && google.script.history;
    var currentHash = gasHistory ? '#/monitor' : location.hash || '#/monitor';

    function route() {
      var h = (currentHash || '#/monitor').slice(2).split('/');
      return { name: h[0] || 'monitor', id: h[1] ? decodeURIComponent(h[1]) : null };
    }

    function showRoute(hash) {
      currentHash = hash || '#/monitor';
      resetForm();
      render();
      document.getElementById('main').focus({ preventScroll: true });
      window.scrollTo(0, 0);
    }

    function render() {
      var main = document.getElementById('main');
      var r = route();
      document.querySelectorAll('.nav a').forEach(function (a) {
        var active = a.getAttribute('data-route') === r.name;
        if (active) a.setAttribute('aria-current', 'page');
        else a.removeAttribute('aria-current');
      });
      if (state.phase === 'loading') return (main.innerHTML = UI.loading('กำลังโหลดข้อมูลจากชีต…'));
      if (state.phase === 'error') return (main.innerHTML = UI.errorState(state.error, 'reload'));
      state.drills = {};
      var html;
      if (r.name === 'items' && r.id) {
        var row = state.byId[r.id];
        html = row ? Views.form(state, 'edit', row) : UI.emptyState('ไม่พบรายการนี้', 'รายการอาจถูกเปลี่ยนเลขลำดับในชีต ลองโหลดข้อมูลใหม่', '<a class="btn" href="#/items">กลับไปที่รายการทั้งหมด</a>');
      } else if (r.name === 'items') html = Views.items(state);
      else if (r.name === 'new') html = Views.form(state, 'new', null);
      else if (r.name === 'my-work') html = Views.myWork(state);
      else if (r.name === 'kanban') html = Views.kanban(state);
      else if (r.name === 'access') {
        if (state.user.isAdmin && !state.access && !state.accessLoading) loadAccess();
        html = Views.access(state);
      }
      else if (r.name === 'help') html = Views.help(state);
      else html = Views.monitor(state);
      if (state.tourStep !== null) html += Views.tour(state.tourStep);
      main.innerHTML = html;
      if (r.name === 'monitor' && !state.introPlayed) playIntro(main);
    }

    /**
     * The one orchestrated entrance (first Monitor view of a page load): hero rises, pipeline grows,
     * headline numbers count up. Skipped for reduced motion and for automated browsers (tests read numbers).
     */
    function playIntro(main) {
      state.introPlayed = true;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduced || navigator.webdriver) return;
      main.classList.add('intro');
      setTimeout(function () { main.classList.remove('intro'); }, 2200);
      var els = main.querySelectorAll('.hero .stat .value');
      var targets = Array.prototype.map.call(els, function (el) { return Number(el.textContent.replace(/[^\d]/g, '')) || 0; });
      var start = null;
      var DURATION = 1100;
      function frame(t) {
        if (start === null) start = t;
        var p = Math.min(1, (t - start) / DURATION);
        var eased = 1 - Math.pow(1 - p, 3);
        els.forEach(function (el, i) {
          if (el.isConnected) el.textContent = Math.round(targets[i] * eased).toLocaleString('th-TH');
        });
        if (p < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // Pages visited in this session, for the in-app "← กลับ" button (the browser back button also works).
    var navStack = [];

    function go(hash, opts) {
      if (hash !== currentHash && !(opts && opts.back)) navStack.push(currentHash);
      if (gasHistory) {
        if (hash !== currentHash) gasHistory.push(null, null, hash.slice(1));
        return showRoute(hash);
      }
      if (location.hash === hash) render();
      else location.hash = hash; // hashchange → showRoute
    }

    /** Where "กลับ" goes when the page was opened directly (no history in this session). */
    function parentOf(r) {
      if (r.name === 'items' && r.id) return '#/items';
      if (r.name === 'items' && state.drill) return '#/monitor';
      return '#/monitor';
    }

    function back() {
      var target = navStack.pop() || parentOf(route());
      if (target === '#/monitor') state.drill = null; // leaving a drill-down for its source
      go(target, { back: true });
    }

    /** Keep navStack in step when the browser's own back/forward is used. */
    function onExternalNav(hash) {
      if (navStack.length && navStack[navStack.length - 1] === hash) navStack.pop();
      showRoute(hash);
    }

    function resetForm() {
      state.formErrors = state.formWarnings = state.formDraft = state.formAlert = null;
    }

    if (gasHistory) {
      gasHistory.setChangeHandler(function (e) {
        onExternalNav('#' + ((e && e.location && e.location.hash) || '/monitor'));
      });
      if (google.script.url) {
        google.script.url.getLocation(function (loc) {
          if (loc && loc.hash) showRoute('#' + loc.hash); // deep link like …/exec#/kanban
        });
      }
    } else {
      window.addEventListener('hashchange', function () {
        if (location.hash !== currentHash) onExternalNav(location.hash);
      });
    }

    // In-app links ("#/…") never leave the iframe: route them through go().
    document.addEventListener('click', function (ev) {
      var a = ev.target.closest && ev.target.closest('a[href^="#/"]');
      if (!a || ev.defaultPrevented || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
      ev.preventDefault();
      go(a.getAttribute('href'));
    });

    // ------------------------------------------------------------------ form helpers

    function todaySheet() {
      return D.formatDate(state.today);
    }

    /** Read the form into sheet-format strings; unchanged-but-different-looking values keep the original. */
    function collect(form, original) {
      var out = {};
      D.COLUMNS.forEach(function (c) {
        if (c.key === 'seq') return;
        var el = form.elements[c.key];
        if (!el) return;
        var v = el.value.trim();
        var orig = original ? original[c.key] || '' : '';
        if (c.type === 'date') {
          var origCell = D.parseDate(orig);
          var typed = D.parseDate(v);
          if (!v) v = origCell.issue ? orig : ''; // untouched unparseable value stays as-is
          else if (typed.date && !typed.issue) {
            // same date written differently (05/01 vs 5/1) is not a change; otherwise normalize to d/m/yyyy
            v = origCell.date && !origCell.issue && D.compareDate(origCell.date, typed.date) === 0 ? orig : D.formatDate(typed.date);
          } // invalid text is kept so validation can point at it
        }
        out[c.key] = v;
      });
      return out;
    }

    /**
     * Show a failed save once. In a form the details go next to the fields / in the banner;
     * for quick actions (My Work, Kanban) there is no form, so one toast carries the details.
     */
    function failMessage(res, inForm) {
      var fields = (res.details && res.details.fields) || {};
      if (!inForm) {
        var why = Object.keys(fields).map(function (k) { return fields[k]; }).filter(Boolean);
        return UI.toast(res.message + (why.length ? ': ' + why.join(', ') : ''), 'error');
      }
      if (res.code === 'VALIDATION') {
        state.formErrors = fields;
        return UI.toast(res.message, 'error');
      }
      var reload = res.code === 'CONFLICT' || res.code === 'SEQ_MISMATCH' || res.code === 'NOT_FOUND';
      state.formAlert = { message: res.message, reload: reload };
      if (res.code === 'CONFLICT' && res.details) {
        state.formAlert.message += ' (ช่องที่ถูกแก้: ' + Object.keys(res.details).map(function (k) {
          return D.COLUMN_BY_KEY[k] ? D.COLUMN_BY_KEY[k].header + ' = "' + res.details[k].actual + '"' : k;
        }).join(', ') + ')';
      }
    }

    function submitForm(form) {
      var mode = form.getAttribute('data-mode');
      var r = route();
      var row = mode === 'edit' ? state.byId[r.id] : null;
      var values = collect(form, row ? row.raw : null);
      state.formDraft = values;
      state.formAlert = null;
      var btn = document.getElementById('save-btn');
      if (mode === 'new') {
        var v = D.validateCreate(values, state.options);
        state.formErrors = v.errors;
        state.formWarnings = v.warnings;
        if (!v.ok) {
          render();
          return focusFirstError();
        }
        btn.disabled = true;
        btn.textContent = 'กำลังบันทึก…';
        return api('Api_createRequest', values).then(function (res) {
          if (!res.ok) {
            failMessage(res, true);
            return render();
          }
          UI.toast('บันทึกรายการใหม่แล้ว ลำดับที่ ' + res.data.seq);
          resetForm();
          return load().then(function () { go('#/items/' + res.data.seq); });
        });
      }
      var changes = D.diffChanges(row.raw, values);
      if (!Object.keys(changes).length) return UI.toast('ยังไม่มีช่องไหนเปลี่ยน');
      var vu = D.validateUpdate(changes, row.raw, state.options);
      state.formErrors = vu.errors;
      state.formWarnings = vu.warnings;
      if (!vu.ok) {
        render();
        return focusFirstError();
      }
      return saveChanges(row, changes, btn);
    }

    function saveChanges(row, changes, btn) {
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'กำลังบันทึก…';
      }
      return api('Api_updateRequest', { rowNumber: row.rowNumber, seq: row.seq, changes: changes }).then(function (res) {
        if (!res.ok) {
          failMessage(res, !!btn);
          render();
          return false;
        }
        UI.toast('บันทึกการแก้ไขแล้ว (' + res.data.written.map(function (k) { return D.COLUMN_BY_KEY[k].header; }).join(', ') + ')');
        resetForm();
        return load().then(function () { return true; });
      });
    }

    /** Change one item's status (My Work quick action and Kanban); same safe-write path as the form. */
    function moveStatus(id, to) {
      var row = state.byId[id];
      if (!row || row.status === to) return;
      if (!state.user.canEdit) return UI.toast('บัญชีนี้มีสิทธิ์ดูอย่างเดียว', 'error');
      var changes = { status: { from: row.raw.status, to: to } };
      if (to === D.DONE && !row.doneDate.date) changes.doneDate = { from: row.raw.doneDate, to: todaySheet() };
      return saveChanges(row, changes, null);
    }

    // ------------------------------------------------------------------ calendar popover (date fields)

    var cal = null; // { target, y, m, opener }

    function drawCalendar() {
      document.querySelectorAll('.cal').forEach(function (c) { c.remove(); });
      var input = document.getElementById(cal.target);
      if (!input) return (cal = null);
      var typed = D.parseDate(input.value);
      var host = input.closest('.field');
      host.insertAdjacentHTML('beforeend', UI.calendar(cal.target, cal.y, cal.m, typed.issue ? null : typed.date, state.today));
      var pick = host.querySelector('.cal [aria-pressed="true"]') || host.querySelector('.cal .today') || host.querySelector('.cal .cal-day');
      if (pick) pick.focus();
    }

    function closeCalendar() {
      document.querySelectorAll('.cal').forEach(function (c) { c.remove(); });
      if (cal && cal.opener && document.body.contains(cal.opener)) cal.opener.focus();
      cal = null;
    }

    document.addEventListener('click', function (ev) {
      if (cal && !ev.target.closest('.cal') && !ev.target.closest('[data-action="cal-open"]')) closeCalendar();
    }, true);

    // ------------------------------------------------------------------ access management (admins)

    function loadAccess() {
      state.accessLoading = true;
      api('Api_listAccess').then(function (res) {
        state.accessLoading = false;
        state.access = res.ok ? res.data : { error: res.message };
        if (route().name === 'access') render();
      });
    }

    function saveAccess(input) {
      api('Api_saveAccess', input).then(function (res) {
        if (!res.ok) {
          var fields = (res.details && res.details.fields) || {};
          var why = Object.keys(fields).map(function (k) { return fields[k]; });
          UI.toast(res.message + (why.length ? ': ' + why.join(', ') : ''), 'error');
        } else {
          UI.toast('บันทึกสิทธิ์ของ ' + res.data.email + ' แล้ว (' + res.data.role + ', ' + res.data.status + ')');
        }
        state.access = null;
        render();
      });
    }

    // ------------------------------------------------------------------ text report export

    var REPORT_KEY = 'ehp.report.since.v1';
    var exportOpts = null;

    function reportRows() {
      return D.applyFilters(state.rows, { pm: exportOpts.pm ? [exportOpts.pm] : [] });
    }
    function reportText() {
      return D.buildReport(reportRows(), state.today, { sinceSeq: exportOpts.since, pm: exportOpts.pm });
    }
    function openExport() {
      var saved = store(REPORT_KEY);
      exportOpts = { pm: state.filters.pm || '', since: typeof saved === 'number' ? saved : null };
      var dlg = document.getElementById('dialog');
      dlg.className = 'export-dialog';
      dlg.innerHTML = '<form id="export-form" method="dialog">' + Views.exportDialog(state, exportOpts, reportText()) + '</form>';
      dlg.showModal();
    }
    function refreshExport() {
      var form = document.getElementById('export-form');
      var sinceRaw = form.elements['rep-since'].value.trim();
      exportOpts.pm = form.elements['rep-pm'].value;
      exportOpts.since = /^\d+$/.test(sinceRaw) ? Number(sinceRaw) : null;
      document.getElementById('rep-text').value = reportText();
    }
    /** Next report's "new items" start after the highest ลำดับ in this one. */
    function rememberReportBaseline() {
      store(REPORT_KEY, D.nextSeq(state.rows) - 1);
    }

    function focusFirstError() {
      var el = document.querySelector('[aria-invalid="true"]');
      if (el) el.focus();
    }

    // ------------------------------------------------------------------ tour

    function startTour() {
      state.tourStep = 0;
      render();
    }
    function endTour() {
      state.tourStep = null;
      store(KEYS.tour, true);
      render();
    }

    // ------------------------------------------------------------------ events

    var actions = {
      reload: function () { load(); },
      'reload-item': function () { resetForm(); load(); },
      drill: function (el) {
        state.drill = state.drills[el.getAttribute('data-drill')];
        state.itemsPage = 0;
        state.itemsQuery = '';
        go('#/items');
      },
      'clear-drill': function () { state.drill = null; render(); },
      'clear-filters': function () {
        state.filters = Object.assign({}, EMPTY_FILTERS);
        store(KEYS.filters, state.filters);
        render();
      },
      'items-state': function (el) { state.itemsState = el.getAttribute('data-value'); state.itemsPage = 0; render(); },
      sort: function (el) {
        var k = el.getAttribute('data-key');
        state.sort = { key: k, dir: state.sort.key === k ? -state.sort.dir : 1 };
        render();
      },
      page: function (el) { state.itemsPage += Number(el.getAttribute('data-dir')); render(); window.scrollTo(0, 0); },
      'open-item': function (el, ev) {
        if (ev.target.closest('a')) return;
        go('#/items/' + encodeURIComponent(el.getAttribute('data-id')));
      },
      'cancel-item': function () {
        var row = state.byId[route().id];
        UI.confirm('ยกเลิกรายการ #' + row.seq + '?', 'ระบบจะเปลี่ยนสถานะเป็น "0.ยกเลิก" แถวในชีตยังอยู่ และย้อนกลับได้โดยเปลี่ยนสถานะใหม่', 'ยกเลิกรายการ', true).then(function (yes) {
          if (yes) saveChanges(row, { status: { from: row.raw.status, to: D.CANCELLED } }, null);
        });
      },
      tab: function (el) { state.myTab = el.getAttribute('data-tab'); store(KEYS.tab, state.myTab); render(); },
      'change-name': function () { state.choosingName = true; render(); },
      'quick-status': function (el) {
        el.disabled = true;
        el.textContent = 'กำลังบันทึก…';
        moveStatus(el.getAttribute('data-id'), el.getAttribute('data-to'));
      },
      kmove: function (el) {
        el.disabled = true;
        moveStatus(el.getAttribute('data-id'), el.getAttribute('data-to'));
      },
      'cal-open': function (el) {
        var id = el.getAttribute('data-target');
        if (cal && cal.target === id) return closeCalendar();
        var typed = D.parseDate(document.getElementById(id).value);
        var base = typed.date && !typed.issue ? typed.date : state.today;
        cal = { target: id, y: base.y, m: base.m, opener: el };
        drawCalendar();
      },
      'cal-nav': function (el) {
        var n = cal.m + Number(el.getAttribute('data-dir'));
        cal.y += n < 1 ? -1 : n > 12 ? 1 : 0;
        cal.m = ((n + 11) % 12) + 1;
        drawCalendar();
      },
      'cal-pick': function (el) {
        var input = document.getElementById(cal.target);
        input.value = el.getAttribute('data-date');
        input.dispatchEvent(new Event('change', { bubbles: true }));
        closeCalendar();
        input.focus();
      },
      'cal-close': function () {
        closeCalendar();
      },
      back: back,
      'cols-toggle': function () { state.colsOpen = !state.colsOpen; render(); },
      'cols-move': function (el) {
        var key = el.getAttribute('data-key');
        moveCol(key, state.itemCols().indexOf(key) + Number(el.getAttribute('data-dir')));
        var again = document.querySelector('.cols-move[data-key="' + key + '"][data-dir="' + el.getAttribute('data-dir') + '"]');
        if (again && !again.disabled) again.focus();
      },
      'cols-reset': function () { saveCols(Views.ITEM_COLS_DEFAULT.slice()); },
      kjump: function (el) {
        var col = document.querySelector('.kcol[data-status="' + el.getAttribute('data-status').replace(/"/g, '\\"') + '"]');
        if (col) col.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
      },
      kscroll: function (el) {
        var board = document.querySelector('.board');
        if (board) board.scrollBy({ left: Number(el.getAttribute('data-dir')) * Math.max(300, board.clientWidth * 0.8), behavior: 'smooth' });
      },
      kcollapse: function (el) {
        var key = el.getAttribute('data-status');
        if (state.kanbanCollapsed[key]) delete state.kanbanCollapsed[key];
        else state.kanbanCollapsed[key] = true;
        store('ehp.kcollapsed.v1', state.kanbanCollapsed);
        render();
      },
      'kcollapse-all': function () {
        if (Object.keys(state.kanbanCollapsed).length) state.kanbanCollapsed = {};
        else {
          document.querySelectorAll('.kcol').forEach(function (c) {
            if (c.querySelector('.kempty')) state.kanbanCollapsed[c.getAttribute('data-status')] = true;
          });
        }
        store('ehp.kcollapsed.v1', state.kanbanCollapsed);
        render();
      },
      'request-access': function (el) {
        el.disabled = true;
        api('Api_requestAccess', { name: state.myName() }).then(function (res) {
          if (!res.ok) return UI.toast(res.message, 'error');
          state.user.editReason = res.data.status === 'อนุญาต' ? 'OK' : 'PENDING';
          UI.toast(res.data.status === 'อนุญาต' ? 'คุณมีสิทธิ์อยู่แล้ว กดโหลดข้อมูลใหม่' : 'ส่งคำขอแล้ว รอผู้ดูแลอนุมัติ');
          render();
        });
      },
      'reload-access': function () { state.access = null; render(); },
      'repair-chips': function (el) {
        el.disabled = true;
        el.textContent = 'กำลังซ่อม…';
        api('Api_repairChips').then(function (res) {
          if (!res.ok) UI.toast(res.message, 'error');
          else UI.toast('ซ่อมแล้ว ' + res.data.repaired + ' ช่อง (ข้าม ' + res.data.skipped + ' ช่องที่มีคนแก้ต่อแล้ว)');
          render();
        });
      },
      'access-set': function (el) {
        var input = { email: el.getAttribute('data-email') };
        input[el.getAttribute('data-field')] = el.getAttribute('data-value');
        el.disabled = true;
        saveAccess(input);
      },
      'export-open': openExport,
      'export-close': function () { document.getElementById('dialog').close(); },
      'export-copy': function () {
        var ta = document.getElementById('rep-text');
        ta.focus();
        ta.select();
        var done = function () { rememberReportBaseline(); UI.toast('คัดลอกข้อความแล้ว วางใน LINE หรืออีเมลได้เลย'); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(ta.value).then(done, function () {
            UI.toast('คัดลอกอัตโนมัติไม่ได้ ข้อความถูกเลือกไว้แล้ว กด Ctrl+C (มือถือ: กดค้างแล้วเลือกคัดลอก)', 'error');
          });
        } else {
          UI.toast('ข้อความถูกเลือกไว้แล้ว กด Ctrl+C เพื่อคัดลอก');
        }
      },
      'export-download': function () {
        var text = document.getElementById('rep-text').value;
        var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'สรุปรายการขอแก้ไข-' + D.formatDate(state.today).split('/').join('-') + '.txt';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
        rememberReportBaseline();
      },
      'mw-jump': function (el, ev) {
        ev.preventDefault();
        var t = document.getElementById(el.getAttribute('data-target'));
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },
      'tour-start': startTour,
      'tour-next': function () {
        if (state.tourStep >= Views.TOUR_STEPS - 1) return endTour();
        state.tourStep++;
        render();
      },
      'tour-skip': endTour,
    };

    document.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-action]');
      if (!el || !actions[el.getAttribute('data-action')]) return;
      if (el.tagName === 'A') ev.preventDefault();
      actions[el.getAttribute('data-action')](el, ev);
    });

    document.addEventListener('change', function (ev) {
      var form = ev.target.form;
      if (ev.target.classList && ev.target.classList.contains('access-select')) {
        var input = { email: ev.target.getAttribute('data-email') };
        input[ev.target.getAttribute('data-field')] = ev.target.value;
        return saveAccess(input);
      }
      if (form && form.id === 'export-form') return refreshExport();
      if (form && form.id === 'filters') {
        ['platform', 'pm', 'developer', 'urgency', 'from', 'to'].forEach(function (k) { state.filters[k] = form.elements[k].value; });
        store(KEYS.filters, state.filters);
        state.itemsPage = 0;
        render();
      } else if (form && form.id === 'item-form' && ev.target.name === 'status' && ev.target.value === D.DONE) {
        var done = form.elements.doneDate;
        if (done && !done.value) {
          done.value = todaySheet();
          UI.toast('ใส่วันที่เสร็จเป็นวันนี้ให้แล้ว แก้ได้ถ้าไม่ใช่');
        }
      }
    });

    var searchTimer = null;
    document.addEventListener('input', function (ev) {
      if (ev.target.id !== 'q') return;
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () {
        state.itemsQuery = ev.target.value;
        state.itemsPage = 0;
        var pos = ev.target.selectionStart;
        render();
        var q = document.getElementById('q');
        q.focus();
        q.setSelectionRange(pos, pos);
      }, 150);
    });

    document.addEventListener('submit', function (ev) {
      var form = ev.target;
      if (form.id === 'item-form') {
        ev.preventDefault();
        submitForm(form);
      } else if (form.id === 'access-add') {
        ev.preventDefault();
        var email = form.elements['acc-email'].value.trim();
        if (!email) return UI.toast('กรุณากรอกอีเมล', 'error');
        saveAccess({ email: email, name: form.elements['acc-name'].value, role: form.elements['acc-role'].value, status: state.access.states.allowed });
      } else if (form.id === 'export-form') {
        ev.preventDefault();
      } else if (form.id === 'name-form') {
        ev.preventDefault();
        var name = form.elements.myname.value;
        if (!name) return UI.toast('กรุณาเลือกชื่อของคุณ', 'error');
        store(KEYS.name, name);
        state.choosingName = false;
        if (state.user) state.user.name = name;
        render();
        api('Api_setMyName', name).then(function (res) {
          if (!res.ok && res.code !== 'FORBIDDEN' && res.code !== 'NOT_ALLOWED') UI.toast(res.message, 'error');
        });
      }
    });

    // Items table: drag a column header onto another to move it ("จัดคอลัมน์" is the keyboard/touch alternative)
    var dragCol = null;
    document.addEventListener('dragstart', function (ev) {
      var th = ev.target.closest && ev.target.closest('th[data-col]');
      if (!th) return;
      dragCol = th.getAttribute('data-col');
      ev.dataTransfer.setData('text/plain', 'col:' + dragCol);
      ev.dataTransfer.effectAllowed = 'move';
    });
    document.addEventListener('dragover', function (ev) {
      if (dragCol && ev.target.closest && ev.target.closest('th[data-col]')) ev.preventDefault();
    });
    document.addEventListener('drop', function (ev) {
      var th = dragCol && ev.target.closest && ev.target.closest('th[data-col]');
      if (!th) return;
      ev.preventDefault();
      moveCol(dragCol, state.itemCols().indexOf(th.getAttribute('data-col')));
      dragCol = null;
    });
    document.addEventListener('dragend', function () { dragCol = null; });

    // Kanban drag & drop (buttons ◀ ▶ are the keyboard/touch alternative)
    document.addEventListener('dragstart', function (ev) {
      var card = ev.target.closest && ev.target.closest('.kcard[draggable="true"]');
      if (!card) return;
      ev.dataTransfer.setData('text/plain', card.getAttribute('data-id'));
      ev.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    document.addEventListener('dragend', function (ev) {
      if (ev.target.classList) ev.target.classList.remove('dragging');
      document.querySelectorAll('.kcol.drop-target').forEach(function (c) { c.classList.remove('drop-target'); });
    });
    document.addEventListener('dragover', function (ev) {
      var col = ev.target.closest && ev.target.closest('.kcol:not(.other)'); // the "other" column is not a drop target
      if (!col) return;
      ev.preventDefault();
      document.querySelectorAll('.kcol.drop-target').forEach(function (c) { if (c !== col) c.classList.remove('drop-target'); });
      col.classList.add('drop-target');
    });
    document.addEventListener('drop', function (ev) {
      var col = ev.target.closest && ev.target.closest('.kcol:not(.other)'); // the "other" column is not a drop target
      if (!col) return;
      ev.preventDefault();
      col.classList.remove('drop-target');
      moveStatus(ev.dataTransfer.getData('text/plain'), col.getAttribute('data-status'));
    });

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && cal) {
        ev.preventDefault();
        return closeCalendar();
      }
      if (ev.key === 'Escape' && state.tourStep !== null) endTour();
      if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('tr[data-action]')) {
        ev.preventDefault();
        actions['open-item'](ev.target, ev);
      }
    });

    // menu icons (decorative; link text stays the accessible name)
    document.querySelectorAll('.nav a[data-icon]').forEach(function (el) {
      el.insertAdjacentHTML('afterbegin', '<span class="bi">' + UI.icon(el.getAttribute('data-icon')) + '</span>');
    });

    load();
  })();
</script>
