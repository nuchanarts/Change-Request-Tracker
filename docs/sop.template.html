    <style>
      :root {
        --ink: #1c2b2f;
        --muted: #55686d;
        --accent: #0f766e;
        --line: #d9e2e4;
        --surface-2: #f1f5f6;
        --paper: #ffffff;
        --bg: #f6faf9;
        --focus: #1d4ed8;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e4ecee;
          --muted: #a3b4b8;
          --accent: #5eead4;
          --line: #34474c;
          --surface-2: #1f2d31;
          --paper: #172226;
          --bg: #0f191c;
          --focus: #93c5fd;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; color: var(--ink); background: var(--bg);
        font: 400 16px/1.65 'IBM Plex Sans Thai', 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
        overflow-x: hidden;
      }
      header, main { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
      header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 20px; }
      .brand { display: flex; align-items: center; gap: 10px; color: var(--accent); font-weight: 600; text-decoration: none; }
      .brand svg { width: 32px; height: 32px; }
      .ver { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-weight: 400; }
      .go { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 20px; border-radius: 999px; background: var(--accent); color: var(--paper); font-weight: 600; text-decoration: none; }
      main { padding-bottom: 48px; }
      :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
      code { font-family: inherit; background: var(--surface-2); border-radius: 4px; padding: 0 4px; }
      .sop { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 8px 24px 24px; margin-top: 20px; }
      .sop h2 { font-size: clamp(22px, 3.4vw, 30px); line-height: 1.3; }
      .sop h3 { margin: 28px 0 8px; }
      .sop h4 { margin: 0 0 4px; }
      .sop-meta, .sop-note { color: var(--muted); font-size: 0.92em; }
      .sop-table { overflow-x: auto; margin: 8px 0; border-radius: 8px; }
      .sop table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 0.94em; }
      .sop th, .sop td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
      .sop thead th { background: var(--surface-2); }
      .sop tbody th { font-weight: 500; }
      .sop-raci td { text-align: center; white-space: nowrap; }
      .sop-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
      .sop-cards > div { border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
      ul, ol { padding-left: 1.4em; }
      @media (max-width: 640px) { .sop { padding: 4px 14px 16px; } }
      @media print { .go { display: none; } .sop { border: 0; padding: 0; } body { background: #fff; color: #000; } }
    </style>
